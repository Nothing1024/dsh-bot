  cursor: not-allowed;
  pointer-events: none;
}

  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,

.form-switch .form-check-input:checked {

  top: calc(100% + 6px);
  right: 0;
  z-index: 6;
  min-width: 160px;
  margin: 0;
}

.sessionListEmpty {
  margin: 0;
  padding: 8px;
}

.sessionOption {
  appearance: none;
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  border: 0;
  background: transparent;
  color: var(--wb-text);
  font: inherit;
  text-align: left;
  padding: 8px;
  border-radius: 8px;
  cursor: pointer;
}

.sessionOption:hover {
  background: var(--wb-hover);
}

.sessionOption.isSelected {
  background: light-dark(#e5ecfa, #243044);
}

.sessionOptionMain {
  min-width: 0;
  display: flex;
  align-items: center;
  gap: 6px;
}

.sessionOptionTitle {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.sessionOptionWorking {
  flex: none;
  font-size: 10px;
  color: #3dd68c;
}

.sessionOptionTime {
  flex: none;
  color: var(--wb-muted);
  font-size: 11px;
}

.sessionListNew {
  appearance: none;
  width: 100%;
  margin-top: 4px;
  border: 0;
  background: transparent;
  color: var(--wb-muted);
  font: inherit;
  text-align: left;
  padding: 8px;
  border-radius: 8px;
  cursor: pointer;
}

.sessionListNew:hover {
  background: var(--wb-hover);
  color: var(--wb-text);
}

.sessionListHidden {
  margin: 4px 8px 2px;
}

.hiddenToggle {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 11px;
  font-weight: 500;
  color: var(--wb-muted);
  white-space: nowrap;
  cursor: pointer;
}

.workingBadge {
  font-size: 11px;
  font-weight: 500;
  color: #3dd68c;
  border: 1px solid #3dd68c55;
  border-radius: 999px;
  padding: 1px 8px;
  animation: wb-badge-pulse 1.6s ease-in-out infinite;
}

.avatar.isLive {
  animation: wb-avatar-breathe 1.6s ease-in-out infinite;
}

.visuallyHidden {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
}

.emptyChat {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
  color: var(--wb-muted);
  text-align: center;
  padding: 24px;
}

.emptyChat p {
  margin: 0;
}

.transcript {
  flex: 1;
  min-height: 0;
  overflow: auto;
  padding: 16px 20px 8px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.bubbleWrap {
  display: flex;
  animation: wb-enter 0.22s cubic-bezier(0.16, 1, 0.3, 1);
}

.bubbleWrap.user,
.bubbleWrap.user {
  justify-content: flex-end;
}

.bubbleWrap.assistant {
  justify-content: flex-start;
}

.bubble {
  max-width: min(72%, 560px);
  padding: 8px 12px;
  border-radius: 14px;
  white-space: pre-wrap;
  word-break: break-word;
}

.bubble.user {
  background: #2c4a7c;
  color: #fff;
  border-bottom-right-radius: 4px;
}

.bubble.assistant {
  background: light-dark(#edf0f4, #222830);
  color: var(--wb-text);
  border-bottom-left-radius: 4px;
  white-space: normal;
}

.md {
  display: flex;
  flex-direction: column;
  gap: 0.55em;
}

.md p,
.md ul,
.md ol,
.md blockquote,
.md pre,
.md h1,
.md h2,
.md h3,
.md table {
  margin: 0;
}

.md h1,
.md h2,
.md h3 {
  font-size: 13px;
  font-weight: 650;
}

.md ul,
.md ol {
  padding-left: 1.25em;
}

.md blockquote {
  border-left: 3px solid var(--wb-border);
  padding-left: 8px;
  color: var(--wb-muted);
}

.md a {
  color: var(--wb-accent);
}

.md code {
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 0.92em;
  background: light-dark(#ffffff, #12151a);
  border-radius: 4px;
  padding: 0.05em 0.35em;
}

.md pre {
  background: light-dark(#ffffff, #12151a);
  border: 1px solid var(--wb-border);
  border-radius: 8px;
  padding: 8px 10px;
  overflow: auto;
  white-space: pre-wrap;
}

.md pre code {
  background: transparent;
  padding: 0;
}

.md img {
  max-width: 100%;
  border-radius: 8px;
}

.mdTableWrap {
  overflow-x: auto;
  max-width: 100%;
}

.md table {
  border-collapse: collapse;
  width: max-content;
  min-width: 100%;
  font-size: 12px;
}

.md th,
.md td {
  border: 1px solid var(--wb-border);
  padding: 5px 8px;
  vertical-align: top;
}

.md th {
  background: light-dark(#f3f5f8, #1b2027);
  font-weight: 600;
}

.md tbody tr:nth-child(even) td {
  background: light-dark(#f6f7f9, #1a1e24);
}

.bubbleWrap.isPending .bubble {
  opacity: 0.7;
}

.bubbleWrap.isFailed .bubble {
  outline: 1px solid var(--wb-danger);
}

.foldRow,
.toolRow,
.workingRow {
  align-self: flex-start;
  max-width: min(72%, 560px);
  color: var(--wb-muted);
  font-size: 12px;
}

.foldRow {
  background: light-dark(#f3f5f8, #1b2027);
  border-radius: 8px;
  padding: 4px 8px;
}

.foldRow summary {
  cursor: pointer;
}

.foldBody {
  margin: 6px 0 0;
  white-space: pre-wrap;
  font: inherit;
}

.toolRow {
  border: 1px solid var(--wb-border);
  border-radius: 8px;
  padding: 4px 8px;
}

.workingRow {
  display: inline-flex;
  align-items: center;
  gap: 8px;
}

.typingRow {
  align-items: flex-start;
}

.typingBubble {
  width: max-content;
  min-width: 44px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 10px 12px;
}

.dots {
  display: inline-flex;
  gap: 4px;
  align-items: flex-end;
  height: 10px;
}

.dots i {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--wb-muted);
  display: block;
  animation: wb-dot 1s infinite ease-in-out;
}

.dots i:nth-child(2) { animation-delay: 0.15s; }
.dots i:nth-child(3) { animation-delay: 0.3s; }

@keyframes wb-dot {
  0%, 80%, 100% { opacity: 0.35; transform: translateY(0); }
  40% { opacity: 1; transform: translateY(-3px); }
}

@keyframes wb-enter {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes wb-dot-pulse {
  0%, 100% { transform: scale(1); opacity: 1; }
  50% { transform: scale(1.25); opacity: 0.65; }
}

@keyframes wb-badge-pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.55; }
}

@keyframes wb-avatar-breathe {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.06); }
}

@media (prefers-reduced-motion: reduce) {
  .bubbleWrap,
  .dots i,
  .workingDot,
  .workingBadge,
  .avatar.isLive {
    animation: none;
  }
}

.composer {
  flex: none;
  border-top: 1px solid var(--wb-border);
  padding: 10px 16px 14px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.composerRow {
  display: flex;
  gap: 8px;
  align-items: flex-end;
}

.composerInput {
  flex: 1;
  width: 100%;
  min-height: 44px;
  resize: vertical;
  border: 1px solid var(--wb-border);
  background: var(--wb-bg);
  color: var(--wb-text);
  border-radius: 10px;
  font: inherit;
  padding: 8px 10px;
}

.composerInput:disabled {
  opacity: 0.5;
}

.composerSend {
  flex: none;
}

.composerError {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  color: var(--wb-danger);
  font-size: 12px;
}

.hint {
  margin: 0;
  color: var(--wb-muted);
}

.stateBox {
  display: flex;
  flex-direction: column;
  gap: 10px;
  align-items: flex-start;
}

.errorText {
  margin: 0;
  color: var(--wb-danger);
}

.retry {
  appearance: none;
  border: 1px solid var(--wb-border);
  background: transparent;
  color: var(--wb-text);
  font-size: 12px;
  line-height: 26px;
  padding: 0 14px;
  border-radius: 999px;
  cursor: pointer;
}

.retry:hover {
  background: var(--wb-hover);
}

.retry:disabled {
  opacity: 0.38;
  cursor: not-allowed;
}

.botForm {
  display: flex;
  flex-direction: column;
  gap: 12px;
  padding: 16px 20px 24px;
  min-height: 0;
  overflow: auto;
}

.botFormHead {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.botFormHead h2 {
  margin: 0;
  font-size: 15px;
}

.field {
  display: flex;
  flex-direction: column;
  gap: 6px;
  font-size: 12px;
  color: var(--wb-muted);
}

.field input,
.field textarea {
  border: 1px solid var(--wb-border);
  background: var(--wb-bg);
  color: var(--wb-text);
  border-radius: 8px;
  font: inherit;
  padding: 8px 10px;
}

.field textarea {
  resize: vertical;
  min-height: 120px;
}

.fieldError,
.formError {
  margin: 0;
  color: var(--wb-danger);
  font-size: 12px;
}

.formHint {
  margin: 0;
  color: var(--wb-accent);
  font-size: 12px;
}

.avatarPicker {
  display: flex;
  align-items: center;
  gap: 10px;
}

.colorRow {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}

.colorSwatch {
  width: 18px;
  height: 18px;
  border-radius: 50%;
  border: 2px solid transparent;
  cursor: pointer;
  padding: 0;
}

.colorSwatch.isOn {
  border-color: #fff;
}

.modelRow {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.primaryBtn,
.dangerBtn {
  appearance: none;
  border: 0;
  border-radius: 8px;
  font-size: 13px;
  line-height: 32px;
  padding: 0 14px;
  cursor: pointer;
}

.primaryBtn {
  background: var(--wb-accent);
  color: #fff;
  align-self: flex-start;
}

.primaryBtn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.dangerBtn {
  background: var(--wb-danger);
  color: #fff;
}

.confirmMask {
  position: absolute;
  inset: 0;
  background: rgba(0, 0, 0, 0.45);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
}

.confirmBox {
  background: var(--wb-panel);
  border: 1px solid var(--wb-border);
  border-radius: 12px;
  padding: 16px;
  max-width: 240px;
}

.confirmTitle {
  margin: 0 0 8px;
  font-weight: 600;
}

.confirmActions {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  margin-top: 12px;
}

.roster {
  position: relative;
}

.paletteOverlay {
  position: fixed;
  inset: 0;
  z-index: 40;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding: 12vh 16px 16px;
  background: rgba(0, 0, 0, 0.45);
}

.palette {
  width: min(480px, 100%);
  max-height: 70vh;
  overflow: auto;
  background: var(--wb-panel);
  border: 1px solid var(--wb-border);
  border-radius: 12px;
  box-shadow: 0 16px 48px rgba(0, 0, 0, 0.4);
  outline: none;
}

.paletteKicker {
  margin: 0;
  padding: 10px 14px 4px;
  font-size: 11px;
  color: var(--wb-muted);
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.palette .hint {
  padding: 0 14px 8px;
}

.paletteList {
  list-style: none;
  margin: 0;
  padding: 6px;
}

.paletteItem {
  appearance: none;
  width: 100%;
  display: flex;
  align-items: center;
  gap: 8px;
  border: 0;
  background: transparent;
  color: var(--wb-text);
  text-align: left;
  padding: 8px 10px;
  border-radius: 8px;
  cursor: pointer;
  font: inherit;
}

.paletteItem.isActive,
.paletteItem:hover {
  background: var(--wb-hover);
}

.paletteLabel {
  flex: 1;
  min-width: 0;
}

.paletteHint {
  color: var(--wb-muted);
  font-size: 11px;
}

.paletteIndex {
  color: var(--wb-muted);
  font-size: 11px;
  min-width: 1em;
  text-align: right;
}

.replyCard {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--wb-hover);
  border: 1px solid var(--wb-border);
  border-radius: 8px;
  padding: 6px 8px 6px 10px;
  color: var(--wb-muted);
  font-size: 12px;
}

.replyCardText {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.replyCardClear {
  appearance: none;
  border: 0;
  background: transparent;
  color: var(--wb-muted);
  cursor: pointer;
  font-size: 16px;
  line-height: 1;
  padding: 0 4px;
}

.replyCite {
  font-size: 11px;
  color: var(--wb-muted);
  margin: 0 0 2px;
}

.composerEmojiBtn {
  appearance: none;
  flex: none;
  border: 1px solid var(--wb-border);
  background: transparent;
  color: var(--wb-text);
  border-radius: 10px;
  min-width: 36px;
  min-height: 44px;
  cursor: pointer;
  font-size: 16px;
}

.composerEmojiBtn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.emojiGlyph {
  margin-right: 6px;
}

.msgMenu {
  position: relative;
  flex: none;
  align-self: flex-start;
}

.bubbleWrap .msgMenu .rowMenuBtn {
  opacity: 0;
}

.bubbleWrap:hover .msgMenu .rowMenuBtn,
.bubbleWrap.isMenuOpen .msgMenu .rowMenuBtn {
  opacity: 1;
}

.msgMenuPanel {
  position: absolute;
  top: 100%;
  right: 0;
  z-index: 3;
  min-width: 96px;
  margin: 4px 0 0;
}


.memorySwitch {
  position: relative;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.memoryPill {
  appearance: none;
  border: 1px solid var(--wb-border);
  background: var(--wb-bg);
  color: var(--wb-text);
  border-radius: 999px;
  font: inherit;
  font-size: 12px;
  line-height: 26px;
  padding: 0 10px;
  cursor: pointer;
}

.memoryPill:hover {
  background: var(--wb-hover);
}

.memoryPanel {
  position: absolute;
  top: calc(100% + 6px);
  right: 0;
  z-index: 20;
  width: min(360px, 80vw);
  max-height: 70vh;
  overflow: auto;
  background: var(--wb-panel);
  border: 1px solid var(--wb-border);
  border-radius: 10px;
  padding: 10px 12px;
  box-shadow: 0 8px 24px rgb(0 0 0 / 0.35);
}

.memoryPanelHead,
.memoryPanelFoot,
.memoryRowMeta,
.memoryConfirm {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.memorySection h3 {
  margin: 12px 0 6px;
  font-size: 12px;
  color: var(--wb-muted);
}

.memorySection ul {
  margin: 0;
  padding: 0;
  list-style: none;
}

.memorySection li {
  padding: 6px 0;
  border-bottom: 1px solid var(--wb-border);
}

.memoryRowText {
  white-space: pre-wrap;
}

.memoryRowMeta {
  margin-top: 4px;
  color: var(--wb-muted);
  font-size: 11px;
}

.pinPick {
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding: 4px 0 0;
}

.unreadBadge {
  min-width: 1.1em;
  padding: 0 0.35em;
  border-radius: 999px;
  background: #d4537e;
  color: #fff;
  font-size: 11px;
  line-height: 1.4;
  text-align: center;
}
.routinesList { list-style: none; margin: 0; padding: 0; }
.routinesForm { display: grid; gap: 8px; margin-top: 12px; }
.routinesForm label { display: grid; gap: 4px; font-size: 12px; }
.routinesNotify { display: flex; align-items: center; gap: 6px; }
.proposeCard {
  margin: 8px 0;
  padding: 8px 10px;
  border: 1px solid var(--border, light-dark(#4f5967, #ddd));
  border-radius: 8px;
  background: var(--panel, #fff);
}
.routineTag {
  font-size: 11px;
  color: #8a5a00;
  margin-right: 6px;
}

.foldCard,
.actionCard {
  margin: 6px 16px;
  border: 1px solid var(--wb-border);
  border-radius: 8px;
  background: var(--wb-panel);
  max-width: min(72%, 560px);
}

.foldCardHead {
  appearance: none;
  width: 100%;
  text-align: left;
  border: 0;
  background: transparent;
  color: var(--wb-muted);
  padding: 6px 10px;
  cursor: pointer;
  font-size: 12px;
}

.foldCardBody,
.actionCardText,
.actionCardDone {
  padding: 0 10px 8px;
  color: var(--wb-text);
  font-size: 12px;
  white-space: pre-wrap;
}

.actionCard {
  padding: 8px 0 4px;
}

.actionCardRow {
  display: flex;
  gap: 8px;
  padding: 0 10px 8px;
}

.actionCard.isDone {
  opacity: 0.72;
}

.streamCursor {
  display: inline-block;
  width: 6px;
  height: 12px;
  margin-left: 2px;
  background: var(--wb-accent);
  animation: streamBlink 1s step-end infinite;
  vertical-align: text-bottom;
}

@keyframes streamBlink {
  50% { opacity: 0; }
}

.peerTag {
  display: inline-block;
  margin: 0 0 4px;
  padding: 1px 8px;
  border-radius: 999px;
  font-size: 11px;
  color: var(--wb-muted, light-dark(#66707c, #9aa0a6));
  border: 1px solid var(--wb-border);
}

.peersList {
  margin: 0;
  padding-left: 1.1em;
}

.graphOverlay {
  position: fixed;
  inset: 0;
  z-index: 40;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgb(0 0 0 / 0.45);
}

.graphCard {
  background: var(--wb-panel);
  border: 1px solid var(--wb-border);
  border-radius: 12px;
  padding: 10px 12px 16px;
  box-shadow: 0 12px 32px rgb(0 0 0 / 0.4);
}

.graphPulse {
  animation: graphPulse 1.2s ease-in-out infinite;
}

@keyframes graphPulse {
  50% { opacity: 0.45; }
}


:scope{--ds-bg:light-dark(#fff,#141414);--ds-side:light-dark(#f8f9fa,#1b1b1d);--ds-ink:light-dark(#202126,#ededf0);--ds-muted:light-dark(#70727a,#a0a1a6);--ds-border:light-dark(#e0e2e7,#303034);--ds-active:light-dark(#fff,#303034)}
.migration-caption{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:10px 2px;font-size:12px;color:var(--ds-muted);background:transparent}
.migration-grid{display:grid;grid-template-columns:280px minmax(0,1fr) 32px;grid-template-rows:auto minmax(690px,1fr);min-height:800px;border:1px solid var(--ds-border);border-radius:8px;overflow:hidden;position:relative;background:var(--ds-bg)}
.migration-grid.with-tools{grid-template-columns:280px minmax(0,1fr) 200px}
.migration-content,.migration-app,.migration-app&gt;.shell{display:contents}
.migration-app&gt;.shell&gt;.roster{grid-column:1;grid-row:2;width:auto;min-height:0;background:var(--ds-side);border-color:var(--ds-border)}
.migration-app&gt;.shell&gt;.conversation{grid-column:2;grid-row:1/3;min-width:0;min-height:0}
.dsh-brand{grid-column:1;grid-row:1;background:var(--ds-side);padding:18px 14px 10px;display:flex;flex-direction:column;gap:18px;border-right:1px solid var(--ds-border)}
.dsh-brand strong{font-size:21px;letter-spacing:-.5px;color:var(--ds-ink);font-weight:600}
.dsh-brand small{font-size:9px;letter-spacing:1px;background:var(--ds-ink);color:var(--ds-side);padding:2px 3px;vertical-align:middle}
.dsh-mode-tabs{display:flex;padding:3px;background:light-dark(#e9ebef,#121214);border-radius:9px;gap:3px}
.dsh-mode-tabs button{flex:1;min-width:0;border:0;border-radius:6px;padding:7px;background:transparent;color:var(--ds-muted);font:inherit;font-size:12px;cursor:pointer}
.dsh-mode-tabs button[aria-selected=true]{background:var(--ds-active);color:var(--ds-ink);box-shadow:0 1px 3px light-dark(#0001,#0003)}
.dsh-brand .dsh-new{color:var(--ds-ink);background:transparent;border:1px solid var(--ds-border);padding:9px;border-radius:12px;text-align:left;cursor:pointer}
.dsh-tools{grid-column:3;grid-row:1/3;display:flex;flex-direction:column;gap:14px;padding:10px 4px;background:var(--ds-side);border-left:1px solid var(--ds-border);color:var(--ds-muted);font-size:12px}
.dsh-tools button{padding:6px 0;background:transparent;color:inherit;border:0;cursor:pointer}
.dsh-tools span,.dsh-tools strong{padding:0 10px}
.is-session .migration-app&gt;.shell&gt;.roster,.is-session .migration-app&gt;.shell&gt;.conversation{display:none}
.dsh-workspaces{grid-column:1;grid-row:2;background:var(--ds-side);padding:20px;color:var(--ds-muted);border-right:1px solid var(--ds-border)}
.dsh-native{grid-column:2;grid-row:1/3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:25px;color:var(--ds-ink)}
.dsh-native h2{font-weight:500;font-size:24px}
.dsh-native textarea{width:85%;padding:16px;min-height:110px;background:var(--ds-side);color:var(--ds-ink);border:1px solid var(--ds-border);border-radius:20px}
.conversation{position:relative}
.rosterHead{display:grid;grid-template-columns:1fr 1fr;padding:15px 14px 12px;gap:11px 6px;letter-spacing:0;border-bottom:0}
.rosterHead&gt;span:first-child{white-space:nowrap;font-size:13px;color:var(--ds-ink)}
.rosterHeadActions{display:contents}
.rosterHeadActions .newBot{padding:4px 7px;border-radius:7px;line-height:22px;text-align:center;font-size:12px}
.rosterHeadActions [data-testid=&quot;roster-new&quot;]{grid-column:1;grid-row:2;background:var(--wb-bg)}
.rosterHeadActions [data-testid=&quot;roster-new-group&quot;]{grid-column:2;grid-row:2;background:var(--wb-bg)}
.rosterHeadActions [data-testid=&quot;roster-graph&quot;]{grid-column:2;grid-row:1;border-color:transparent;padding:0;color:var(--wb-muted);text-align:right;justify-self:end;font-size:11px}
.rosterBody{padding:0 8px 18px;display:block}
.rosterSection{margin:0 0 7px;padding:0}
.rosterSectionHead{padding:5px 8px;color:var(--ds-muted);font-size:11px;line-height:18px}
.rosterList{gap:2px}
.rosterList&gt;li{display:block;margin:0;padding:0}
.rosterRow{grid-template-columns:32px minmax(0,1fr) auto;gap:7px;padding:6px 8px;min-height:48px;border-radius:7px}
.rosterMain{gap:1px;min-width:0}
.rosterName{font-weight:500;font-size:13px}
.rosterPreview{font-size:11px;line-height:16px}
.rosterMeta{display:grid;grid-template-columns:auto auto 24px;grid-template-rows:16px 16px;gap:0 2px;align-items:center;align-self:center}
.rosterMeta&gt;.rosterTime{grid-column:1/3;grid-row:1;justify-self:end}
.rosterMeta&gt;.rowMenuBtn{grid-column:3;grid-row:1/3;align-self:center}
.rosterMeta&gt;.unreadBadge{grid-column:1;grid-row:2;justify-self:end}
.rosterMeta&gt;.sessionCount{grid-column:2;grid-row:2;justify-self:end}
.rosterTime{font-size:11px}
.rowMenuBtn{min-width:24px;min-height:24px;border-radius:5px;display:inline-flex;align-items:center;justify-content:center}
.rowMenuBtn:hover{background:var(--wb-hover)}
.rosterSessions{margin:0 8px 5px 40px;padding-top:0}
.rosterSession,.rosterSessionNew{padding:3px 7px;font-size:11px;min-height:24px}
.rosterSessionMeta .rosterTime{display:none}
.rosterSessionTitle{font-size:11px}
.rosterPreviewCard{max-width:220px}
.conversationHead{flex-wrap:wrap;height:auto;min-height:52px;padding-top:10px;padding-bottom:10px}
.headActions{flex-wrap:wrap;min-width:0;max-width:100%}
.memorySwitch{flex-wrap:wrap;max-width:100%}
.memoryPill{white-space:nowrap}
.conversationHeadActions{flex-wrap:wrap}
.graphOverlay,.commandPaletteOverlay{position:absolute;inset:0}
.botForm{max-width:760px;width:100%;margin:0 auto}
.botForm .field{margin-top:18px}
.botForm .modelRow{gap:10px}
@media(max-width:900px){.migration-grid,.migration-grid.with-tools{grid-template-columns:240px minmax(0,1fr) 28px}.with-tools .dsh-tools span,.with-tools .dsh-tools strong{display:none}.conversationHead{padding:10px}.memoryPanel{max-width:calc(100vw - 290px)}}
@media(max-width:600px){.migration-grid,.migration-grid.with-tools{grid-template-columns:68px minmax(0,1fr) 24px;grid-template-rows:auto minmax(690px,1fr)}.dsh-brand{padding:12px 5px 8px;gap:13px}.dsh-brand strong{font-size:0}.dsh-brand small{font-size:8px}.dsh-brand .dsh-new{font-size:10px;padding:6px 2px}.dsh-mode-tabs{flex-direction:column;padding:3px}.dsh-mode-tabs button{font-size:11px;padding:7px 2px}.rosterHead,.rosterSectionHead,.rosterSessions,.rosterMain,.rosterMeta{display:none}.rosterBody{padding:4px}.rosterRow{display:flex;padding:9px 6px;justify-content:center;min-height:52px}.rosterRow&gt;*:not(.avatarWrap){display:none}.conversationHead{gap:6px}.conversationHead .sessionPicker{max-width:100%}.memoryPanel{width:100%;max-width:100%;position:static;margin-top:8px}.memoryAnchor{position:static}.conversationHeadActions{max-width:100%}.composerRow{flex-wrap:wrap}.composerField{min-width:0;flex-basis:100%}.composerInput{font-size:16px}.transcript{padding:12px}.botForm{padding:12px}.modelRow{flex-wrap:wrap}.modelRow input{min-width:0;width:100%}.dsh-native h2{font-size:19px}}

.rosterSectionHead { display: flex; align-items: center; gap: 5px; width: 100%; }
.prototype-category-count { margin-left: auto; font-size: 11px; opacity: .65; }
.prototype-category-empty { padding: 10px 8px; color: var(--wb-muted); font-size: 12px; }
.prototype-category-picker { margin: 2px 8px 6px; padding-left: 8px; border-left: 1px solid var(--wb-border); }
.prototype-category-picker button[aria-pressed=&quot;true&quot;] { color: var(--wb-accent); }
.prototype-session-rename { padding: 8px; width: 210px; max-width: 100%; }
.prototype-session-rename label { display: grid; gap: 8px; font-size: 12px; }
.prototype-session-rename input { width: 100%; min-width: 0; padding: 8px; border: 1px solid var(--wb-border); border-radius: 6px; color: var(--wb-text); background: var(--wb-bg); }
.prototype-session-rename &gt; div { display: flex; justify-content: flex-end; gap: 4px; margin-top: 8px; }
@media (max-width: 600px) { .rosterSectionHead, .prototype-category-count { display: none; } .prototype-category-empty { font-size: 11px; padding: 4px; overflow-wrap: anywhere; } .bubble, .bubbleCol { max-width: 94%; } }

}

&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }

    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;
  let lastPointerWasTouch = false;
  let pinnedByTouch = false;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    pinnedByTouch = false;
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handlePointer = (event) =&gt; {
    lastPointerWasTouch =
      event.type === &quot;pointerdown&quot; &amp;&amp; event.pointerType === &quot;touch&quot;;
  };

    const isTouch = event.pointerType === &quot;touch&quot; || lastPointerWasTouch;
    lastPointerWasTouch = false;
    if (!isTouch || event.detail === 0) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (
      trigger == null ||
      !trigger.isConnected ||
      getContent(trigger).length === 0 ||
      (pinnedByTouch &amp;&amp; activeTrigger === trigger)
    ) {
      if (pinnedByTouch) {
        closeTooltip();
      }
      return;
    }
    openTooltip(trigger);
    pinnedByTouch = activeTrigger === trigger;
    window.setTimeout(() =&gt; {
      if (activeTrigger === trigger &amp;&amp; !trigger.isConnected) {
        closeTooltip(false);
      }
    }, 0);
  };

    if (pinnedByTouch) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };

    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    lastPointerWasTouch = false;
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    lastPointerWasTouch = false;
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerdown&quot;, handlePointer);
    document.removeEventListener(&quot;pointercancel&quot;, handlePointer);
    document.removeEventListener(&quot;click&quot;, handleTouchClick);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerdown&quot;, handlePointer);
  document.addEventListener(&quot;pointercancel&quot;, handlePointer);
  document.addEventListener(&quot;click&quot;, handleTouchClick);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();

&lt;script id=&quot;codex-visualization-tabs&quot;&gt;
(() =&gt; {
  const selector = &#x27;.nav[role=&quot;tablist&quot;] [role=&quot;tab&quot;]&#x27;;
  const disabled = &#x27;:disabled,[aria-disabled=&quot;true&quot;]&#x27;;
  const selectTab = (selected) =&gt; {
    const panelId = selected.getAttribute(&quot;aria-controls&quot;);
    for (const tab of selected.closest(&#x27;[role=&quot;tablist&quot;]&#x27;).querySelectorAll(&#x27;[role=&quot;tab&quot;]&#x27;)) {
      const active = tab === selected;
      tab.classList.toggle(&quot;active&quot;, active);
      tab.setAttribute(&quot;aria-selected&quot;, String(active));
      const id = tab.getAttribute(&quot;aria-controls&quot;);
      const panel = id &amp;&amp; document.getElementById(id);
      if (panel != null) {
        panel.hidden = id !== panelId;
        if (!panel.hidden &amp;&amp; selected.id) {
          panel.setAttribute(&quot;aria-labelledby&quot;, selected.id);
        }
      }
    }
  };
  const interact = (event) =&gt; {
    const tab = event.target?.closest?.(selector);
    if (event.defaultPrevented || tab == null || tab.matches(disabled)) {
      return;
    }
    if (event.type === &quot;click&quot;) {
      selectTab(tab);
      return;
    }
    const tabs = Array.from(
      tab.closest(&#x27;[role=&quot;tablist&quot;]&#x27;).querySelectorAll(&#x27;[role=&quot;tab&quot;]&#x27;),
    ).filter((candidate) =&gt; !candidate.matches(disabled));
    const current = tabs.indexOf(tab);
    let next;
    if (event.key === &quot;ArrowRight&quot; || event.key === &quot;ArrowDown&quot;) {
      next = (current + 1) % tabs.length;
    } else if (event.key === &quot;ArrowLeft&quot; || event.key === &quot;ArrowUp&quot;) {
      next = (current + tabs.length - 1) % tabs.length;
    } else if (event.key === &quot;Home&quot;) {
      next = 0;
    } else if (event.key === &quot;End&quot;) {
      next = tabs.length - 1;
    } else {
      return;
    }
    event.preventDefault();
    tabs[next].focus();
    selectTab(tabs[next]);
  };

  for (const list of document.querySelectorAll(&#x27;.nav[role=&quot;tablist&quot;]&#x27;)) {
    const selected =
      list.querySelector(&#x27;[role=&quot;tab&quot;][aria-selected=&quot;true&quot;]&#x27;) ??
      list.querySelector(&#x27;[role=&quot;tab&quot;].active&#x27;) ??
      list.querySelector(&#x27;[role=&quot;tab&quot;]&#x27;);
    if (selected != null) {
      selectTab(selected);
    }
  }
  document.addEventListener(&quot;click&quot;, interact);
  document.addEventListener(&quot;keydown&quot;, interact);
  window.addEventListener(&quot;pagehide&quot;, () =&gt; {
    document.removeEventListener(&quot;click&quot;, interact);
    document.removeEventListener(&quot;keydown&quot;, interact);
  }, { once: true });
})();
