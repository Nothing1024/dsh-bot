<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DSH Bot · 完善版原型（长在 DSH 官方壳上）</title>
<style>
/* ===================== 主题：跟随宿主 ===================== */
:root[data-theme="dark"] { color-scheme:dark; --bg:#12151a; --panel:#181c22; --panel2:#1e232b; --border:#2c333c; --text:#e8eaed; --muted:#9aa3ad; --accent:#6b8cff; --accent-soft:rgba(107,140,255,.16); --danger:#f07178; --ok:#7fd18a; --warn:#f0c674; --hover:#222830; --user:#2a3446; --shadow:0 8px 30px rgba(0,0,0,.45); --plug:#f0c674; --plug-soft:rgba(240,198,116,.14); }
:root[data-theme="light"] { color-scheme:light; --bg:#f6f7f9; --panel:#fff; --panel2:#f0f2f5; --border:#dfe3e8; --text:#1c2128; --muted:#667085; --accent:#3b63f3; --accent-soft:rgba(59,99,243,.12); --danger:#d64550; --ok:#2f9e5b; --warn:#b7791f; --hover:#eef1f5; --user:#e3e9f7; --shadow:0 8px 30px rgba(16,24,40,.14); --plug:#b7791f; --plug-soft:rgba(183,121,31,.12); }
* { box-sizing:border-box; }
html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font:13px/1.5 ui-sans-serif, system-ui, -apple-system, "PingFang SC", sans-serif; }
button { font:inherit; color:inherit; background:none; border:0; cursor:pointer; }
button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
kbd { font:11px ui-monospace, monospace; padding:1px 5px; border:1px solid var(--border); border-bottom-width:2px; border-radius:4px; color:var(--muted); }
.hidden { display:none !important; }
.sp { flex:1; }
.muted { color:var(--muted); }
.small { font-size:11.5px; }

/* ===================== 官方三栏壳 ===================== */
.shell { display:grid; grid-template-columns:264px 1fr 320px; height:100%; transition:grid-template-columns .18s; }
.shell.noRight { grid-template-columns:264px 1fr 0; }
.shell.railLeft { grid-template-columns:56px 1fr 320px; }
.shell.railLeft.noRight { grid-template-columns:56px 1fr 0; }
.col { min-width:0; overflow:hidden; display:flex; flex-direction:column; }
.sidebar { background:var(--panel); border-right:1px solid var(--border); }
.right { background:var(--panel); border-left:1px solid var(--border); }
@media (max-width:1100px) { .shell, .shell.railLeft { grid-template-columns:56px 1fr 0; } .right { display:none; } }

/* 侧栏 */
.brand { display:flex; align-items:center; gap:8px; padding:12px 14px; font-weight:700; border-bottom:1px solid var(--border); white-space:nowrap; }
.brand .mark { width:22px; height:22px; border-radius:6px; background:linear-gradient(135deg,#4f7cf0,#9b6ee8); flex:none; }
.railLeft .brand span:not(.mark), .railLeft .wsHead, .railLeft .rowMain, .railLeft .rowMeta, .railLeft .footRow span, .railLeft .secHead, .railLeft .subSess, .railLeft .sessT, .railLeft .sess .m, .railLeft .newBtn { display:none !important; }
.railLeft .sess, .railLeft .rosterRow { grid-template-columns:1fr; justify-items:center; padding:6px 0; }
.railLeft .footRow { justify-content:center; }
.wsHead { display:flex; align-items:center; gap:6px; padding:10px 12px 4px; color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.06em; }
.seg { display:inline-flex; border:1px solid var(--border); border-radius:7px; overflow:hidden; font-size:11px; }
.seg button { padding:2px 8px; color:var(--muted); } .seg button.on { background:var(--accent-soft); color:var(--accent); }
.wsList { flex:1; overflow:auto; padding:0 6px 8px; }
.ws { padding:6px 8px; font-weight:600; display:flex; align-items:center; gap:6px; }
.ws small { color:var(--muted); font-weight:400; }
.sess { display:grid; grid-template-columns:18px 1fr auto; align-items:center; gap:8px; padding:5px 8px 5px 12px; border-radius:7px; cursor:pointer; }
.sess:hover { background:var(--hover); } .sess.active { background:var(--accent-soft); }
.sess .sessT { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:flex; gap:6px; align-items:center; }
.sess .m { color:var(--muted); font-size:11px; }
.run { width:7px; height:7px; border-radius:50%; background:var(--warn); animation:pulse 1.2s infinite; display:inline-block; flex:none; }
@keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.4)} }
.tag { font-size:10px; padding:0 5px; border-radius:999px; background:var(--plug-soft); color:var(--plug); font-weight:600; letter-spacing:.03em; white-space:nowrap; }
.newBtn { display:flex; align-items:center; gap:6px; padding:6px 8px 6px 12px; color:var(--muted); cursor:pointer; border-radius:7px; }
.newBtn:hover { background:var(--hover); color:var(--text); }
.sideFoot { border-top:1px solid var(--border); padding:6px; display:flex; flex-direction:column; gap:2px; }
.footRow { display:flex; align-items:center; gap:8px; padding:6px 8px; border-radius:7px; cursor:pointer; color:var(--muted); }
.footRow:hover { background:var(--hover); color:var(--text); }
.badge { min-width:18px; height:18px; padding:0 5px; border-radius:9px; background:var(--accent); color:#fff; font-size:11px; font-weight:700; display:grid; place-items:center; }
.badge.mention { background:var(--danger); }
.badge.soft { background:var(--panel2); color:var(--muted); font-weight:500; }

/* 名册模式（插件） */
.secHead { display:flex; align-items:center; gap:6px; padding:8px 8px 3px; color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.06em; cursor:pointer; user-select:none; }
.secHead .caret { display:inline-block; transition:transform .15s; }
.section.collapsed .caret { transform:rotate(-90deg); }
.section.collapsed .rosterRow, .section.collapsed .subSess { display:none; }
.rosterRow { display:grid; grid-template-columns:32px 1fr auto; gap:8px; align-items:center; padding:6px 8px; border-radius:8px; cursor:pointer; position:relative; }
.rosterRow:hover { background:var(--hover); } .rosterRow.active { background:var(--accent-soft); }
.rosterRow.dragging { opacity:.4; } .rosterRow.dropTarget::before { content:""; position:absolute; left:8px; right:8px; top:-1px; height:2px; background:var(--accent); border-radius:2px; }
.rowMain { min-width:0; }
.rowMain .n { font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:flex; gap:4px; align-items:center; }
.rowMain .p { color:var(--muted); font-size:11.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.rowMeta { display:flex; flex-direction:column; align-items:flex-end; gap:3px; font-size:11px; color:var(--muted); }
.rowMenu { position:absolute; right:6px; top:50%; transform:translateY(-50%); display:none; }
.rosterRow:hover .rowMenu { display:grid; } .rosterRow:hover .rowMeta { visibility:hidden; }
.subSess { padding:3px 8px 3px 48px; color:var(--muted); font-size:11.5px; cursor:pointer; border-radius:6px; display:flex; gap:6px; align-items:center; }
.subSess:hover { background:var(--hover); color:var(--text); } .subSess.active { color:var(--accent); }
.av { width:32px; height:32px; border-radius:9px; display:grid; place-items:center; color:#fff; font-weight:700; font-size:13px; position:relative; flex:none; }
.av.sm { width:20px; height:20px; font-size:10px; border-radius:6px; } .av.xs { width:16px; height:16px; font-size:9px; border-radius:5px; } .av.lg { width:56px; height:56px; font-size:22px; border-radius:16px; }
.av.blob { border-radius:40% 60% 55% 45% / 55% 45% 55% 45%; } .av.hex { clip-path:polygon(25% 5%,75% 5%,100% 50%,75% 95%,25% 95%,0 50%); border-radius:0; } .av.pebble { border-radius:50% 50% 45% 55% / 60% 60% 40% 40%; } .av.cloud { border-radius:50% 50% 40% 40% / 60% 60% 45% 45%; }
.av .st { position:absolute; right:-2px; bottom:-2px; width:9px; height:9px; border-radius:50%; border:2px solid var(--panel); background:var(--muted); }
.av .st.working { background:var(--warn); animation:pulse 1.2s infinite; } .av .st.online { background:var(--ok); }
.mosaic { display:grid; grid-template-columns:1fr 1fr; gap:2px; padding:3px; background:var(--panel2); border-radius:9px; } .mosaic i { display:block; border-radius:3px; min-height:10px; }
.mosaic.sm i { min-height:6px; } .mosaic.xs i { min-height:4px; }

/* 对话面 */
.conv { background:var(--bg); position:relative; }
.convHead { display:flex; align-items:center; gap:8px; padding:8px 14px; border-bottom:1px solid var(--border); background:var(--panel); min-height:46px; }
.convHead .title { font-weight:600; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.convHead .lineage { color:var(--muted); font-size:12px; white-space:nowrap; }
.identity { display:inline-flex; align-items:center; gap:6px; }
.pill { padding:3px 9px; border-radius:999px; border:1px solid var(--border); background:var(--panel2); color:var(--muted); font-size:12px; display:inline-flex; align-items:center; gap:5px; cursor:pointer; white-space:nowrap; }
.pill:hover { color:var(--text); border-color:var(--accent); } .pill.on { color:var(--accent); border-color:var(--accent); background:var(--accent-soft); }
.viewTabs { display:flex; gap:2px; padding:0 14px; border-bottom:1px solid var(--border); background:var(--panel); }
.viewTabs button { padding:7px 12px; color:var(--muted); font-size:12.5px; border-bottom:2px solid transparent; }
.viewTabs button.on { color:var(--text); border-bottom-color:var(--accent); }
.membersBar { display:flex; gap:6px; padding:6px 14px; border-bottom:1px solid var(--border); background:var(--panel); align-items:center; overflow:auto; }
.chip { display:inline-flex; align-items:center; gap:6px; padding:3px 8px 3px 3px; border-radius:999px; border:1px solid var(--border); font-size:12px; white-space:nowrap; }
.chip.speaking { border-color:var(--warn); box-shadow:0 0 0 2px rgba(240,198,116,.25); } .chip.spoke { opacity:.6; } .chip.pass { opacity:.45; text-decoration:line-through; } .chip.pending { opacity:.8; }
.transcript { flex:1; overflow:auto; padding:16px 18px 8px; scroll-behavior:smooth; }
.dateSep { text-align:center; color:var(--muted); font-size:11px; margin:12px 0 10px; display:flex; align-items:center; gap:10px; }
.dateSep::before, .dateSep::after { content:""; flex:1; height:1px; background:var(--border); }
.dateSep.unread { color:var(--danger); } .dateSep.unread::before, .dateSep.unread::after { background:var(--danger); opacity:.5; }
.turn { max-width:860px; margin:0 0 14px; }
.turn.user { display:flex; flex-direction:column; align-items:flex-end; }
.turn.user .bubble { background:var(--user); border-color:transparent; }
.who { display:flex; gap:6px; align-items:center; margin-bottom:4px; font-size:12px; color:var(--muted); }
.who b { color:var(--text); }
.split { display:flex; flex-direction:column; gap:6px; align-items:flex-start; }
.bubble { display:inline-block; max-width:100%; padding:8px 12px; border-radius:12px; background:var(--panel2); border:1px solid var(--border); }
.bubble p { margin:0 0 .5em; } .bubble p:last-child { margin:0; }
.bubble code { font:12px ui-monospace, monospace; background:var(--bg); padding:0 4px; border-radius:4px; }
.bubble pre { margin:.5em 0; padding:10px 12px 22px; background:var(--bg); border:1px solid var(--border); border-radius:8px; font:12px/1.5 ui-monospace, monospace; overflow:auto; position:relative; }
.bubble pre .lang { position:absolute; right:8px; top:6px; font-size:10px; color:var(--muted); } .bubble pre .copy { position:absolute; right:8px; bottom:4px; font-size:11px; color:var(--muted); }
.bubble ul { margin:.3em 0; padding-left:1.3em; }
.tok-k { color:#c792ea; } .tok-s { color:#c3e88d; } .tok-c { color:var(--muted); }
.quote { border-left:3px solid var(--accent); padding:4px 8px; margin:0 0 6px; color:var(--muted); font-size:12px; background:var(--accent-soft); border-radius:0 6px 6px 0; }
.quote b { color:var(--text); }
.cursor { display:inline-block; width:7px; height:14px; background:var(--accent); vertical-align:-2px; margin-left:2px; animation:blink .9s steps(1) infinite; } @keyframes blink { 50%{opacity:0} }
.card { border:1px solid var(--border); border-radius:10px; background:var(--panel); margin:2px 0; max-width:640px; overflow:hidden; }
.cardHead { display:flex; align-items:center; gap:8px; padding:7px 10px; font-size:12px; cursor:pointer; user-select:none; }
.cardHead .name { font-weight:600; font-family:ui-monospace, monospace; } .cardHead .sub { flex:1; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.st { font-size:11px; padding:1px 6px; border-radius:999px; border:1px solid var(--border); color:var(--muted); white-space:nowrap; } .st.ok { color:var(--ok); border-color:var(--ok); } .st.run { color:var(--warn); border-color:var(--warn); } .st.err { color:var(--danger); border-color:var(--danger); }
.cardBody { display:none; border-top:1px solid var(--border); padding:8px 10px; font:12px/1.5 ui-monospace, monospace; color:var(--muted); white-space:pre-wrap; background:var(--bg); max-height:220px; overflow:auto; } .card.open .cardBody { display:block; }
.card.approval { border-color:var(--warn); } .card.question { border-color:var(--accent); }
.card.approval .cardBody, .card.question .cardBody { display:block; font-family:inherit; color:var(--text); background:var(--panel); }
.card.approval pre { margin:6px 0; padding:8px; background:var(--bg); border-radius:6px; font:12px ui-monospace, monospace; }
.card.resolved { opacity:.7; }
.card.peer { border-color:var(--plug); }
.btnRow { display:flex; gap:6px; margin-top:8px; flex-wrap:wrap; }
.btn { padding:5px 11px; border-radius:7px; border:1px solid var(--border); background:var(--panel2); font-size:12px; white-space:nowrap; } .btn:hover { border-color:var(--accent); }
.btn.primary { background:var(--accent); border-color:var(--accent); color:#fff; } .btn.danger { color:var(--danger); } .btn.ghost { border-color:transparent; color:var(--muted); } .btn.chosen { background:var(--accent-soft); border-color:var(--accent); color:var(--accent); }
.btn:disabled { opacity:.5; cursor:default; }
.turnTail { display:flex; align-items:center; gap:8px; margin-top:6px; font-size:11.5px; color:var(--muted); min-height:20px; }
.turnTail .acts { display:flex; gap:2px; opacity:0; transition:opacity .12s; } .turn:hover .turnTail .acts { opacity:1; }
.turnTail .acts button { padding:1px 6px; border-radius:5px; } .turnTail .acts button:hover { background:var(--hover); color:var(--text); }
.reactions { display:inline-flex; gap:4px; } .reactions span { padding:0 7px; border-radius:999px; border:1px solid var(--border); background:var(--panel2); font-size:11.5px; cursor:pointer; } .reactions span.mine { border-color:var(--accent); background:var(--accent-soft); }
.typing { display:inline-flex; gap:3px; padding:8px 12px; } .typing i { width:6px; height:6px; border-radius:50%; background:var(--muted); animation:bob 1s infinite; } .typing i:nth-child(2){animation-delay:.15s} .typing i:nth-child(3){animation-delay:.3s} @keyframes bob { 0%,100%{transform:translateY(0);opacity:.5} 50%{transform:translateY(-3px);opacity:1} }
.jumpNew { position:absolute; left:50%; transform:translateX(-50%); bottom:110px; display:none; z-index:5; box-shadow:var(--shadow); } .jumpNew.show { display:inline-flex; }

/* 新会话 hero（官方） */
.hero { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; padding:40px 20px; }
.hero h2 { margin:0; font-size:22px; font-weight:600; }
.hero .pickers { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; }
.presetGrid { display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:8px; width:min(700px, 100%); }
.presetCard { display:flex; gap:10px; align-items:center; padding:10px; border:1px solid var(--border); border-radius:10px; background:var(--panel); cursor:pointer; text-align:left; }
.presetCard:hover { border-color:var(--accent); } .presetCard.sel { border-color:var(--accent); background:var(--accent-soft); }
.presetCard b { display:block; font-size:12.5px; } .presetCard small { color:var(--muted); font-size:11px; display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

/* 队列 + composer */
.queue { padding:0 14px; display:flex; flex-direction:column; gap:4px; }
.qItem { display:flex; align-items:center; gap:8px; padding:5px 10px; border:1px dashed var(--border); border-radius:8px; font-size:12px; color:var(--muted); background:var(--panel); }
.qItem .txt { flex:1; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; } .qItem button { font-size:11px; color:var(--muted); padding:1px 6px; border-radius:5px; } .qItem button:hover { background:var(--hover); color:var(--text); }
.composerWrap { padding:8px 14px 12px; }
.replyBar { display:flex; align-items:center; gap:8px; padding:6px 10px; border:1px solid var(--border); border-bottom:0; border-radius:10px 10px 0 0; background:var(--panel2); font-size:12px; color:var(--muted); }
.replyBar b { color:var(--text); }
.attachRow { display:flex; gap:6px; padding:8px 10px 0; flex-wrap:wrap; }
.att { display:inline-flex; align-items:center; gap:6px; padding:3px 8px 3px 4px; border-radius:7px; border:1px solid var(--border); background:var(--panel2); font-size:12px; } .att .thumb { width:22px; height:22px; border-radius:4px; background:linear-gradient(135deg,#6b8cff,#c792ea); }
.composer { border:1px solid var(--border); border-radius:12px; background:var(--panel); transition:border-color .12s; }
.composer.reply { border-top-left-radius:0; border-top-right-radius:0; }
.composer:focus-within { border-color:var(--accent); } .composer.dragOver { border-color:var(--accent); border-style:dashed; background:var(--accent-soft); }
.composer textarea { width:100%; border:0; background:transparent; color:var(--text); padding:10px 12px 4px; resize:none; min-height:40px; max-height:200px; font:inherit; line-height:1.5; } .composer textarea:focus { outline:none; }
.composerBar { display:flex; align-items:center; gap:4px; padding:4px 8px 8px; }
.iconBtn { width:28px; height:28px; border-radius:7px; display:grid; place-items:center; color:var(--muted); } .iconBtn:hover { background:var(--hover); color:var(--text); }
.send { padding:5px 12px; border-radius:8px; background:var(--accent); color:#fff; font-weight:600; } .send.stop { background:var(--danger); }
.modeSel { display:inline-flex; border:1px solid var(--border); border-radius:7px; overflow:hidden; font-size:11px; } .modeSel button { padding:3px 8px; color:var(--muted); } .modeSel button.on { background:var(--accent-soft); color:var(--accent); }
.hint { color:var(--muted); font-size:11px; padding:4px 4px 0; display:flex; gap:12px; flex-wrap:wrap; }

/* 右栏 */
.tabs { display:flex; gap:2px; padding:8px 8px 0; border-bottom:1px solid var(--border); overflow:auto; }
.tabs button { padding:6px 10px; color:var(--muted); font-size:12px; border-bottom:2px solid transparent; border-radius:7px 7px 0 0; white-space:nowrap; } .tabs button.on { color:var(--text); border-bottom-color:var(--accent); }
.tabBody { flex:1; overflow:auto; padding:12px; }
.tabBody h3 { font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:14px 0 6px; } .tabBody h3:first-child { margin-top:0; }
.fact { display:flex; gap:8px; align-items:flex-start; padding:5px 8px; border-radius:8px; font-size:12.5px; } .fact:hover { background:var(--hover); } .fact .t { flex:1; min-width:0; } .fact .src { font-size:10px; color:var(--muted); white-space:nowrap; margin-top:3px; } .fact .del { visibility:hidden; color:var(--muted); font-size:11px; } .fact:hover .del { visibility:visible; } .fact.faded { opacity:.55; } .fact.click { cursor:pointer; }
.routine { padding:8px 10px; border:1px solid var(--border); border-radius:9px; margin-bottom:8px; font-size:12.5px; } .routine .top { display:flex; align-items:center; gap:8px; } .routine .top b { flex:1; } .routine .cron { font:11px ui-monospace, monospace; color:var(--muted); }
.sw { width:30px; height:17px; border-radius:999px; background:var(--border); position:relative; cursor:pointer; flex:none; } .sw::after { content:""; position:absolute; top:2px; left:2px; width:13px; height:13px; border-radius:50%; background:#fff; transition:left .15s; } .sw.on { background:var(--ok); } .sw.on::after { left:15px; }
.inp { width:100%; padding:6px 8px; border-radius:7px; border:1px solid var(--border); background:var(--panel2); color:var(--text); font:inherit; }
.avPalette { display:flex; gap:5px; flex-wrap:wrap; } .avPalette .av { width:24px; height:24px; cursor:pointer; font-size:0; } .avPalette .av.sel { outline:2px solid var(--accent); outline-offset:2px; }
.field { margin-bottom:10px; } .field label { display:block; font-size:11.5px; color:var(--muted); margin-bottom:4px; }

/* 弹层 / 命令面板 / 模态 / toast */
.pop { position:absolute; z-index:30; background:var(--panel); border:1px solid var(--border); border-radius:10px; box-shadow:var(--shadow); min-width:220px; padding:4px; }
.pop button { display:flex; width:100%; align-items:center; gap:8px; padding:6px 10px; border-radius:7px; text-align:left; font-size:12.5px; } .pop button:hover, .pop button.sel { background:var(--hover); } .pop button .k { margin-left:auto; color:var(--muted); font-size:11px; } .pop hr { border:0; border-top:1px solid var(--border); margin:4px 0; }
.pop.emoji { display:grid; grid-template-columns:repeat(8, 30px); gap:2px; padding:8px; min-width:0; } .pop.emoji button { width:30px; height:30px; padding:0; justify-content:center; font-size:17px; }
.scrim { position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:90; display:none; } .scrim.show { display:block; }

composer.addEventListener('dragover', e => { e.preventDefault(); composer.classList.add('dragOver'); }); composer.addEventListener('dragleave', () => composer.classList.remove('dragOver'));
composer.addEventListener('drop', e => { e.preventDefault(); composer.classList.remove('dragOver'); const f = e.dataTransfer.files?.[0]; addAttachment(f?.name || 'dropped.png', f ? Math.round(f.size/1024) + ' KB' : '96 KB'); });
$('#sendBtn').onclick = () => working ? stop() : send();
function setWorking(v) {
  working = v; const b = $('#sendBtn'); b.textContent = v ? '停止 ⎋' : '发送 ↵'; b.classList.toggle('stop', v);
  input.placeholder = v ? (mode === 'queue' ? 'Bot 正在回复，输入会排队…' : 'Bot 正在回复，输入会打断并插话…') : '给 Bot 发消息…（粘贴 / 拖入图片，@ 提及，:emoji:，/ 命令）';
  const s = sessOf(currentSession); const idn = identityOf(s); if (idn) { idn.status = v ? 'working' : (idn.members ? 'idle' : 'online'); if (s) s.running = v; renderSide(); }
  renderQueue(); if (!v) flush();
}
function renderQueue() { $('#queue').innerHTML = queue.map((q, i) => `<div class="qItem">⏳ 排队 ${i+1}<span class="txt">${esc(q)}</span><button onclick="input.value=queue.splice(${i},1)[0]; renderQueue(); input.focus()">编辑</button><button onclick="steerQueued(${i})">立即插话</button><button onclick="queue.splice(${i},1); renderQueue()">✕</button></div>`).join(''); }
function steerQueued(i) { const t = queue.splice(i,1)[0]; renderQueue(); appendUser(t,'steer'); restart(); }
function flush() { if (queue.length && !working) { appendUser(queue.shift()); renderQueue(); demoStream(); } }
function send() {
  const t = input.value.trim(); const atts = $$('#attachRow .att').length; if (!t && !atts) return;
  if (heroMode) { const b = botById(heroPreset); const id = 's-new-' + Date.now(); sessions.unshift({ id, title:'新对话', bot:b.id, time:'刚刚', running:true }); transcripts[id] = [{ t:'date', text:'今天' }]; openSession(id); toast('🗒','已建会话',`sessions.create({agentPreset:"dsh-bot--${b.id}"}) + 打标 bot:${b.id}；首轮后自动起题`); }
  input.value = ''; input.style.height = 'auto'; $('#attachRow').innerHTML = ''; $('#attachRow').classList.add('hidden');
  const shown = t + (atts ? `\n\n📎 ${atts} 张图片` : '');
  if (working) { if (mode === 'queue') { queue.push(shown); renderQueue(); toast('⏳','已排队','官方 sessions.prompt{mode:"queue"}'); } else { appendUser(shown,'steer'); toast('⚡','已打断','官方 sessions.prompt{mode:"steer"}'); restart(); } clearReply(); return; }
  appendUser(shown); clearReply(); sessOf(currentSession)?.group ? demoGroup() : demoStream();
}
function appendUser(t, tag) { const reply = $('#replyBar').classList.contains('hidden') ? '' : `<div class="quote">↩ 回复 <b>${esc($('#replyWho').textContent)}</b>：${esc($('#replyText').textContent)}</div>`; $('#transcript').insertAdjacentHTML('beforeend', `<div class="turn user"><div class="who">${tag === 'steer' ? '<span class="tag">插话</span>' : ''}<span>刚刚</span></div><div class="bubble">${reply}${md(t)}</div>${tail('user')}</div>`); scrollBottom(); }
function stop() { if (!working) return; clearInterval(timer); timer = null; $$('.cursor').forEach(c => c.remove()); setWorking(false); toast('⏹','已停止','官方 sessions.cancel，已生成部分保留，队列不清空'); }
function addAttachment(name='screenshot.png', size='184 KB') { const r = $('#attachRow'); r.classList.remove('hidden'); r.insertAdjacentHTML('beforeend', `<span class="att"><span class="thumb"></span>${esc(name)} <small class="muted">${size}</small><button class="muted" onclick="this.parentNode.remove(); if(!document.querySelector('#attachRow .att')) document.querySelector('#attachRow').classList.add('hidden')">✕</button></span>`); toast('🖼','图片已暂存','官方 input.attachments → PromptContentPart image'); }
function insertText(t) { input.value += t; input.focus(); input.dispatchEvent(new Event('input')); }

/* 建议弹窗：@ / : / / */
let sugOpen = false, sugItems = [], sugSel = 0;
const EMOJI = ['😀','😂','🙂','😉','😍','🤔','😴','😎','🥳','😭','😡','👍','👎','👏','🙏','🎉','🔥','💡','✅','❌','⚠️','📌','🔧','🚀'];
const SLASH = [ { c:'/新对话', d:'在当前 Bot 下开新会话' }, { c:'/起题', d:'用首句给当前会话起标题' }, { c:'/归档', d:'归档当前会话（官方）' }, { c:'/模型', d:'切换本会话模型（官方）' }, { c:'/例程', d:'把这条消息设成定时例程' }, { c:'/忘记', d:'让 Bot 忘掉某条记忆' }, { c:'/广播', d:'发给所有 Bot' } ];
function suggest() {
  const m = input.value.match(/(^|\s)([@:\/])([^\s]*)$/); if (!m) return closeSug();
  const [, , trig, q] = m; const s = sessOf(currentSession);
  if (trig === '@') { const pool = s?.group ? [...identityOf(s).members.map(botById), { id:'all', name:'all', avatar:{ shape:'sq', color:'gray', text:'*' } }] : bots.filter(b => b.id !== s?.bot); sugItems = pool.filter(b => b.name.includes(q)).map(b => ({ label:b.name, sub: b.id === 'all' ? '全员' : (s?.group ? '点名' : '发给这个 Bot（异步）'), ins:`@${b.name} `, av:b.avatar })); }
  else if (trig === ':') { if (!q) return closeSug(); sugItems = EMOJI.slice(0,8).map(e => ({ label:e, sub:q, ins:e + ' ' })); }
  else sugItems = SLASH.filter(x => x.c.includes(q)).map(x => ({ label:x.c, sub:x.d, ins:x.c + ' ' }));
  if (!sugItems.length) return closeSug(); sugSel = 0; sugOpen = true; renderSug();
}
function renderSug() { let p = $('#sugPop'); if (!p) { p = document.createElement('div'); p.id = 'sugPop'; p.className = 'pop'; document.body.appendChild(p); } const rc = composer.getBoundingClientRect(); p.style.left = rc.left + 8 + 'px'; p.style.top = 'auto'; p.style.bottom = (innerHeight - rc.top + 6) + 'px'; p.innerHTML = sugItems.map((x, i) => `<button class="${i === sugSel ? 'sel' : ''}" onmousedown="event.preventDefault(); pickSug(${i})">${x.av ? av(x.av,'sm') : `<span style="width:20px;text-align:center">${x.label}</span>`}<span>${x.av ? esc(x.label) : ''}</span><span class="k">${esc(x.sub)}</span></button>`).join(''); }
function closeSug() { sugOpen = false; $('#sugPop')?.remove(); }
function pickSug(i) { input.value = input.value.replace(/([@:\/])[^\s]*$/, sugItems[i].ins); closeSug(); input.focus(); input.dispatchEvent(new Event('input')); }
function sugKey(e) { e.preventDefault(); if (e.key === 'ArrowDown') { sugSel = (sugSel+1) % sugItems.length; renderSug(); } else if (e.key === 'ArrowUp') { sugSel = (sugSel-1+sugItems.length) % sugItems.length; renderSug(); } else if (e.key === 'Enter' || e.key === 'Tab') pickSug(sugSel); else closeSug(); }
$('#emojiBtn').onclick = e => { e.stopPropagation(); if ($('#emojiPop')) { $('#emojiPop').remove(); return; } const p = document.createElement('div'); p.id = 'emojiPop'; p.className = 'pop emoji'; const rc = e.currentTarget.getBoundingClientRect(); p.style.left = rc.left + 'px'; p.style.bottom = (innerHeight - rc.top + 6) + 'px'; p.innerHTML = EMOJI.map(x => `<button onclick="insertText('${x}'); document.getElementById('emojiPop').remove()">${x}</button>`).join(''); document.body.appendChild(p); };

/* ===================== 右栏 ===================== */
function openRight(tab) { rightTab = tab; $('#shell').classList.remove('noRight'); $$('#rightTabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab)); renderRight(); }
function toggleRight() { $('#shell').classList.toggle('noRight'); }
function renderRight() {
  const s = sessOf(currentSession); const idn = heroMode ? botById(heroPreset) : identityOf(s); const body = $('#tabBody');
  if (!idn) { body.innerHTML = `<div class="muted">这是一个普通会话，不属于任何 Bot。</div><div class="btnRow"><button class="btn" onclick="toast('🏷','归入','给该会话打 bot:<id> marks')">归入某个 Bot…</button></div><h3>或者</h3><div class="muted small">在名册里选一个 Bot，官方会话就有了身份、记忆和例程。</div>`; return; }
  if (rightTab === 'bot') {
    if (idn.members) { body.innerHTML = `<h3>成员</h3>` + idn.members.map(id => { const m = botById(id); return `<div class="fact click" onclick="openSession('${(sessions.find(x => x.bot === id)||{}).id || ''}','${id}')">${av(m.avatar,'sm')}<span class="t"><b>${esc(m.name)}</b> <small class="muted">${m.model}</small></span></div>`; }).join('') +
      `<h3>讨论设置</h3><div class="field"><label>每次讨论轮数</label><select class="inp"><option>1 轮（每发一条全员各回一句）</option><option>2 轮</option><option selected>3 轮（第 2 轮起回应同伴）</option></select></div><div class="fact"><span class="t">全员 pass 提前结束</span><span class="sw on" onclick="this.classList.toggle('on')"></span></div><div class="fact"><span class="t">每轮起点轮转</span><span class="sw on" onclick="this.classList.toggle('on')"></span></div>
       <h3>成员轮次会话（隐藏）</h3>` + idn.members.map(id => `<div class="fact"><span class="t small">~dsh-bot-group: ${esc(botById(id).name)}</span><button class="btn ghost small" onclick="toast('↗','打开','ctx.sessions.open 直达隐藏会话，无桥')">打开 ↗</button></div>`).join('') + `<div class="btnRow"><button class="btn" onclick="openModal('group','${idn.id}')">✎ 编辑小组</button></div>`; return; }
    body.innerHTML = `<div style="display:flex;gap:12px;align-items:center;margin-bottom:12px">${av(idn.avatar,'lg')}<div style="min-width:0"><b style="font-size:14px">${esc(idn.name)}</b><div class="muted small">preset: dsh-bot--${idn.id} · ${sessions.filter(x => x.bot === idn.id).length} 段会话</div></div></div>
      <div class="field"><label>人设（只对之后的新会话生效）</label><textarea class="inp" rows="4" style="resize:vertical">${esc(idn.persona)}</textarea></div>
      <div class="field"><label>默认模型（来自 sessions.models 目录）</label><select class="inp"><option>跟随全局默认</option><option ${idn.model==='deepseek-r1'?'selected':''}>deepseek · deepseek-r1 · reasoning high</option><option ${idn.model==='deepseek-v3'?'selected':''}>deepseek · deepseek-v3</option></select></div>
      <h3>形象</h3><div class="avPalette">${SHAPES.map(sh => `<span class="av ${sh} ${idn.avatar.shape===sh?'sel':''}" style="background:${COLORS[idn.avatar.color]}" onclick="setAv('${idn.id}','shape','${sh}')"></span>`).join('')}<span style="width:10px"></span>${Object.keys(COLORS).map(c => `<span class="av sq ${idn.avatar.color===c?'sel':''}" style="background:${COLORS[c]}" onclick="setAv('${idn.id}','color','${c}')"></span>`).join('')}</div>
      <h3>通知</h3><div class="fact"><span class="t">主动来消息时通知我</span><span class="sw on" onclick="this.classList.toggle('on')"></span></div><div class="fact"><span class="t">需要审批 / 提问时通知</span><span class="sw on" onclick="this.classList.toggle('on')"></span></div><div class="muted small" style="padding:0 8px">只在窗口失焦且 5 秒内无同类通知时才发系统通知。</div>
      <h3>会话</h3>` + sessions.filter(x => x.bot === idn.id).map(x => `<div class="fact click ${x.id === currentSession ? '' : ''}" onclick="openSession('${x.id}')"><span class="t">🗒 ${esc(x.title)}${x.wake ? ' <span class="tag">主动</span>' : ''}</span><span class="src">${esc(x.time)}</span></div>`).join('') + `<div class="btnRow"><button class="btn" onclick="openHero('${idn.id}')">＋ 新对话</button><button class="btn ghost" onclick="openModal('bot','${idn.id}')">完整编辑</button></div>`;
  } else if (rightTab === 'memory') {
    const m = memory[idn.id]; if (!m) { body.innerHTML = `<div class="muted">还没记住什么。每轮对话后自动抽取；寒暄不记；你随时可以删。</div>`; return; }
    const sec = (t, arr) => `<h3>${t}</h3>` + (arr.length ? arr.map(f => `<div class="fact ${f.faded?'faded':''}"><span class="t">${esc(f.t)}</span><span class="src" title="来源分片">${f.shared?'🔗 ':''}${esc(f.src)}</span><button class="del" onclick="this.closest('.fact').remove(); toast('🗑','已忘记','留 tombstone，后台合成不会捞回')">忘记</button></div>`).join('') : `<div class="muted small" style="padding:0 8px">（空）</div>`);
    body.innerHTML = `<div class="muted small" style="margin-bottom:4px">文件在 env/dsh-bot/memory/${idn.id}/，Bot 自己也能 grep。优先级：自己 &gt; 项目 &gt; 用户。🔗 = 其他 Bot 写的共享分片。</div>` + sec('关于用户（长期，每轮都在提示词里）', m.profile) + sec('日志（30 天半衰期）', m.log) + sec('备注（最先淡出，留在磁盘）', m.note) + `<div class="btnRow"><button class="btn ghost small" onclick="toast('🌙','后台整理','每 24h 合成一次：合并/去重/移除；显式写入的不改写')">上次整理：今天 03:12</button><button class="btn small" onclick="toast('＋','手动写入','update_state(memory, write)')">＋ 记一条</button></div>`;
  } else if (rightTab === 'routines') {
    const rs = routines[idn.id] || [];
    body.innerHTML = (rs.map(r => `<div class="routine"><div class="top"><b>${esc(r.name)}</b><span class="sw ${r.on?'on':''}" onclick="this.classList.toggle('on')"></span></div><div class="cron">${esc(r.cron)}</div><div class="muted small" style="margin-top:4px">${esc(r.last)}</div></div>`).join('') || `<div class="muted">没有例程。</div>`) + `<div class="btnRow"><button class="btn" onclick="openModal('routine','${idn.id}')">＋ 新建例程</button></div><div class="muted small" style="margin-top:10px">到期时 host 给该 Bot 的例程会话发 [routine] 唤醒词。Bot 知道"没人在等"，没事就一条都不发；有事则落到会话并亮未读。</div>`;
  } else if (rightTab === 'peers') {
    body.innerHTML = `<div class="muted small" style="margin-bottom:8px">这个 Bot 能异步给同事发消息（像发短信），回复以 [agent] 唤醒到达。它不会转述你的私下吐槽。</div>` + bots.filter(b => b.id !== idn.id).map(b => { const n = peerLog.filter(p => (p.from === idn.id && p.to === b.id) || (p.to === idn.id && p.from === b.id)).reduce((a, p) => a + p.n, 0); return `<div class="fact click" onclick="openSession('${(sessions.find(x => x.bot === b.id)||{}).id||''}','${b.id}')">${av(b.avatar,'sm')}<span class="t"><b>${esc(b.name)}</b><br><small class="muted">${n ? `今天互发 ${n} 条` : '暂无往来'}</small></span></div>`; }).join('') + `<h3>所在小组</h3>` + (groups.filter(g => g.members.includes(idn.id)).map(g => `<div class="fact click" onclick="openSession('${g.id}')">${mosaic(g,'sm')}<span class="t">${esc(g.name)}</span></div>`).join('') || `<div class="muted small" style="padding:0 8px">（无）</div>`) + `<div class="btnRow"><button class="btn ghost" onclick="openModal('org')">🕸 查看关系图</button></div>`;
  } else {
    body.innerHTML = `<h3>后台任务（官方 session/jobs）</h3><div class="routine"><div class="top"><b>跑 PR #142 全量测试</b><span class="st run">运行中 2m14s</span></div><div class="cron">pnpm -r test · 子代理</div></div><div class="routine"><div class="top"><b>整理 marks 过滤逻辑</b><span class="st ok">完成</span></div><div class="cron">完成后已唤醒 Bot 汇报</div></div><div class="muted small" style="margin-top:10px">任务完成会触发一次唤醒，Bot 用自己的口吻汇报，不说"任务已完成"这种系统腔。</div>`;
  }
}
function setAv(id, k, v) { botById(id).avatar[k] = v; renderSide(); renderRight(); if (!heroMode) openSession(currentSession); }

<script>
/* ===================== 命令面板 ===================== */
let palSel = 0, palRows = [];
function openPalette(prefill='') { closeAll(); $('#scrim').classList.add('show'); $('#palette').classList.add('show'); const i = $('#palInput'); i.value = prefill; i.focus(); renderPal(); }
function closeAll() { $('#scrim').classList.remove('show'); $('#palette').classList.remove('show'); $('#modal').classList.remove('show'); closePops(); }
$('#palInput').addEventListener('input', renderPal);
$('#palInput').addEventListener('keydown', e => { if (e.key === 'ArrowDown') { palSel = Math.min(palSel+1, palRows.length-1); paintPal(); e.preventDefault(); } else if (e.key === 'ArrowUp') { palSel = Math.max(palSel-1, 0); paintPal(); e.preventDefault(); } else if (e.key === 'Enter') { palRows[palSel]?.run(); closeAll(); } else if (e.key === 'Escape') closeAll(); });
function hi(t, q) { if (!q) return esc(t); const i = t.toLowerCase().indexOf(q.toLowerCase()); return i < 0 ? esc(t) : esc(t.slice(0,i)) + '<mark>' + esc(t.slice(i, i+q.length)) + '</mark>' + esc(t.slice(i+q.length)); }
function renderPal() {
  const raw = $('#palInput').value; palRows = []; palSel = 0; const cmdOnly = raw.startsWith('>'); const q = raw.replace(/^>\s*/, '').trim(); const out = [];
  const commands = [ { ic:'🤖', t:'新建人设', s:'BotForm 模态', k:'⌘N', run:() => openModal('bot') }, { ic:'👥', t:'新建小组', s:'选 2–6 个人设', run:() => openModal('group') }, { ic:'🗒', t:'新会话', s:'官方 hero', run:() => openHero() }, { ic:'📣', t:'广播给所有 Bot', s:'每个 Bot 各开一个隐藏 turn', run:() => toast('📣','已广播','') }, { ic:'🕸', t:'Bot 关系图', s:'', run:() => openModal('org') }, { ic:'◐', t:'切换主题', s:'跟随宿主', run:toggleTheme }, { ic:'⚙', t:'DSH Bot 设置', s:'settings.section', k:'⌘,', run:() => openModal('settings') }, { ic:'⌨', t:'快捷键', s:'', k:'?', run:() => openModal('help') } ].filter(c => !q || c.t.includes(q));
  if (!cmdOnly) {
    const bl = [...bots.filter(b => !hiddenBots.includes(b.id)), ...groups].filter(x => !q || x.name.includes(q));
    if (bl.length) out.push({ name:'Bot / 小组', rows: bl.map((b, i) => ({ ic:idAv(b,'sm'), t:hi(b.name,q), s:b.preview, k: i < 9 ? `⌘${i+1}` : '', run:() => b.members ? openSession(b.id) : openSession((sessions.find(s => s.bot === b.id)||{}).id || '', b.id) })) });
    const sl = sessions.filter(s => !q || s.title.includes(q)); if (sl.length) out.push({ name:'会话', rows: sl.map(s => { const idn = identityOf(s); return { ic:idn ? idAv(idn,'xs') : '💬', t:hi(s.title,q), s:(idn ? idn.name + ' · ' : '') + s.time, run:() => openSession(s.id) }; }) });
  }
  if (commands.length) out.push({ name:'命令', rows: commands.map(c => ({ ic:c.ic, t:hi(c.t,q), s:c.s, k:c.k||'', run:c.run })) });
  if (!cmdOnly && q.length >= 2) { const hits = []; for (const [id, items] of Object.entries(transcripts)) for (const it of items) { const text = it.t === 'user' ? it.md : (it.parts||[]).filter(p => p.k === 'text').map(p => p.md).join(' '); if (text && text.includes(q)) { const i = text.indexOf(q); const s = sessOf(id); const who = it.t === 'user' ? '我' : (it.who ? botById(it.who).name : identityOf(s)?.name || 'Bot'); hits.push({ ic:'💬', t:`${esc(who)} · ${esc(s.title)}`, s:'…' + hi(text.slice(Math.max(0,i-30), i+40).replace(/\n/g,' '), q) + '…', run:() => openSession(id) }); } } out.push({ name:`消息（sessions.search · ${hits.length} 条）`, rows: hits.length ? hits : [{ ic:'∅', t:'没有匹配的消息', s:'', run:() => {} }] }); }
  $('#palList').innerHTML = out.map(g => `<div class="palGroup">${g.name}</div>` + g.rows.map(r => { const i = palRows.push(r) - 1; return `<div class="palItem" data-i="${i}" onmousedown="palRows[${i}].run(); closeAll()"><span class="ic">${r.ic}</span><span class="t">${r.t}<small>${r.s}</small></span><span class="k">${r.k||''}</span></div>`; }).join('')).join('') || `<div class="palGroup">无结果</div>`; paintPal();
}
function paintPal() { $$('.palItem').forEach(el => el.classList.toggle('sel', +el.dataset.i === palSel)); $('.palItem.sel')?.scrollIntoView({ block:'nearest' }); }

/* ===================== 模态 ===================== */
function openModal(kind, id) {
  closeAll(); const m = $('#modal'); m.className = 'modal show' + (kind === 'org' ? ' wide' : ''); $('#scrim').classList.add('show');
  const H = $('#modalHead'), B = $('#modalBody'), F = $('#modalFoot'); F.innerHTML = `<button class="btn" onclick="closeAll()">关闭</button>`;
  if (kind === 'bot') {

/* ===================== 开关 / 快捷键 / 启动 ===================== */
function toggleNative() { const on = document.body.classList.toggle('native'); $('#nativeBtn').textContent = on ? '恢复插件' : '只看 DSH 原生'; if (on && sideView === 'roster') setSideView('ws'); toast(on ? '🧩' : '🤖', on ? '现在是没装插件的 DSH' : '插件已恢复', on ? '流式 / 停止 / 排队 / 附件 / 审批卡都还在，它们本来就是官方的' : '虚线框里的才是插件要写的'); }
function toggleHl() { const on = document.body.classList.toggle('hl'); $('#hlBtn').textContent = on ? '隐藏高亮' : '显示高亮'; }
function toggleTheme() { const h = document.documentElement; h.dataset.theme = h.dataset.theme === 'dark' ? 'light' : 'dark'; }
function toggleRail() { $('#shell').classList.toggle('railLeft'); }
function toast(ic, title, body, onClick) { const el = document.createElement('div'); el.className = 'toast'; el.innerHTML = `<span class="av" style="background:var(--panel2);color:var(--text);font-size:15px;width:30px;height:30px">${ic}</span><div class="t"><b>${esc(title)}</b><span>${esc(body)}</span></div><button class="muted">✕</button>`; el.onclick = e => { if (e.target.tagName !== 'BUTTON' && onClick) onClick(); el.remove(); }; $('#toasts').appendChild(el); setTimeout(() => el.remove(), 6500); }
document.addEventListener('keydown', e => {
  const mod = e.metaKey || e.ctrlKey; const inInput = ['INPUT','TEXTAREA'].includes(document.activeElement?.tagName);
  if (mod && e.key.toLowerCase() === 'k') { e.preventDefault(); $('#palette').classList.contains('show') ? closeAll() : openPalette(); return; }
  if (mod && e.shiftKey && e.key.toLowerCase() === 'b') { e.preventDefault(); setSideView(sideView === 'ws' ? 'roster' : 'ws'); return; }
  if (mod && e.key.toLowerCase() === 'b') { e.preventDefault(); toggleRail(); return; }
  if (mod && e.key.toLowerCase() === 'n') { e.preventDefault(); openModal('bot'); return; }
  if (mod && e.key === ',') { e.preventDefault(); openModal('settings'); return; }
  if (mod && /^[1-9]$/.test(e.key)) { e.preventDefault(); const all = [...bots.filter(b => !hiddenBots.includes(b.id)), ...groups]; const r = all[+e.key-1]; if (r) r.members ? openSession(r.id) : openSession((sessions.find(s => s.bot === r.id)||{}).id||'', r.id); return; }
  if (e.altKey && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) { e.preventDefault(); const all = [...bots.filter(b => !hiddenBots.includes(b.id)), ...groups]; const cur = identityOf(sessOf(currentSession)); const i = all.findIndex(x => x.id === cur?.id); const n = all[(i + (e.key === 'ArrowDown' ? 1 : all.length-1)) % all.length]; n.members ? openSession(n.id) : openSession((sessions.find(s => s.bot === n.id)||{}).id||'', n.id); return; }
  if (e.key === 'Escape') { if ($('#palette').classList.contains('show') || $('#modal').classList.contains('show')) closeAll(); else if ($('.pop')) closePops(); else if (working) stop(); return; }
  if (!inInput && !mod) { if (e.key === '/') { e.preventDefault(); insertText('/'); } if (e.key === '?') { e.preventDefault(); openModal('help'); } }
});
renderSide(); openSession('s-142');
setTimeout(() => toast('👋','完善版原型','这是 DSH 官方壳；虚线框是插件贡献。试试：底部演示按钮、⌘K、名册切换（左上 Bot）、右键 Bot 行、新会话页、关系图。'), 600);
</script>
</body>
</html>
