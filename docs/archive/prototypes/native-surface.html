<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DSH Bot · 原生对话面原型（改进后）</title>
<style>
/* ---------- 主题：跟随宿主，明暗两套 ---------- */
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #12151a; --panel: #181c22; --panel2: #1e232b; --border: #2c333c;
  --text: #e8eaed; --muted: #9aa3ad; --accent: #6b8cff; --accent-soft: rgba(107,140,255,.16);
  --danger: #f07178; --ok: #7fd18a; --warn: #f0c674; --hover: #222830;
  --user-bubble: #2a3446; --shadow: 0 8px 30px rgba(0,0,0,.45);
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #f6f7f9; --panel: #ffffff; --panel2: #f0f2f5; --border: #dfe3e8;
  --text: #1c2128; --muted: #667085; --accent: #3b63f3; --accent-soft: rgba(59,99,243,.12);
  --danger: #d64550; --ok: #2f9e5b; --warn: #b7791f; --hover: #eef1f5;
  --user-bubble: #e3e9f7; --shadow: 0 8px 30px rgba(16,24,40,.14);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
  font: 13px/1.5 ui-sans-serif, system-ui, -apple-system, "PingFang SC", sans-serif; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
kbd { font: 11px ui-monospace, monospace; padding: 1px 5px; border: 1px solid var(--border); border-bottom-width: 2px; border-radius: 4px; color: var(--muted); }

/* ---------- 宿主壳（模拟 DSH 官方布局） ---------- */
.host { display: grid; grid-template-columns: 56px 1fr; height: 100%; }
.hostRail { background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; padding: 10px 0; gap: 8px; }
.railBtn { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; color: var(--muted); font-size: 16px; position: relative; }
.railBtn:hover { background: var(--hover); }
.railBtn.active { background: var(--accent-soft); color: var(--accent); }
.railBtn .dot { position: absolute; top: 6px; right: 6px; width: 8px; height: 8px; border-radius: 50%; background: var(--danger); display: none; }
.railBtn.hasUnread .dot { display: block; }
.railSpacer { flex: 1; }

/* ---------- 插件占据的主区：三栏 ---------- */
.plugin { display: grid; grid-template-columns: 264px 1fr 300px; height: 100%; min-width: 0; transition: grid-template-columns .2s; }
.plugin.noDetails { grid-template-columns: 264px 1fr 0; }
.plugin.noRoster { grid-template-columns: 0 1fr 300px; }
.plugin.noRoster.noDetails { grid-template-columns: 0 1fr 0; }
.roster, .details { overflow: hidden; background: var(--panel); min-width: 0; }
.roster { border-right: 1px solid var(--border); display: flex; flex-direction: column; }
.details { border-left: 1px solid var(--border); display: flex; flex-direction: column; }
@media (max-width: 1100px) { .plugin { grid-template-columns: 220px 1fr 0; } .details { display: none; } }
@media (max-width: 760px) { .plugin { grid-template-columns: 0 1fr 0; } .roster { display: none; } .host { grid-template-columns: 0 1fr; } .hostRail { display: none; } }

/* ---------- 名册 ---------- */
.rosterHead { padding: 10px 12px; display: flex; align-items: center; gap: 6px; border-bottom: 1px solid var(--border); }
.rosterHead h1 { font-size: 13px; margin: 0; flex: 1; font-weight: 600; }
.iconBtn { width: 28px; height: 28px; border-radius: 7px; display: grid; place-items: center; color: var(--muted); }
.iconBtn:hover { background: var(--hover); color: var(--text); }
.search { margin: 8px 10px; padding: 6px 9px; border: 1px solid var(--border); border-radius: 8px; background: var(--panel2); color: var(--muted); display: flex; gap: 8px; align-items: center; cursor: pointer; }
.search kbd { margin-left: auto; }
.sections { flex: 1; overflow: auto; padding: 4px 6px 10px; }
.secHead { display: flex; align-items: center; gap: 6px; padding: 8px 8px 4px; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; cursor: pointer; user-select: none; }
.secHead .caret { transition: transform .15s; display: inline-block; }
.section.collapsed .caret { transform: rotate(-90deg); }
.section.collapsed .row { display: none; }
.row { display: grid; grid-template-columns: 34px 1fr auto; gap: 8px; align-items: center; padding: 7px 8px; border-radius: 9px; cursor: pointer; position: relative; }
.row:hover { background: var(--hover); }
.row.active { background: var(--accent-soft); }
.row.dragging { opacity: .4; }
.row.dropTarget::before { content: ""; position: absolute; left: 8px; right: 8px; top: -1px; height: 2px; background: var(--accent); border-radius: 2px; }
.av { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; font-weight: 700; color: #fff; font-size: 14px; position: relative; }
.av.sq { border-radius: 10px; } .av.blob { border-radius: 40% 60% 55% 45% / 55% 45% 55% 45%; } .av.pebble { border-radius: 50% 50% 45% 55% / 60% 60% 40% 40%; } .av.hex { clip-path: polygon(25% 5%, 75% 5%, 100% 50%, 75% 95%, 25% 95%, 0 50%); border-radius: 0; }
.av .status { position: absolute; right: -2px; bottom: -2px; width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--panel); background: var(--muted); }
.av .status.working { background: var(--warn); animation: pulse 1.2s infinite; }
.av .status.online { background: var(--ok); }
@keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.35); } }
.mosaic { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; padding: 3px; background: var(--panel2); border-radius: 10px; }
.mosaic i { display: block; border-radius: 3px; min-height: 12px; }
.rowMain { min-width: 0; }
.rowName { display: flex; align-items: center; gap: 5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rowName .pin { color: var(--muted); font-size: 11px; }
.rowPrev { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rowMeta { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; font-size: 11px; color: var(--muted); }
.badge { min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--accent); color: #fff; font-size: 11px; font-weight: 700; display: grid; place-items: center; }
.badge.mention { background: var(--danger); }
.rowMenu { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); display: none; }
.row:hover .rowMenu { display: block; } .row:hover .rowMeta { visibility: hidden; }
.rosterFoot { border-top: 1px solid var(--border); padding: 8px 10px; display: flex; gap: 6px; align-items: center; color: var(--muted); font-size: 12px; }
.rosterFoot .sp { flex: 1; }

/* ---------- 对话面 ---------- */
.conv { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--bg); }
.convHead { display: flex; align-items: center; gap: 10px; padding: 8px 14px; border-bottom: 1px solid var(--border); background: var(--panel); }
.convHead .title { font-weight: 600; display: flex; align-items: center; gap: 8px; min-width: 0; }
.convHead .title small { color: var(--muted); font-weight: 400; }
.convHead .sp { flex: 1; }
.pill { padding: 3px 9px; border-radius: 999px; border: 1px solid var(--border); background: var(--panel2); color: var(--muted); font-size: 12px; display: inline-flex; align-items: center; gap: 5px; cursor: pointer; }
.pill:hover { color: var(--text); border-color: var(--accent); }
.pill.on { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
.members { display: flex; gap: 6px; padding: 6px 14px; border-bottom: 1px solid var(--border); background: var(--panel); overflow: auto; align-items: center; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 8px 3px 3px; border-radius: 999px; border: 1px solid var(--border); font-size: 12px; white-space: nowrap; }
.chip .av { width: 20px; height: 20px; font-size: 10px; border-radius: 6px; }
.chip.speaking { border-color: var(--warn); box-shadow: 0 0 0 2px rgba(240,198,116,.25); }
.chip.spoke { opacity: .6; }
.chip.pass { opacity: .45; text-decoration: line-through; }
.roundMeta { margin-left: auto; color: var(--muted); font-size: 12px; display: flex; gap: 8px; align-items: center; }
.transcript { flex: 1; overflow: auto; padding: 16px 18px 8px; scroll-behavior: smooth; }
.dateSep { text-align: center; color: var(--muted); font-size: 11px; margin: 14px 0 10px; display: flex; align-items: center; gap: 10px; }
.dateSep::before, .dateSep::after { content: ""; flex: 1; height: 1px; background: var(--border); }
.unreadSep { color: var(--danger); } .unreadSep::before, .unreadSep::after { background: var(--danger); opacity: .5; }
.msg { display: grid; grid-template-columns: 34px 1fr; gap: 10px; margin: 0 0 12px; position: relative; max-width: 860px; }
.msg.user { grid-template-columns: 1fr 34px; margin-left: auto; }
.msg.user .av { order: 2; } .msg.user .body { order: 1; }
.msg .body { min-width: 0; }
.msg .who { display: flex; gap: 8px; align-items: baseline; margin-bottom: 3px; font-size: 12px; color: var(--muted); }
.msg .who b { color: var(--text); }
.msg.user .who { justify-content: flex-end; }
.bubble { display: inline-block; max-width: 100%; padding: 8px 12px; border-radius: 12px; background: var(--panel2); border: 1px solid var(--border); position: relative; }
.msg.user .bubble { background: var(--user-bubble); border-color: transparent; float: right; }
.bubble.compact { padding: 6px 10px; }
.bubble p { margin: 0 0 .5em; } .bubble p:last-child { margin: 0; }
.bubble pre { margin: .5em 0; padding: 10px 12px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; overflow: auto; font: 12px/1.5 ui-monospace, monospace; position: relative; }
.bubble pre .lang { position: absolute; right: 8px; top: 6px; font-size: 10px; color: var(--muted); }
.bubble pre .copy { position: absolute; right: 8px; bottom: 6px; font-size: 11px; color: var(--muted); }
.bubble code { font: 12px ui-monospace, monospace; background: var(--bg); padding: 0 4px; border-radius: 4px; }
.bubble .tok-k { color: #c792ea; } .bubble .tok-s { color: #c3e88d; } .bubble .tok-f { color: #82aaff; } .bubble .tok-c { color: var(--muted); }
.bubble ul { margin: .3em 0; padding-left: 1.3em; }
.bubble table { border-collapse: collapse; margin: .4em 0; } .bubble td, .bubble th { border: 1px solid var(--border); padding: 3px 8px; }
.bubble .quote { border-left: 3px solid var(--accent); padding: 4px 8px; margin: 0 0 6px; color: var(--muted); font-size: 12px; background: var(--accent-soft); border-radius: 0 6px 6px 0; }
.bubble .quote b { color: var(--text); }
.cursor { display: inline-block; width: 7px; height: 14px; background: var(--accent); vertical-align: -2px; margin-left: 2px; animation: blink .9s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.actions { display: flex; gap: 2px; margin-top: 4px; opacity: 0; transition: opacity .12s; }
.msg:hover .actions { opacity: 1; }
.actions button { padding: 2px 6px; border-radius: 5px; color: var(--muted); font-size: 12px; }
.actions button:hover { background: var(--hover); color: var(--text); }
.reactions { display: flex; gap: 4px; margin-top: 4px; flex-wrap: wrap; }
.reactions span { padding: 1px 7px; border-radius: 999px; border: 1px solid var(--border); background: var(--panel2); font-size: 12px; cursor: pointer; }
.reactions span.mine { border-color: var(--accent); background: var(--accent-soft); }
.split { display: flex; flex-direction: column; gap: 6px; }

/* 工具 / 思考 / 审批 / 提问 卡 */
.card { border: 1px solid var(--border); border-radius: 10px; background: var(--panel); margin: 6px 0; overflow: hidden; max-width: 640px; }
.cardHead { display: flex; align-items: center; gap: 8px; padding: 7px 10px; cursor: pointer; font-size: 12px; user-select: none; }
.cardHead .ic { width: 18px; text-align: center; }
.cardHead .name { font-weight: 600; font-family: ui-monospace, monospace; }
.cardHead .sub { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
.cardHead .st { font-size: 11px; padding: 1px 6px; border-radius: 999px; border: 1px solid var(--border); color: var(--muted); }
.cardHead .st.run { color: var(--warn); border-color: var(--warn); } .cardHead .st.ok { color: var(--ok); border-color: var(--ok); } .cardHead .st.err { color: var(--danger); border-color: var(--danger); }
.cardBody { display: none; border-top: 1px solid var(--border); padding: 8px 10px; font: 12px/1.5 ui-monospace, monospace; color: var(--muted); white-space: pre-wrap; max-height: 220px; overflow: auto; background: var(--bg); }
.card.open .cardBody { display: block; }
.card.approval { border-color: var(--warn); }
.card.approval .cardBody { display: block; font-family: inherit; color: var(--text); background: var(--panel); }
.card.approval pre { margin: 6px 0; padding: 8px; background: var(--bg); border-radius: 6px; font: 12px ui-monospace, monospace; }
.btnRow { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.btn { padding: 5px 11px; border-radius: 7px; border: 1px solid var(--border); background: var(--panel2); font-size: 12px; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.danger { color: var(--danger); }
.btn.ghost { border-color: transparent; color: var(--muted); }
.card.question .cardBody { display: block; font-family: inherit; color: var(--text); background: var(--panel); }
.card.question .btn.chosen { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.card.resolved { opacity: .7; }
.card.system { border-style: dashed; }
.card.system .cardHead { cursor: default; color: var(--muted); }
.wakeTag { font-size: 10px; padding: 1px 6px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-weight: 600; letter-spacing: .04em; }

/* 打字指示 */
.typing { display: inline-flex; gap: 3px; align-items: center; padding: 8px 12px; }
.typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); animation: bob 1s infinite; }
.typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
@keyframes bob { 0%,100% { transform: translateY(0); opacity: .5; } 50% { transform: translateY(-3px); opacity: 1; } }
.jumpNew { position: sticky; bottom: 6px; margin: 0 auto; width: fit-content; display: none; }
.jumpNew.show { display: block; }

/* 队列条 + composer */
.queue { padding: 0 14px; display: flex; flex-direction: column; gap: 4px; }
.qItem { display: flex; align-items: center; gap: 8px; padding: 5px 10px; border: 1px dashed var(--border); border-radius: 8px; font-size: 12px; color: var(--muted); background: var(--panel); }
.qItem .txt { flex: 1; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.qItem button { color: var(--muted); font-size: 11px; padding: 1px 6px; border-radius: 5px; } .qItem button:hover { background: var(--hover); color: var(--text); }
.composerWrap { padding: 8px 14px 12px; }
.replyBar { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border: 1px solid var(--border); border-bottom: 0; border-radius: 10px 10px 0 0; background: var(--panel2); font-size: 12px; color: var(--muted); }
.replyBar b { color: var(--text); } .replyBar .sp { flex: 1; }
.attachRow { display: flex; gap: 6px; padding: 6px 10px 0; flex-wrap: wrap; }
.att { display: inline-flex; align-items: center; gap: 6px; padding: 3px 8px 3px 4px; border-radius: 7px; border: 1px solid var(--border); background: var(--panel2); font-size: 12px; }
.att .thumb { width: 22px; height: 22px; border-radius: 4px; background: linear-gradient(135deg, #6b8cff, #c792ea); }
.att .x { color: var(--muted); }
.composer { border: 1px solid var(--border); border-radius: 12px; background: var(--panel); transition: border-color .12s; }
.composer.reply { border-top-left-radius: 0; border-top-right-radius: 0; }
.composer:focus-within { border-color: var(--accent); }
.composer.dragOver { border-color: var(--accent); border-style: dashed; background: var(--accent-soft); }
.composer textarea { width: 100%; border: 0; background: transparent; color: var(--text); padding: 10px 12px 4px; resize: none; min-height: 40px; max-height: 200px; font: inherit; line-height: 1.5; }
.composer textarea:focus { outline: none; }
.composerBar { display: flex; align-items: center; gap: 4px; padding: 4px 8px 8px; }
.composerBar .sp { flex: 1; }
.modeSel { display: inline-flex; border: 1px solid var(--border); border-radius: 7px; overflow: hidden; font-size: 11px; }
.modeSel button { padding: 3px 8px; color: var(--muted); }
.modeSel button.on { background: var(--accent-soft); color: var(--accent); }
.send { padding: 5px 12px; border-radius: 8px; background: var(--accent); color: #fff; font-weight: 600; display: inline-flex; gap: 6px; align-items: center; }
.send.stop { background: var(--danger); }
.send:disabled { opacity: .5; cursor: default; }
.hint { color: var(--muted); font-size: 11px; padding: 4px 4px 0; display: flex; gap: 12px; }

/* 弹层 */
.pop { position: absolute; z-index: 30; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow); min-width: 200px; padding: 4px; }
.pop button { display: flex; width: 100%; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 7px; text-align: left; font-size: 12.5px; }
.pop button:hover, .pop button.sel { background: var(--hover); }
.pop button .k { margin-left: auto; color: var(--muted); font-size: 11px; }
.pop hr { border: 0; border-top: 1px solid var(--border); margin: 4px 0; }
.pop.emoji { display: grid; grid-template-columns: repeat(8, 30px); gap: 2px; padding: 8px; }
.pop.emoji button { width: 30px; height: 30px; padding: 0; justify-content: center; font-size: 17px; }
.hidden { display: none !important; }

/* ---------- 右侧详情 ---------- */
.detHead { display: flex; gap: 2px; padding: 8px 8px 0; border-bottom: 1px solid var(--border); }
.detHead button { padding: 6px 10px; border-radius: 7px 7px 0 0; color: var(--muted); font-size: 12px; border-bottom: 2px solid transparent; }
.detHead button.on { color: var(--text); border-bottom-color: var(--accent); }
.detBody { flex: 1; overflow: auto; padding: 12px; }
.detBody h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 14px 0 6px; } .detBody h3:first-child { margin-top: 0; }
.fact { display: flex; gap: 8px; align-items: flex-start; padding: 6px 8px; border-radius: 8px; font-size: 12.5px; }
.fact:hover { background: var(--hover); } .fact:hover .del { visibility: visible; }
.fact .src { font-size: 10px; color: var(--muted); white-space: nowrap; margin-top: 3px; }
.fact .t { flex: 1; } .fact .del { visibility: hidden; color: var(--muted); font-size: 11px; }
.fact.faded { opacity: .55; }
.routine { padding: 8px 10px; border: 1px solid var(--border); border-radius: 9px; margin-bottom: 8px; font-size: 12.5px; }
.routine .cron { font: 11px ui-monospace, monospace; color: var(--muted); }
.routine .top { display: flex; align-items: center; gap: 8px; } .routine .top b { flex: 1; }
.sw { width: 30px; height: 17px; border-radius: 999px; background: var(--border); position: relative; } .sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 13px; height: 13px; border-radius: 50%; background: #fff; transition: left .15s; }
.sw.on { background: var(--ok); } .sw.on::after { left: 15px; }
.kv { display: grid; grid-template-columns: 90px 1fr; gap: 4px 10px; font-size: 12.5px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; }
select.inp, input.inp { width: 100%; padding: 5px 8px; border-radius: 7px; border: 1px solid var(--border); background: var(--panel2); color: var(--text); font: inherit; }
.avPalette { display: flex; gap: 5px; flex-wrap: wrap; }
.avPalette .av { width: 26px; height: 26px; cursor: pointer; font-size: 0; }
.avPalette .av.sel { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- 命令面板 ---------- */
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 90; display: none; }
.scrim.show { display: block; }
.palette { position: fixed; z-index: 100; top: 12vh; left: 50%; transform: translateX(-50%); width: min(620px, 92vw); background: var(--panel); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow); display: none; overflow: hidden; }
.palette.show { display: block; }
.palette input { width: 100%; border: 0; padding: 14px 16px; font-size: 15px; background: transparent; color: var(--text); border-bottom: 1px solid var(--border); }
.palette input:focus { outline: none; }
.palList { max-height: 52vh; overflow: auto; padding: 6px; }
.palGroup { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; padding: 8px 10px 3px; }
.palItem { display: grid; grid-template-columns: 26px 1fr auto; gap: 10px; align-items: center; padding: 7px 10px; border-radius: 8px; cursor: pointer; }
.palItem.sel, .palItem:hover { background: var(--hover); }
.palItem .ic { text-align: center; }
.palItem .t { min-width: 0; } .palItem .t small { display: block; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.palItem mark { background: var(--accent-soft); color: var(--accent); padding: 0 1px; border-radius: 2px; }
.palItem .k { color: var(--muted); font-size: 11px; }
.palFoot { display: flex; gap: 14px; padding: 8px 14px; border-top: 1px solid var(--border); color: var(--muted); font-size: 11px; }

/* ---------- toast / 通知 ---------- */
.toasts { position: fixed; right: 16px; bottom: 16px; z-index: 120; display: flex; flex-direction: column; gap: 8px; }
.toast { display: grid; grid-template-columns: 34px 1fr auto; gap: 10px; align-items: center; width: 340px; padding: 10px 12px; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow); animation: slidein .2s ease-out; cursor: pointer; }
.toast .t b { display: block; } .toast .t span { color: var(--muted); font-size: 12px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.toast .x { color: var(--muted); }
@keyframes slidein { from { transform: translateY(12px); opacity: 0; } }

/* ---------- 标注模式 ---------- */
.anno { position: relative; }
body.annotate [data-anno]::after { content: attr(data-anno); position: absolute; z-index: 60; left: 6px; top: 4px; font: 10px/1.3 ui-monospace, monospace; background: #f0c674; color: #1c2128; padding: 2px 6px; border-radius: 4px; pointer-events: none; white-space: nowrap; box-shadow: 0 1px 4px rgba(0,0,0,.3); }
body.annotate [data-anno] { outline: 1px dashed #f0c674; outline-offset: -1px; }
.demoBar { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 80; display: flex; gap: 6px; padding: 6px 8px; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow); align-items: center; flex-wrap: wrap; justify-content: center; max-width: 96vw; }
.demoBar .lbl { color: var(--muted); font-size: 11px; padding: 0 4px; }
.demoBar .btn { font-size: 11.5px; padding: 4px 9px; }
</style>
</head>
<body>
<div class="host">
  <!-- 宿主左侧图标栏：模拟 DSH 官方壳，插件只是其中一个入口 -->
  <nav class="hostRail" data-anno="宿主壳（官方 layout）">
    <button class="railBtn" title="官方会话">💬</button>
    <button class="railBtn active hasUnread" id="railBot" title="DSH Bot（layout slot: conversation）">🤖<span class="dot"></span></button>
    <button class="railBtn" title="工作区">🗂</button>
    <span class="railSpacer"></span>
    <button class="railBtn" id="themeBtn" title="切换主题（跟随宿主 dsh-client-ui-theme）">◐</button>
    <button class="railBtn" title="设置">⚙</button>
  </nav>

  <div class="plugin" id="plugin">
    <!-- ================= 名册 ================= -->
    <aside class="roster anno" data-anno="名册 · events.host: host/session-status + session/projection">
      <div class="rosterHead">
        <h1>DSH Bot</h1>
        <button class="iconBtn" title="新建人设 ⌘N" onclick="toast('🤖','新建人设','打开 BotForm（模态，不再整块替换会话区）')">＋</button>
        <button class="iconBtn" title="新建小组" onclick="toast('👥','新建小组','GroupForm 模态')">⚇</button>
        <button class="iconBtn" title="广播给所有 Bot" onclick="toast('📣','广播','向全部人设各开一个隐藏 turn，回复回到各自 1:1')">📣</button>
        <button class="iconBtn" title="折叠名册 ⌘B" onclick="toggleRoster()">⟨</button>
      </div>
      <div class="search" onclick="openPalette()">🔍 <span>跳转 / 搜索消息…</span><kbd>⌘K</kbd></div>
      <div class="sections" id="sections"></div>
      <div class="rosterFoot">
        <span id="hiddenCount">已隐藏 1 个</span>
        <span class="sp"></span>
        <button class="pill" onclick="toast('🕸','Bot 关系图','谁给谁发过消息 / 谁属于哪个小组（后续阶段）')">🕸 关系图</button>
      </div>
    </aside>

    <!-- ================= 对话面 ================= -->
    <main class="conv">
      <header class="convHead anno" data-anno="conversation.session.header + header.actions">
        <button class="iconBtn" id="rosterToggle" onclick="toggleRoster()" title="名册 ⌘B">☰</button>
        <div class="title" id="convTitle"></div>
        <button class="pill" id="sessionPill" onclick="openPalette('会话 ')" title="切换 / 起题 / 归档">🗒 <span id="sessionName"></span> ▾</button>
        <span class="sp"></span>
        <button class="pill" id="modelPill" onclick="toast('🧠','模型选择器','sessions.models → ModelCatalog（provider 分组 + reasoning 档位），不再手打字符串')">🧠 <span id="modelName">deepseek-v3</span></button>
        <button class="pill" onclick="toast('↗','在官方视图打开','同一 client 内 ctx.sessions.open(id)，无 postMessage 桥')" title="在官方视图打开">↗</button>
        <button class="pill" id="detailsBtn" onclick="toggleDetails()" title="详情 / 记忆 / 例程">ⓘ</button>
      </header>
      <div class="members anno hidden" id="members" data-anno="小组成员三态 + 轮次进度（group-rounds）"></div>
      <section class="transcript anno" id="transcript" data-anno="conversation.view · events.mux: session/event 逐 token 流式"></section>
      <div class="queue anno" id="queue" data-anno="session/queue 帧 · sessions.updateQueue"></div>
      <div class="composerWrap anno" data-anno="conversation.composer · sessions.prompt{mode} / cancel · input.attachments">
        <div class="replyBar hidden" id="replyBar">↩ 回复 <b id="replyWho"></b>：<span id="replyText"></span><span class="sp"></span><button onclick="clearReply()">✕</button></div>
        <div class="composer" id="composer">
          <div class="attachRow hidden" id="attachRow"></div>
          <textarea id="input" rows="1" placeholder="给 Bot 发消息… 支持 @提及、:emoji:、/命令，粘贴或拖入图片"></textarea>
          <div class="composerBar">
            <button class="iconBtn" title="附件" onclick="addAttachment()">📎</button>
            <button class="iconBtn" title="Emoji" id="emojiBtn">🙂</button>
            <button class="iconBtn" title="斜杠命令" onclick="insertText('/')">/</button>
            <span class="sp"></span>
            <div class="modeSel" id="modeSel" title="Bot 工作中时，这条消息怎么送达">
              <button data-mode="queue" class="on">排队</button><button data-mode="steer">打断插话</button>
            </div>
            <button class="send" id="sendBtn">发送 ↵</button>
          </div>
        </div>
        <div class="hint"><span><kbd>↵</kbd> 发送</span><span><kbd>⇧↵</kbd> 换行</span><span><kbd>⌘K</kbd> 跳转</span><span><kbd>⌥↑↓</kbd> 切 Bot</span><span><kbd>Esc</kbd> 停止 / 关闭</span></div>
      </div>
    </main>

    <!-- ================= 右侧详情 ================= -->
    <aside class="details anno" id="details" data-anno="layout slot: details">
      <div class="detHead">
        <button class="on" data-tab="profile">人设</button>
        <button data-tab="memory">记忆</button>
        <button data-tab="routines">例程</button>
        <button data-tab="tasks">任务</button>
      </div>
      <div class="detBody" id="detBody"></div>
    </aside>
  </div>
</div>

<!-- 命令面板 -->
<div class="scrim" id="scrim" onclick="closePalette()"></div>
<div class="palette" id="palette" data-anno="Cmd+K：本地命令 + sessions.search 跨会话消息">
  <input id="palInput" placeholder="跳转到 Bot / 会话，或输入关键字搜索所有消息…" autocomplete="off" />
  <div class="palList" id="palList"></div>
  <div class="palFoot"><span><kbd>↑↓</kbd> 选择</span><span><kbd>↵</kbd> 打开</span><span><kbd>Esc</kbd> 关闭</span><span style="margin-left:auto">前缀：<kbd>会话</kbd> <kbd>></kbd> 命令</span></div>
</div>

<div class="toasts" id="toasts"></div>

<!-- 演示控制条：只为看原型用 -->
<div class="demoBar">
  <span class="lbl">演示</span>
  <button class="btn" onclick="demoStream()">流式回复</button>
  <button class="btn" onclick="demoTool()">工具调用</button>

<script>
/* =====================================================================
   演示数据。真实实现里这些来自：bots.json / groups.json、
   events.host（session-status / projection）、events.mux（session/event）。
   ===================================================================== */
const COLORS = { blue:'#4f7cf0', green:'#3aa76d', orange:'#e0894a', purple:'#9b6ee8', red:'#d95a63', teal:'#2fa3a8', gray:'#7a8594', pink:'#d76aa6' };
const bots = [
  { id:'dsh-bot',  name:'DSH Bot',   avatar:{ shape:'sq',     color:'blue',   text:'D' }, section:'pinned', pinned:true, status:'online',  unread:0, mention:false, preview:'好的，我先看一下仓库结构再回你', time:'刚刚', model:'deepseek-v3' },
  { id:'reviewer', name:'代码审查官', avatar:{ shape:'hex',    color:'red',    text:'审' }, section:'pinned', pinned:true, status:'working', unread:2, mention:true,  preview:'@你 PR #142 有两处需要你决定', time:'3 分钟前', model:'deepseek-r1' },
  { id:'poet',     name:'诗人小北',  avatar:{ shape:'blob',   color:'purple', text:'北' }, section:'work',  status:'idle',    unread:0, mention:false, preview:'今晚的月色像一封没寄出的信', time:'昨天', model:'deepseek-v3' },
  { id:'ops',      name:'运维夜班',  avatar:{ shape:'pebble', color:'teal',   text:'夜' }, section:'work',  status:'idle',    unread:1, mention:false, preview:'[routine] 06:00 巡检：3084 正常，磁盘 71%', time:'06:02', model:'deepseek-v3' },
  { id:'shopper',  name:'比价助手',  avatar:{ shape:'sq',     color:'orange', text:'比' }, section:'life',  status:'idle',    unread:0, mention:false, preview:'M2 Air 16G 这周没降，继续盯', time:'周二', model:'deepseek-v3' },
];
const groups = [
  { id:'g-design', name:'需求评审小组', members:['dsh-bot','reviewer','poet'], section:'work', status:'working', unread:0, preview:'第 2 轮 · 审查官正在回应小北', time:'刚刚', rounds:3, round:2 },
];
const sections = [ { id:'pinned', name:'置顶' }, { id:'work', name:'工作' }, { id:'life', name:'生活' } ];
const collapsed = new Set();
let current = { kind:'bot', id:'reviewer' };
let hiddenBots = ['researcher'];

// 会话 transcript：每个身份一份
const transcripts = {
  reviewer: [
    { t:'date', text:'今天' },
    { t:'user', text:'帮我看一下 PR #142，重点看 group-engine 的改动是不是会影响一轮语义', time:'14:02' },
    { t:'assistant', who:'代码审查官', parts:[
      { kind:'text', md:'收到，先拉 diff 看一下。' },
      { kind:'tool', name:'Shell', sub:'git diff main...pr-142 -- packages/dsh-bot-host/src/group-engine.ts', st:'ok', out:'+53 -12  group-engine.ts\n+ messagesSinceMemberLastSpoke()\n+ OLD_TURN_CLOSE strip in toRoomSpeech()\n- const recent = room.slice(-24)' },
      { kind:'tool', name:'Read', sub:'packages/dsh-bot-host/tests/group-engine.spec.ts', st:'ok', out:'42 cases · 3 new: since-last-spoke / error-line-filter / old-close-strip' },
      { kind:'think', out:'新逻辑只喂"该成员上次发言之后"的行，一轮语义不变，但第一个发言者仍看到全量 24 行……需要确认 memberIds 顺序是否稳定' },
      { kind:'text', md:'看完了，**一轮语义没有变**，改动只影响每个成员看到的上下文窗口：\n\n- 以前：所有成员都看最近 24 行\n- 现在：只看自己上次发言之后的行（第一个发言者仍是 24 行）\n\n有两处需要你拍板，我放在下面。' },
    ], time:'14:03' },
    { t:'user', text:'第二处是什么', time:'14:05', unreadAfter:true },
  ],
  'dsh-bot': [
    { t:'date', text:'今天' },
    { t:'user', text:'介绍一下你自己', time:'09:10' },
    { t:'assistant', who:'DSH Bot', parts:[{ kind:'text', md:'我是这个仓库里的默认人设，负责回答关于插件本身的问题。\n\n我记得你上次让我把小组会话的标题改成首句自动起题，那个已经在 session-nav 里排上了。' }], time:'09:10' },
  ],
  poet: [
    { t:'date', text:'昨天' },
    { t:'user', text:'写两句关于九月的', time:'21:40' },
    { t:'assistant', who:'诗人小北', parts:[{ kind:'text', md:'九月把夏天叠好，放进抽屉最里层\n\n今晚的月色像一封没寄出的信' }], time:'21:41' },
  ],
  ops: [
    { t:'date', text:'今天' },
    { t:'wake', tag:'routine', who:'运维夜班', md:'btw，06:00 巡检跑完了：:3084 网关正常，`env/` 磁盘 71%，比昨天多 2%。没别的事。', time:'06:02' },
  ],
  shopper: [
    { t:'date', text:'周二' },
    { t:'wake', tag:'routine', who:'比价助手', md:'M2 Air 16G 这周三家都没降，最低还是 8,499。我继续每天早上盯，降到 8,000 以下再叫你。', time:'周二 08:00' },
  ],
  'g-design': [
    { t:'date', text:'今天' },
    { t:'user', text:'我们要不要把小组回复引用真正写进房间 jsonl？现在是纯前端匹配。', time:'15:20' },
    { t:'assistant', who:'DSH Bot', parts:[{ kind:'text', md:'我倾向写进去。纯前端用正文字符串匹配，刷新就丢，同文会串。后端加一个可选 `replyTo: {seq, speaker}` 字段，旧行没有这个字段照常渲染。' }], time:'15:21', round:1 },
    { t:'assistant', who:'诗人小北', parts:[{ kind:'text', md:'从体验上说，被引用的人应该"听见"自己被引用了。现在被点名的成员只收到平铺的最近几行，看不出哪句是在回它。' }], time:'15:21', round:1 },
    { t:'assistant', who:'代码审查官', parts:[{ kind:'text', md:'(pass)' }], pass:true, time:'15:22', round:1 },
    { t:'assistant', who:'代码审查官', parts:[{ kind:'quote', who:'诗人小北', text:'被引用的人应该"听见"自己被引用了' }, { kind:'text', md:'补一句：如果写进 jsonl，`buildMemberTurnPrompt` 就能把引用关系渲染成 `> 回复 @小北：…`，这样成员的 prompt 里也有结构，不只是 UI 好看。' }], time:'15:23', round:2 },
  ],
};

const memory = {
  reviewer: {
    profile: [ { t:'用户叫 Nothing，偏好中文回复，技术术语保留英文', src:'自己' }, { t:'仓库一口一仓，本仓只能打 :3084', src:'自己' }, { t:'用户不喜欢 "Certainly" 之类的客套开场', src:'via DSH Bot', shared:true } ],
    log: [ { t:'2026-09-05 审了 PR #139，用户接受了 marks 过滤方案', src:'自己' }, { t:'2026-09-01 用户决定把 token 流式列为非目标（后来推翻）', src:'via DSH Bot', shared:true } ],
    note: [ { t:'用户常在 14:00 左右发 PR', src:'自己', faded:true } ],
  },
};
const routines = {
  ops: [ { name:'早间巡检', cron:'0 6 * * *', on:true, last:'今天 06:00 · 成功' }, { name:'磁盘超 85% 提醒', cron:'@every 30m', on:true, last:'今天 14:30 · 无事，静默' } ],
  shopper: [ { name:'M2 Air 比价', cron:'0 8 * * *', on:true, last:'周二 08:00 · 已汇报' } ],
  reviewer: [ { name:'PR 队列晨报', cron:'0 9 * * 1-5', on:false, last:'尚未启用（Bot 主动提议的）' } ],
};

/* ---------------- 工具函数 ---------------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function botById(id) { return bots.find(b => b.id === id); }
function avatarHtml(a, extra='', statusCls='') {
  return `<span class="av ${a.shape} ${extra}" style="background:${COLORS[a.color]}">${esc(a.text)}${statusCls ? `<i class="status ${statusCls}"></i>` : ''}</span>`;
}
function mosaicHtml(g) {
  return `<span class="av mosaic">${g.members.slice(0,4).map(id => `<i style="background:${COLORS[botById(id).avatar.color]}"></i>`).join('')}</span>`;
}
function md(text) {
  // 演示用极简 markdown：代码块 / 行内 code / 粗体 / 列表 / 段落
  let out = esc(text);
  out = out.replace(/```(\w*)\n([\s\S]*?)```/g, (_, lang, code) => `<pre><span class="lang">${lang}</span>${hl(code)}<button class="copy">复制</button></pre>`);
  out = out.replace(/`([^`]+)`/g, '<code>$1</code>');
  out = out.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
  out = out.split(/\n\n+/).map(p => {
    if (/^- /m.test(p)) return '<ul>' + p.split('\n').map(l => `<li>${l.replace(/^- /,'')}</li>`).join('') + '</ul>';
    if (p.startsWith('<pre>')) return p;
    return `<p>${p.replace(/\n/g,'<br>')}</p>`;
  }).join('');
  return out;
}
function hl(code) {
  return code.replace(/\b(const|let|return|if|await|async|function|import|from)\b/g, '<span class="tok-k">$1</span>')
             .replace(/('[^']*')/g, '<span class="tok-s">$1</span>')
             .replace(/(\/\/.*)/g, '<span class="tok-c">$1</span>');
}

/* ---------------- 名册渲染 ---------------- */
function renderRoster() {
  const host = $('#sections'); host.innerHTML = '';
  for (const sec of sections) {
    const rows = [...bots.filter(b => b.section === sec.id && !hiddenBots.includes(b.id)), ...groups.filter(g => g.section === sec.id)];
    if (rows.length === 0 && sec.id !== 'pinned') continue;
    const el = document.createElement('div'); el.className = 'section' + (collapsed.has(sec.id) ? ' collapsed' : '');
    el.dataset.sec = sec.id;
    el.innerHTML = `<div class="secHead" onclick="toggleSection('${sec.id}')"><span class="caret">▾</span>${sec.name} <span style="margin-left:auto;font-weight:400">${rows.length}</span></div>`;
    for (const r of rows) el.appendChild(rowEl(r));
    host.appendChild(el);
  }
  $('#hiddenCount').textContent = hiddenBots.length ? `已隐藏 ${hiddenBots.length} 个` : '';
  $('#railBot').classList.toggle('hasUnread', [...bots, ...groups].some(x => x.unread > 0));
}
function rowEl(r) {
  const isGroup = !!r.members;
  const active = current.id === r.id;
  const el = document.createElement('div');
  el.className = 'row' + (active ? ' active' : ''); el.draggable = true; el.dataset.id = r.id;
  const statusCls = r.status === 'working' ? 'working' : r.status === 'online' ? 'online' : '';
  el.innerHTML = `
    ${isGroup ? mosaicHtml(r) : avatarHtml(r.avatar, '', statusCls)}
    <div class="rowMain">
      <div class="rowName">${r.pinned ? '<span class="pin">📌</span>' : ''}${esc(r.name)}${isGroup ? ` <small style="color:var(--muted);font-weight:400">· ${r.members.length} 人</small>` : ''}</div>
      <div class="rowPrev">${r.status === 'working' ? '<span style="color:var(--warn)">● 工作中 · </span>' : ''}${esc(r.preview)}</div>
    </div>
    <div class="rowMeta"><span>${esc(r.time)}</span>${r.unread ? `<span class="badge ${r.mention ? 'mention' : ''}">${r.mention ? '@' : r.unread}</span>` : ''}</div>
    <button class="iconBtn rowMenu" title="更多" onclick="event.stopPropagation(); rowMenu(event, '${r.id}', ${isGroup})">⋯</button>`;
  el.onclick = () => select(isGroup ? 'group' : 'bot', r.id);
  el.addEventListener('mouseenter', e => showPreview(e, r, isGroup));
  el.addEventListener('mouseleave', hidePreview);
  el.addEventListener('dragstart', () => { el.classList.add('dragging'); dragId = r.id; });
  el.addEventListener('dragend', () => { el.classList.remove('dragging'); document.querySelectorAll('.dropTarget').forEach(x => x.classList.remove('dropTarget')); });
  el.addEventListener('dragover', e => { e.preventDefault(); el.classList.add('dropTarget'); });
  el.addEventListener('dragleave', () => el.classList.remove('dropTarget'));
  el.addEventListener('drop', e => { e.preventDefault(); dropOn(r.id, el.closest('.section').dataset.sec); });
  return el;
}
let dragId = null;
function dropOn(targetId, sec) {
  const src = bots.find(b => b.id === dragId) || groups.find(g => g.id === dragId);
  if (!src || src.id === targetId) return;
  src.section = sec; src.pinned = sec === 'pinned';
  const list = src.members ? groups : bots;
  list.splice(list.indexOf(src), 1);
  const tgtIdx = list.findIndex(x => x.id === targetId);
  list.splice(tgtIdx < 0 ? list.length : tgtIdx, 0, src);
  renderRoster(); toast('↕','已移动', `${src.name} → ${sections.find(s => s.id === sec).name}（sidebar 排序持久化到 bots.json）`);
}
function toggleSection(id) { collapsed.has(id) ? collapsed.delete(id) : collapsed.add(id); renderRoster(); }

/* ---------------- 详情栏渲染 ---------------- */
let detTab = 'profile';
function renderDetails() {
  const body = $('#detBody');
  const b = current.kind === 'bot' ? botById(current.id) : null;
  const g = current.kind === 'group' ? groups.find(x => x.id === current.id) : null;
  document.querySelectorAll('.detHead button').forEach(x => x.classList.toggle('on', x.dataset.tab === detTab));
  if (detTab === 'profile') {
    if (g) { body.innerHTML = `<h3>成员</h3>${g.members.map(id => { const m = botById(id); return `<div class="fact">${avatarHtml(m.avatar)}<span class="t"><b>${esc(m.name)}</b><br><small style="color:var(--muted)">${m.model}</small></span></div>`; }).join('')}
        <h3>讨论设置</h3><dl class="kv"><dt>每次讨论</dt><dd><select class="inp"><option>1 轮</option><option>2 轮</option><option selected>3 轮</option></select></dd><dt>发言上限</dt><dd>10 条 / 次</dd><dt>全员 pass</dt><dd>提前结束</dd></dl>
        <h3>房间</h3><div class="fact"><span class="t">引用回复持久化方案 <small style="color:var(--muted)">· 今天</small></span></div><div class="fact"><span class="t">session-nav 排期 <small style="color:var(--muted)">· 周三</small></span></div>`; return; }
    body.innerHTML = `<div style="display:flex;gap:12px;align-items:center;margin-bottom:12px">${avatarHtml(b.avatar, 'big')}<div><input class="inp" value="${esc(b.name)}" style="font-weight:600"></div></div>
      <h3>形象</h3><div class="avPalette">${['sq','blob','pebble','hex'].map(s => `<span class="av ${s} ${b.avatar.shape===s?'sel':''}" style="background:${COLORS[b.avatar.color]}" onclick="setShape('${s}')"></span>`).join('')}<span style="width:8px"></span>${Object.keys(COLORS).map(c => `<span class="av sq ${b.avatar.color===c?'sel':''}" style="background:${COLORS[c]}" onclick="setColor('${c}')"></span>`).join('')}</div>
      <h3>人设</h3><textarea class="inp" rows="4" style="resize:vertical">你是一位严格但友善的代码审查官。只指出会影响行为的问题，不评价风格。用中文，术语保留英文。</textarea><div style="color:var(--muted);font-size:11px;margin-top:4px">改动只对之后的新会话生效（preset 代际规则）</div>
      <h3>模型</h3><select class="inp"><option>跟随全局默认</option><option selected>deepseek · deepseek-r1 · reasoning: high</option><option>deepseek · deepseek-v3</option></select>
      <h3>通知</h3><div class="fact"><span class="t">Bot 主动来消息时通知我</span><span class="sw on" onclick="this.classList.toggle('on')"></span></div><div class="fact"><span class="t">需要我审批时通知</span><span class="sw on" onclick="this.classList.toggle('on')"></span></div>`;
  } else if (detTab === 'memory') {
    const m = memory[current.id];
    if (!m) { body.innerHTML = `<div style="color:var(--muted)">这个 Bot 还没记住什么。记忆会在每轮对话后自动抽取，你随时可以删。</div>`; return; }
    const sec = (title, arr) => `<h3>${title}</h3>` + arr.map(f => `<div class="fact ${f.faded?'faded':''}"><span class="t">${esc(f.t)}</span><span class="src" title="来源分片">${f.shared ? '🔗 ' : ''}${esc(f.src)}</span><button class="del" onclick="this.closest('.fact').remove(); toast('🗑','已忘记','memory/…/log 中该行加 tombstone，不会被后台合成再捞回来')">忘记</button></div>`).join('');
    body.innerHTML = `<div style="color:var(--muted);font-size:12px;margin-bottom:6px">优先级：自己的记忆 &gt; 项目记忆 &gt; 用户记忆。🔗 = 来自其他 Bot 的共享分片。</div>` + sec('关于用户（长期）', m.profile) + sec('日志（30 天衰减）', m.log) + sec('备注（最先淡出）', m.note) +
      `<div class="btnRow"><button class="btn ghost" onclick="toast('🌙','后台整理','每 24h 一次合成：合并/去重/移除，显式写入的事实不被改写')">上次整理：今天 03:12</button></div>`;
  } else if (detTab === 'routines') {
    const rs = routines[current.id] || [];
    body.innerHTML = (rs.length ? rs.map(r => `<div class="routine"><div class="top"><b>${esc(r.name)}</b><span class="sw ${r.on?'on':''}" onclick="this.classList.toggle('on')"></span></div><div class="cron">${esc(r.cron)}</div><div style="color:var(--muted);font-size:12px;margin-top:4px">${esc(r.last)}</div></div>`).join('') : `<div style="color:var(--muted)">没有例程。</div>`) +
      `<div class="btnRow"><button class="btn" onclick="toast('⏰','新建例程','cron 到期 → 给该 Bot 一个 [routine] 隐藏 turn → 有话就说，没话静默')">＋ 新建例程</button></div>
       <div style="color:var(--muted);font-size:11px;margin-top:10px">例程到期时 Bot 被唤醒跑一个隐藏 turn。它知道"没有人在等"，所以没事就一条都不发。</div>`;
  } else {
    body.innerHTML = `<h3>后台任务</h3>
      <div class="routine"><div class="top"><b>跑 PR #142 全量测试</b><span class="st run" style="font-size:11px;color:var(--warn)">运行中 2m14s</span></div><div class="cron">pnpm -r test · 子代理</div></div>
      <div class="routine"><div class="top"><b>整理 marks 过滤逻辑</b><span style="font-size:11px;color:var(--ok)">完成</span></div><div class="cron">session/jobs · 完成后已唤醒 Bot 汇报</div></div>
      <div style="color:var(--muted);font-size:11px;margin-top:10px">来自 events.mux 的 session/jobs 帧。任务完成会触发一次唤醒，Bot 用自己的口吻汇报，不会说"任务已完成"这种系统腔。</div>`;
  }
}
function setShape(s) { botById(current.id).avatar.shape = s; renderRoster(); renderDetails(); renderHead(); }
function setColor(c) { botById(current.id).avatar.color = c; renderRoster(); renderDetails(); renderHead(); }
document.querySelectorAll('.detHead button').forEach(b => b.onclick = () => { detTab = b.dataset.tab; renderDetails(); });
</script>
<script>
/* ---------------- 对话面渲染 ---------------- */
function renderHead() {
  const isGroup = current.kind === 'group';
  const r = isGroup ? groups.find(g => g.id === current.id) : botById(current.id);
  $('#convTitle').innerHTML = `${isGroup ? mosaicHtml(r) : avatarHtml(r.avatar)} <span>${esc(r.name)}</span> <small>${isGroup ? r.members.map(id => botById(id).name).join(' · ') : (r.status === 'working' ? '工作中…' : '在线')}</small>`;
  $('#sessionName').textContent = isGroup ? '引用回复持久化方案' : (current.id === 'reviewer' ? 'PR #142 审查' : '新对话');
  $('#modelName').textContent = isGroup ? '各成员自选' : r.model;
  $('#members').classList.toggle('hidden', !isGroup);
  if (isGroup) renderMembers(r);
}
function renderMembers(g, state = {}) {
  $('#members').innerHTML = g.members.map(id => { const m = botById(id); const st = state[id] || (id === 'reviewer' ? 'speaking' : 'spoke'); return `<span class="chip ${st}" title="${st === 'speaking' ? '正在发言' : st === 'pass' ? '本轮 pass' : '本轮已发言'}">${avatarHtml(m.avatar)}${esc(m.name)}</span>`; }).join('') +
    `<span class="roundMeta">第 <b>${g.round}</b> / ${g.rounds} 轮 · 发言 4/10 <button class="pill" onclick="toast('▶','继续讨论','不追加用户消息，直接开下一轮；全员 pass 则提前结束')">▶ 继续讨论</button><button class="pill" onclick="toast('⏹','停止','sessions.cancel 当前成员 + 清空本轮队列')">⏹</button></span>`;
}
function partHtml(p) {
  if (p.kind === 'text') return md(p.md);
  if (p.kind === 'quote') return `<div class="quote">↩ 回复 <b>${esc(p.who)}</b>：${esc(p.text)}</div>`;
  if (p.kind === 'tool') return `<div class="card" onclick="this.classList.toggle('open')"><div class="cardHead"><span class="ic">🔧</span><span class="name">${esc(p.name)}</span><span class="sub">${esc(p.sub)}</span><span class="st ${p.st}">${p.st === 'run' ? '运行中' : p.st === 'ok' ? '完成' : '失败'}</span></div><div class="cardBody">${esc(p.out)}</div></div>`;
  if (p.kind === 'think') return `<div class="card" onclick="this.classList.toggle('open')"><div class="cardHead"><span class="ic">💭</span><span class="sub">思考了 4 秒</span></div><div class="cardBody">${esc(p.out)}</div></div>`;
  return '';
}
function msgActions(role) {
  const common = `<button title="回复" onclick="startReply(this)">↩</button><button title="表情回应" onclick="react(this)">🙂</button><button title="复制" onclick="toast('📋','已复制','')">⧉</button>`;
  const asst = `<button title="重新生成" onclick="toast('↻','重新生成','sessions.fork(atSeq) 后重发，旧分支保留')">↻</button><button title="从这里分叉" onclick="toast('⑂','分叉','sessions.fork → 新会话，出现在会话下拉')">⑂</button>`;
  const user = `<button title="编辑并重发" onclick="toast('✎','编辑重发','fork 到该条之前 + 重新 prompt')">✎</button>`;
  return `<div class="actions">${common}${role === 'user' ? user : asst}</div>`;
}
function renderTranscript() {
  const host = $('#transcript'); const items = transcripts[current.id] || [];
  const me = { shape:'sq', color:'gray', text:'我' };
  host.innerHTML = items.map(it => {
    if (it.t === 'date') return `<div class="dateSep">${esc(it.text)}</div>`;
    if (it.t === 'user') return `<div class="msg user">${avatarHtml(me)}<div class="body"><div class="who"><span>${esc(it.time)}</span></div><div class="bubble">${md(it.text)}</div>${msgActions('user')}</div></div>` + (it.unreadAfter ? `<div class="dateSep unreadSep">以下为新消息</div>` : '');
    const who = bots.find(b => b.name === it.who);
    if (it.t === 'wake') return `<div class="msg">${avatarHtml(who.avatar)}<div class="body"><div class="who"><b>${esc(it.who)}</b><span class="wakeTag">主动 · ${it.tag}</span><span>${esc(it.time)}</span></div><div class="bubble">${md(it.md)}</div>${msgActions('assistant')}</div></div>`;
    if (it.pass) return `<div class="msg">${avatarHtml(who.avatar)}<div class="body"><div class="who"><b>${esc(it.who)}</b><span>${esc(it.time)}</span></div><div style="color:var(--muted);font-size:12px;font-style:italic">本轮没有补充</div></div></div>`;
    // 多条短消息：文本段之间拆成独立气泡，工具/思考卡插在中间
    const chunks = it.parts.map(p => p.kind === 'text' || p.kind === 'quote' ? `<div class="bubble">${partHtml(p)}</div>` : partHtml(p));
    // 合并紧邻的 quote+text
    const merged = []; for (let i = 0; i < it.parts.length; i++) { if (it.parts[i].kind === 'quote' && it.parts[i+1]?.kind === 'text') { merged.push(`<div class="bubble">${partHtml(it.parts[i])}${partHtml(it.parts[i+1])}</div>`); i++; } else merged.push(chunks[i]); }
    return `<div class="msg">${avatarHtml(who.avatar)}<div class="body"><div class="who"><b>${esc(it.who)}</b>${it.round ? `<span>第 ${it.round} 轮</span>` : ''}<span>${esc(it.time)}</span></div><div class="split">${merged.join('')}</div>${msgActions('assistant')}</div></div>`;
  }).join('') + `<button class="btn jumpNew" id="jumpNew" onclick="scrollBottom()">↓ 新消息</button>`;
  scrollBottom();
}
function scrollBottom() { const t = $('#transcript'); t.scrollTop = t.scrollHeight; $('#jumpNew')?.classList.remove('show'); }
$('#transcript').addEventListener('scroll', () => { const t = $('#transcript'); const far = t.scrollHeight - t.scrollTop - t.clientHeight > 120; $('#jumpNew')?.classList.toggle('show', far); });

function select(kind, id) {
  current = { kind, id };
  const r = kind === 'group' ? groups.find(g => g.id === id) : botById(id);
  r.unread = 0; r.mention = false;
  renderRoster(); renderHead(); renderTranscript(); renderDetails(); clearReply();
  $('#input').focus();
}

/* ---------------- Composer：排队 / 打断 / 停止 / 附件 / 回复 ---------------- */
let mode = 'queue'; let working = false; let streamTimer = null; const queue = [];
document.querySelectorAll('#modeSel button').forEach(b => b.onclick = () => { mode = b.dataset.mode; document.querySelectorAll('#modeSel button').forEach(x => x.classList.toggle('on', x === b)); });
const input = $('#input');
input.addEventListener('input', () => { input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 200) + 'px'; suggest(); });
function setWorking(v) {
  working = v;
  const btn = $('#sendBtn');
  if (v) { btn.textContent = '停止 ⎋'; btn.classList.add('stop'); $('#modeSel').style.visibility = 'visible'; input.placeholder = mode === 'queue' ? 'Bot 正在回复，输入会排队…' : 'Bot 正在回复，输入会打断并插话…'; }
  else { btn.textContent = '发送 ↵'; btn.classList.remove('stop'); input.placeholder = '给 Bot 发消息… 支持 @提及、:emoji:、/命令，粘贴或拖入图片'; flushQueue(); }
  renderQueue();
}
function renderQueue() {
  $('#queue').innerHTML = queue.map((q, i) => `<div class="qItem"><span>⏳ 排队 ${i+1}</span><span class="txt">${esc(q)}</span><button onclick="editQueued(${i})">编辑</button><button onclick="steerQueued(${i})">立即插话</button><button onclick="removeQueued(${i})">✕</button></div>`).join('');
}
function editQueued(i) { input.value = queue[i]; queue.splice(i, 1); renderQueue(); input.focus(); }
function removeQueued(i) { queue.splice(i, 1); renderQueue(); }
function steerQueued(i) { const t = queue.splice(i, 1)[0]; renderQueue(); appendUser(t, 'steer'); }
function flushQueue() { if (queue.length && !working) { const t = queue.shift(); renderQueue(); appendUser(t); demoStream(); } }
$('#sendBtn').onclick = () => working ? stopGen() : send();
input.addEventListener('keydown', e => {
  if (sugOpen && ['ArrowDown','ArrowUp','Enter','Escape','Tab'].includes(e.key)) { sugKey(e); return; }
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  if (e.key === 'Escape' && working) stopGen();
});
function send() {
  const text = input.value.trim(); const atts = [...document.querySelectorAll('#attachRow .att')].length;
  if (!text && !atts) return;
  input.value = ''; input.style.height = 'auto'; $('#attachRow').innerHTML = ''; $('#attachRow').classList.add('hidden');
  const shown = text + (atts ? `\n\n📎 ${atts} 张图片` : '');
  if (working) {
    if (mode === 'queue') { queue.push(shown); renderQueue(); toast('⏳','已排队', 'sessions.prompt{mode:"queue"} —— 当前 turn 结束后自动发出'); }
    else { appendUser(shown, 'steer'); toast('⚡','已插话', 'sessions.prompt{mode:"steer"} —— 中断当前生成，带着新消息继续'); restartStream(); }
    clearReply(); return;
  }
  appendUser(shown); clearReply();
  if (current.kind === 'group') demoGroup(); else demoStream();
}
function appendUser(text, tag) {
  const reply = $('#replyBar').classList.contains('hidden') ? '' : `<div class="quote">↩ 回复 <b>${esc($('#replyWho').textContent)}</b>：${esc($('#replyText').textContent)}</div>`;
  const me = { shape:'sq', color:'gray', text:'我' };
  const el = document.createElement('div'); el.className = 'msg user';
  el.innerHTML = `${avatarHtml(me)}<div class="body"><div class="who">${tag === 'steer' ? '<span class="wakeTag">插话</span>' : ''}<span>刚刚</span></div><div class="bubble">${reply}${md(text)}</div>${msgActions('user')}</div>`;
  $('#transcript').insertBefore(el, $('#jumpNew')); scrollBottom();
}
function stopGen() { clearInterval(streamTimer); streamTimer = null; const c = $('#transcript .cursor'); if (c) { c.remove(); } setWorking(false); toast('⏹','已停止', 'sessions.cancel —— 已生成的部分保留，队列不清空'); }

// 附件（粘贴 / 拖拽 / 按钮）
function addAttachment(name = 'screenshot.png', size = '184 KB') {
  const row = $('#attachRow'); row.classList.remove('hidden');
  row.insertAdjacentHTML('beforeend', `<span class="att"><span class="thumb"></span>${esc(name)} <small style="color:var(--muted)">${size}</small><button class="x" onclick="this.parentNode.remove(); if(!document.querySelector('#attachRow .att')) document.querySelector('#attachRow').classList.add('hidden')">✕</button></span>`);
  toast('🖼','图片已暂存', 'PromptContentPart{type:"image"} 随下一条消息一起送出');
}
const composer = $('#composer');
composer.addEventListener('dragover', e => { e.preventDefault(); composer.classList.add('dragOver'); });
composer.addEventListener('dragleave', () => composer.classList.remove('dragOver'));
composer.addEventListener('drop', e => { e.preventDefault(); composer.classList.remove('dragOver'); const f = e.dataTransfer.files?.[0]; addAttachment(f ? f.name : 'dropped.png', f ? Math.round(f.size/1024) + ' KB' : '96 KB'); });
input.addEventListener('paste', e => { for (const it of e.clipboardData.items) if (it.type.startsWith('image/')) { e.preventDefault(); addAttachment('pasted.png', '212 KB'); } });

// 回复引用
function startReply(btn) {
  const msg = btn.closest('.msg'); const who = msg.querySelector('.who b')?.textContent || '我'; const text = msg.querySelector('.bubble')?.textContent.trim().slice(0, 60) || '';
  $('#replyWho').textContent = who; $('#replyText').textContent = text; $('#replyBar').classList.remove('hidden'); composer.classList.add('reply'); input.focus();
}
function clearReply() { $('#replyBar').classList.add('hidden'); composer.classList.remove('reply'); }
function react(btn) {
  const body = btn.closest('.body'); let r = body.querySelector('.reactions'); if (!r) { r = document.createElement('div'); r.className = 'reactions'; body.insertBefore(r, body.querySelector('.actions')); }
  const emo = ['👍','❤️','😂','🎯','👀'][r.children.length % 5];
  r.insertAdjacentHTML('beforeend', `<span class="mine" onclick="this.remove()">${emo} 1</span>`);
}
function insertText(t) { input.value += t; input.focus(); input.dispatchEvent(new Event('input')); }
</script>
<script>
/* ---------------- @ / : / / 建议弹窗 ---------------- */
let sugOpen = false, sugItems = [], sugSel = 0, sugKind = '';
const EMOJI = ['😀','😂','🙂','😉','😍','🤔','😴','😎','🥳','😭','😡','👍','👎','👏','🙏','🎉','🔥','💡','✅','❌','⚠️','📌','🔧','🚀'];
const SLASH = [ { c:'/新对话', d:'在当前 Bot 下开一个新会话' }, { c:'/起题', d:'用首句给当前会话起标题' }, { c:'/归档', d:'归档当前会话' }, { c:'/模型', d:'为这次对话切换模型' }, { c:'/例程', d:'把这条消息设成定时例程' }, { c:'/忘记', d:'让 Bot 忘掉某条记忆' } ];
function suggest() {
  const v = input.value; const m = v.match(/(^|\s)([@:\/])([^\s]*)$/);
  if (!m) return closeSug();
  const [, , trig, q] = m; sugKind = trig;
  if (trig === '@') { const pool = current.kind === 'group' ? [...groups.find(g => g.id === current.id).members.map(botById), { id:'all', name:'all', avatar:{ shape:'sq', color:'gray', text:'*' } }] : bots.filter(b => b.id !== current.id); sugItems = pool.filter(b => b.name.includes(q)).map(b => ({ label:b.name, sub: b.id === 'all' ? '全员' : (current.kind === 'group' ? '点名' : '发给这个 Bot（异步，回复稍后到达）'), ins:`@${b.name} `, av:b.avatar })); }
  else if (trig === ':') { if (q.length < 1) return closeSug(); sugItems = EMOJI.slice(0, 8).map(e => ({ label:e, sub:q, ins:e + ' ' })); }
  else { sugItems = SLASH.filter(s => s.c.includes(q)).map(s => ({ label:s.c, sub:s.d, ins:s.c + ' ' })); }
  if (!sugItems.length) return closeSug();
  sugSel = 0; renderSug(); sugOpen = true;
}
function renderSug() {
  let pop = $('#sugPop'); if (!pop) { pop = document.createElement('div'); pop.id = 'sugPop'; pop.className = 'pop'; document.body.appendChild(pop); }
  const rc = composer.getBoundingClientRect(); pop.style.left = rc.left + 8 + 'px'; pop.style.bottom = (window.innerHeight - rc.top + 6) + 'px'; pop.style.top = 'auto';
  pop.innerHTML = sugItems.map((s, i) => `<button class="${i === sugSel ? 'sel' : ''}" onmousedown="event.preventDefault(); pickSug(${i})">${s.av ? avatarHtml(s.av) : `<span style="width:20px;text-align:center">${s.label}</span>`}<span>${s.av ? esc(s.label) : ''}</span><span class="k">${esc(s.sub)}</span></button>`).join('');
  pop.classList.remove('hidden');
}
function closeSug() { sugOpen = false; $('#sugPop')?.classList.add('hidden'); }
function pickSug(i) { const s = sugItems[i]; input.value = input.value.replace(/([@:\/])[^\s]*$/, s.ins); closeSug(); input.focus(); input.dispatchEvent(new Event('input')); }
function sugKey(e) {
  if (e.key === 'ArrowDown') { sugSel = (sugSel + 1) % sugItems.length; renderSug(); e.preventDefault(); }
  else if (e.key === 'ArrowUp') { sugSel = (sugSel - 1 + sugItems.length) % sugItems.length; renderSug(); e.preventDefault(); }
  else if (e.key === 'Enter' || e.key === 'Tab') { pickSug(sugSel); e.preventDefault(); }
  else if (e.key === 'Escape') { closeSug(); e.preventDefault(); }
}
$('#emojiBtn').onclick = e => {
  e.stopPropagation(); let pop = $('#emojiPop');
  if (pop) { pop.remove(); return; }
  pop = document.createElement('div'); pop.id = 'emojiPop'; pop.className = 'pop emoji';
  const rc = e.currentTarget.getBoundingClientRect(); pop.style.left = rc.left + 'px'; pop.style.bottom = (window.innerHeight - rc.top + 6) + 'px';
  pop.innerHTML = EMOJI.map(x => `<button onclick="insertText('${x}'); document.getElementById('emojiPop').remove()">${x}</button>`).join('');
  document.body.appendChild(pop);
};
document.addEventListener('click', e => { if (!e.target.closest('#emojiPop,#emojiBtn')) $('#emojiPop')?.remove(); if (!e.target.closest('#rowPop,.rowMenu')) $('#rowPop')?.remove(); });

/* ---------------- 名册行菜单 / 悬停预览 ---------------- */
function rowMenu(e, id, isGroup) {
  $('#rowPop')?.remove(); const pop = document.createElement('div'); pop.id = 'rowPop'; pop.className = 'pop';
  pop.style.left = e.clientX + 'px'; pop.style.top = e.clientY + 'px';
  const r = isGroup ? groups.find(g => g.id === id) : botById(id);
  pop.innerHTML = `
    <button onclick="togglePin('${id}')">📌 ${r.pinned ? '取消置顶' : '置顶'}</button>
    <button onclick="toast('✎','重命名','行内编辑，改名会作为 [event] 唤醒该 Bot')">✎ 重命名</button>

    <button onclick="markRead('${id}')">✓ 标为已读</button>
    <hr>
    ${isGroup ? '' : `<button onclick="hideBot('${id}')">🙈 隐藏（继续在后台跑）</button>`}
    <button onclick="toast('🔕','已静音','此 Bot 主动消息不再弹通知，只累积未读')">🔕 静音</button>
    <hr>
    <button style="color:var(--danger)" onclick="toast('🗑','删除','二次确认；Bot 自己没有任何工具能删自己，只有这里能')">🗑 删除</button>`;
  document.body.appendChild(pop);
}
function togglePin(id) { const r = botById(id) || groups.find(g => g.id === id); r.pinned = !r.pinned; r.section = r.pinned ? 'pinned' : 'work'; renderRoster(); $('#rowPop')?.remove(); }
function moveTo(id) { const r = botById(id) || groups.find(g => g.id === id); r.section = r.section === 'work' ? 'life' : 'work'; r.pinned = false; renderRoster(); $('#rowPop')?.remove(); }
function markRead(id) { const r = botById(id) || groups.find(g => g.id === id); r.unread = 0; r.mention = false; renderRoster(); $('#rowPop')?.remove(); }
function hideBot(id) { hiddenBots.push(id); if (current.id === id) select('bot', 'dsh-bot'); renderRoster(); $('#rowPop')?.remove(); toast('🙈','已隐藏','例程和主动消息照常运行，未读会记在「已隐藏」里'); }
let prevTimer = null;
function showPreview(e, r, isGroup) {
  clearTimeout(prevTimer); prevTimer = setTimeout(() => {
    $('#prevPop')?.remove(); const pop = document.createElement('div'); pop.id = 'prevPop'; pop.className = 'pop'; pop.style.pointerEvents = 'none'; pop.style.padding = '10px 12px'; pop.style.minWidth = '240px';

      <div style="font-size:12px;color:var(--muted)">${esc(r.preview)}</div>
      ${rs.length ? `<div style="font-size:11px;color:var(--muted);margin-top:6px">⏰ ${rs.filter(x => x.on).length} 个例程在跑</div>` : ''}`;
    document.body.appendChild(pop);
  }, 500);
}
function hidePreview() { clearTimeout(prevTimer); $('#prevPop')?.remove(); }

/* ---------------- 命令面板：本地命令 + 会话 + 跨会话消息搜索 ---------------- */
let palSel = 0, palRows = [];
function openPalette(prefill = '') { $('#scrim').classList.add('show'); $('#palette').classList.add('show'); const i = $('#palInput'); i.value = prefill; i.focus(); renderPal(); }
function closePalette() { $('#scrim').classList.remove('show'); $('#palette').classList.remove('show'); }
$('#palInput').addEventListener('input', renderPal);
$('#palInput').addEventListener('keydown', e => {
  if (e.key === 'ArrowDown') { palSel = Math.min(palSel + 1, palRows.length - 1); paintPal(); e.preventDefault(); }
  else if (e.key === 'ArrowUp') { palSel = Math.max(palSel - 1, 0); paintPal(); e.preventDefault(); }
  else if (e.key === 'Enter') { palRows[palSel]?.run(); closePalette(); }
  else if (e.key === 'Escape') closePalette();
});
function hi(text, q) { if (!q) return esc(text); const i = text.toLowerCase().indexOf(q.toLowerCase()); return i < 0 ? esc(text) : esc(text.slice(0, i)) + '<mark>' + esc(text.slice(i, i + q.length)) + '</mark>' + esc(text.slice(i + q.length)); }
function renderPal() {
  const raw = $('#palInput').value; palRows = []; palSel = 0;
  const groupsOut = [];
  const cmd = raw.startsWith('>'); const sess = raw.startsWith('会话'); const q = raw.replace(/^(>|会话)\s*/, '').trim();
  const commands = [
    { ic:'🤖', t:'新建人设', s:'打开 BotForm', k:'⌘N', run:() => toast('🤖','新建人设','') },
    { ic:'👥', t:'新建小组', s:'选 2–6 个人设', run:() => toast('👥','新建小组','') },
    { ic:'📣', t:'广播给所有 Bot', s:'每个 Bot 各开一个隐藏 turn', run:() => toast('📣','广播','') },
    { ic:'🗒', t:'新开对话', s:'当前 Bot 下新会话', run:() => toast('🗒','新开对话','') },
    { ic:'🧹', t:'清空当前对话', s:'', run:() => toast('🧹','已清空','') },
    { ic:'◐', t:'切换主题', s:'跟随宿主 / 亮 / 暗', run:toggleTheme },
    { ic:'⚙', t:'DSH Bot 设置', s:'settings.section slot', k:'⌘,', run:() => toast('⚙','设置','') },
  ].filter(c => !q || c.t.includes(q));
  const sessionsList = [ { t:'PR #142 审查', s:'代码审查官 · 今天', bot:'reviewer' }, { t:'marks 过滤方案', s:'代码审查官 · 周五', bot:'reviewer' }, { t:'引用回复持久化方案', s:'需求评审小组 · 今天', bot:'g-design', g:true }, { t:'九月', s:'诗人小北 · 昨天', bot:'poet' }, { t:'M2 Air 比价', s:'比价助手 · 周二', bot:'shopper' } ].filter(x => !q || x.t.includes(q) || x.s.includes(q));
  const botsList = [...bots.map(b => ({ ...b, g:false })), ...groups.map(g => ({ ...g, g:true }))].filter(x => !q || x.name.includes(q));
  if (!cmd && !sess && botsList.length) groupsOut.push({ name:'Bot / 小组', rows: botsList.map((b, i) => ({ ic:b.g ? mosaicHtml(b) : avatarHtml(b.avatar), t:hi(b.name, q), s:b.preview, k: i < 9 ? `⌘${i+1}` : '', run:() => select(b.g ? 'group' : 'bot', b.id) })) });
  if (!cmd && sessionsList.length) groupsOut.push({ name:'会话', rows: sessionsList.map(s => ({ ic:'🗒', t:hi(s.t, q), s:s.s, run:() => select(s.g ? 'group' : 'bot', s.bot) })) });
  if (!sess && commands.length) groupsOut.push({ name:'命令', rows: commands.map(c => ({ ic:c.ic, t:hi(c.t, q), s:c.s, k:c.k || '', run:c.run })) });
  if (!cmd && !sess && q.length >= 2) {
    const hits = [];
    for (const [id, items] of Object.entries(transcripts)) for (const it of items) { const text = it.t === 'user' ? it.text : it.t === 'wake' ? it.md : (it.parts || []).filter(p => p.kind === 'text').map(p => p.md).join(' '); if (text && text.includes(q)) { const i = text.indexOf(q); const who = it.t === 'user' ? '我' : it.who; hits.push({ ic:'💬', t:`${esc(who)} · ${esc((botById(id) || groups.find(g => g.id === id)).name)}`, s:'…' + hi(text.slice(Math.max(0, i - 30), i + 40).replace(/\n/g, ' '), q) + '…', run:() => select(groups.find(g => g.id === id) ? 'group' : 'bot', id) }); } }
    groupsOut.push({ name:`消息（sessions.search · ${hits.length} 条）`, rows: hits.length ? hits : [{ ic:'∅', t:'没有匹配的消息', s:'', run:() => {} }] });
  }
  $('#palList').innerHTML = groupsOut.map(g => `<div class="palGroup">${g.name}</div>` + g.rows.map(r => { const idx = palRows.push(r) - 1; return `<div class="palItem" data-i="${idx}" onmousedown="palRows[${idx}].run(); closePalette()"><span class="ic">${r.ic}</span><span class="t">${r.t}<small>${r.s}</small></span><span class="k">${r.k || ''}</span></div>`; }).join('')).join('') || `<div class="palGroup">无结果</div>`;
  paintPal();
}
function paintPal() { document.querySelectorAll('.palItem').forEach(el => el.classList.toggle('sel', +el.dataset.i === palSel)); document.querySelector('.palItem.sel')?.scrollIntoView({ block:'nearest' }); }

/* ---------------- 演示流程 ---------------- */
function assistantShell(who) {
  const b = bots.find(x => x.name === who) || botById(current.id);
  const el = document.createElement('div'); el.className = 'msg';
  el.innerHTML = `${avatarHtml(b.avatar)}<div class="body"><div class="who"><b>${esc(b.name)}</b><span>刚刚</span></div><div class="split"><div class="typing"><i></i><i></i><i></i></div></div>${msgActions('assistant')}</div>`;
  $('#transcript').insertBefore(el, $('#jumpNew')); scrollBottom(); return el.querySelector('.split');
}
function streamInto(split, text, done) {
  split.querySelector('.typing')?.remove();
  const bub = document.createElement('div'); bub.className = 'bubble'; bub.innerHTML = '<span class="cursor"></span>'; split.appendChild(bub);
  let i = 0; clearInterval(streamTimer);
  streamTimer = setInterval(() => {
    i += 1 + Math.floor(Math.random() * 3);
    bub.innerHTML = md(text.slice(0, i)) + '<span class="cursor"></span>';
    if (!$('#jumpNew').classList.contains('show')) scrollBottom();
    if (i >= text.length) { clearInterval(streamTimer); streamTimer = null; bub.innerHTML = md(text); done && done(); }
  }, 30);
}
let lastStreamText = '';
function demoStream() {
  if (working) return;
  setWorking(true);
  const b = current.kind === 'bot' ? botById(current.id) : null; if (b) { b.status = 'working'; renderRoster(); }
  const split = assistantShell();
  lastStreamText = '第二处在 `toRoomSpeech` 的签名改动：第二个参数从 `turnPrompt` 变成了 `written`，默认空串。\n\n这本身没问题，但有一个**调用点在测试里还传的是旧参数名的语义**——传进去的是整段唤醒词而不是"写进去的原文"。测试仍然过，是因为剥离逻辑是子串匹配。建议要么改测试，要么在函数头加一行断言，两种都行，你选。';
  setTimeout(() => streamInto(split, lastStreamText, () => { setWorking(false); if (b) { b.status = 'online'; b.preview = '两种都行，你选'; renderRoster(); } }), 600);
}
function restartStream() { clearInterval(streamTimer); const c = $('#transcript .cursor'); if (c) c.remove(); const split = assistantShell(); setTimeout(() => streamInto(split, '好，先回你插进来的这句：是的，改测试更干净。\n\n回到刚才的话题——', () => setWorking(false)), 500); }
function demoTool() {
  if (working) return; setWorking(true);
  const split = assistantShell();
  setTimeout(() => { split.querySelector('.typing')?.remove(); split.insertAdjacentHTML('beforeend', `<div class="bubble">${md('我跑一下测试确认。')}</div>`); split.insertAdjacentHTML('beforeend', partHtml({ kind:'tool', name:'Shell', sub:'pnpm --filter dsh-bot-host test -- group-engine', st:'run', out:'' })); scrollBottom(); }, 400);
  setTimeout(() => { const card = split.querySelector('.card'); card.querySelector('.st').className = 'st ok'; card.querySelector('.st').textContent = '完成 · 3.2s'; card.querySelector('.cardBody').textContent = '✓ 42 passed\n  ✓ since-last-spoke (12ms)\n  ✓ error-line-filter (4ms)\n  ✓ old-close-strip (3ms)'; }, 2600);
  setTimeout(() => streamInto(split, '42 个全过，包括新加的 3 个。可以合。', () => setWorking(false)), 3000);
}
function demoApproval() {
  if (working) return; setWorking(true);
  const split = assistantShell();
  setTimeout(() => { split.querySelector('.typing')?.remove(); split.insertAdjacentHTML('beforeend', `<div class="bubble">${md('这一步要动 git，我先问你。')}</div>`);
    split.insertAdjacentHTML('beforeend', `<div class="card approval" id="apv"><div class="cardHead" style="cursor:default"><span class="ic">🛡</span><span class="name">需要你批准</span><span class="sub">approval/requested · Shell</span></div><div class="cardBody">代码审查官想在 <code>packages/dsh-bot-host</code> 执行：<pre>git commit -am "test: assert toRoomSpeech(written) semantics"</pre><div class="btnRow"><button class="btn primary" onclick="resolveApproval(true)">允许这次</button><button class="btn" onclick="resolveApproval(true, '本会话内 git commit 不再询问')">本会话都允许</button><button class="btn danger" onclick="resolveApproval(false)">拒绝</button></div></div></div>`); scrollBottom(); }, 500);
  const b = bots.find(x => x.id === current.id); if (b) { b.unread = 0; b.preview = '等你批准 git commit'; renderRoster(); }
  toast('🛡','代码审查官 需要你批准','git commit -am "test: …" — 点击查看', () => {});
}
function resolveApproval(ok, note) {
  const card = $('#apv'); card.classList.add('resolved'); card.querySelector('.btnRow').innerHTML = `<span style="color:${ok ? 'var(--ok)' : 'var(--danger)'};font-size:12px">${ok ? '✓ 已允许' : '✕ 已拒绝'}${note ? ' · ' + note : ''}</span>`;
  const split = card.closest('.split');
  setTimeout(() => streamInto(split, ok ? '提交了，`a3f19c2`。' : '好，那我不提交。补丁在 `/tmp/torooomspeech.patch`，你想要的话自己 apply。', () => setWorking(false)), 400);
}
function demoQuestion() {
  if (working) return; setWorking(true);
  const split = assistantShell();
  setTimeout(() => { split.querySelector('.typing')?.remove();
    split.insertAdjacentHTML('beforeend', `<div class="card question" id="qst"><div class="cardHead" style="cursor:default"><span class="ic">❔</span><span class="name">两种修法，你选哪种</span><span class="sub">question/requested</span></div><div class="cardBody"><div class="btnRow"><button class="btn" onclick="answerQ(this,'改测试')">改测试，传真实 written</button><button class="btn" onclick="answerQ(this,'加断言')">函数头加断言，测试不动</button><button class="btn ghost" onclick="answerQ(this,'都不')">都不改，先合</button></div></div></div>`); scrollBottom(); }, 500);
}
function answerQ(btn, choice) { btn.classList.add('chosen'); btn.parentNode.querySelectorAll('button').forEach(b => b.disabled = true); $('#qst').classList.add('resolved'); setTimeout(() => streamInto($('#qst').closest('.split'), `行，${choice}。给我半分钟。`, () => setWorking(false)), 300); }
function demoWake() {
  const b = botById('ops'); b.unread += 1; b.time = '刚刚'; b.preview = '磁盘涨到 86% 了，:3084 还正常';
  transcripts.ops.push({ t:'wake', tag:'routine', who:'运维夜班', md:'磁盘涨到 **86%** 了，超过你设的 85%。:3084 还正常。`env/sessions/` 占了大头，要我清 30 天前的隐藏轮次会话吗？', time:'刚刚' });
  renderRoster();
  if (current.id === 'ops') renderTranscript();
  toast('🌙', '运维夜班', '磁盘涨到 86% 了，超过你设的 85%。要我清 30 天前的隐藏轮次会话吗？', () => select('bot','ops'));
  if ('Notification' in window && Notification.permission === 'granted') new Notification('运维夜班', { body:'磁盘涨到 86% 了，要我清一下吗？' });
}
function demoGroup() {
  if (current.kind !== 'group') { select('group', 'g-design'); }
  if (working) return; setWorking(true);
  const g = groups.find(x => x.id === 'g-design'); const order = ['poet','reviewer','dsh-bot'];
  const lines = { poet:'我同意审查官说的"prompt 里也有结构"。那字段名就叫 `replyTo`，别叫 `quote`，后者容易和 markdown 引用混。', reviewer:'(pass)', 'dsh-bot':'那定了：`replyTo: {seq, speaker}` 可选字段，旧行兼容，`buildMemberTurnPrompt` 渲染成引用块。我去开个 spec 包。' };
  const state = {}; order.forEach(id => state[id] = 'pending'); g.round = 3; g.status = 'working'; renderRoster();
  let i = 0;
  const step = () => {
    if (i >= order.length) { g.status = 'idle'; g.preview = '第 3 轮结束 · 已定方案'; renderRoster(); renderMembers(g, Object.fromEntries(order.map(id => [id, state[id]]))); setWorking(false); return; }
    const id = order[i]; state[id] = 'speaking'; renderMembers(g, state);
    if (lines[id] === '(pass)') { state[id] = 'pass'; $('#transcript').insertBefore(Object.assign(document.createElement('div'), { className:'msg', innerHTML:`${avatarHtml(botById(id).avatar)}<div class="body"><div class="who"><b>${esc(botById(id).name)}</b><span>第 3 轮</span></div><div style="color:var(--muted);font-size:12px;font-style:italic">本轮没有补充</div></div>` }), $('#jumpNew')); i++; setTimeout(step, 900); return; }
    const split = assistantShell(botById(id).name);
    setTimeout(() => streamInto(split, lines[id], () => { state[id] = 'spoke'; i++; setTimeout(step, 600); }), 700);
  };
  setTimeout(step, 400);
}

/* ---------------- toast / 主题 / 布局 / 快捷键 ---------------- */
function toast(ic, title, body, onClick) {
  const el = document.createElement('div'); el.className = 'toast';
  el.innerHTML = `<span class="av sq" style="background:var(--panel2);color:var(--text);font-size:16px">${ic}</span><div class="t"><b>${esc(title)}</b><span>${esc(body)}</span></div><button class="x">✕</button>`;
  el.onclick = e => { if (!e.target.classList.contains('x') && onClick) onClick(); el.remove(); };
  $('#toasts').appendChild(el); setTimeout(() => el.remove(), 6000);
}
function toggleTheme() { const h = document.documentElement; h.dataset.theme = h.dataset.theme === 'dark' ? 'light' : 'dark'; }
$('#themeBtn').onclick = toggleTheme;
function toggleRoster() { $('#plugin').classList.toggle('noRoster'); }
function toggleDetails() { $('#plugin').classList.toggle('noDetails'); $('#detailsBtn').classList.toggle('on'); }
function toggleAnno() { document.body.classList.toggle('annotate'); $('#annoBtn').classList.toggle('primary'); }
document.addEventListener('keydown', e => {
  const mod = e.metaKey || e.ctrlKey;
  if (mod && e.key.toLowerCase() === 'k') { e.preventDefault(); $('#palette').classList.contains('show') ? closePalette() : openPalette(); return; }
  if (mod && e.key.toLowerCase() === 'b') { e.preventDefault(); toggleRoster(); return; }
  if (mod && e.key.toLowerCase() === 'n') { e.preventDefault(); toast('🤖','新建人设',''); return; }
  if (mod && e.key === ',') { e.preventDefault(); toast('⚙','设置',''); return; }
  if (mod && /^[1-9]$/.test(e.key)) { e.preventDefault(); const all = [...bots.filter(b => !hiddenBots.includes(b.id)), ...groups]; const r = all[+e.key - 1]; if (r) select(r.members ? 'group' : 'bot', r.id); return; }
  if (e.altKey && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) { e.preventDefault(); const all = [...bots.filter(b => !hiddenBots.includes(b.id)), ...groups]; const i = all.findIndex(x => x.id === current.id); const n = all[(i + (e.key === 'ArrowDown' ? 1 : all.length - 1)) % all.length]; select(n.members ? 'group' : 'bot', n.id); return; }
  if (e.key === 'Escape') { if ($('#palette').classList.contains('show')) closePalette(); else if ($('#emojiPop') || $('#rowPop')) { $('#emojiPop')?.remove(); $('#rowPop')?.remove(); } else if (working) stopGen(); }
  if (e.key === '/' && document.activeElement !== input && !mod) { e.preventDefault(); input.focus(); insertText('/'); }
});

/* ---------------- 启动 ---------------- */
renderRoster(); renderHead(); renderTranscript(); renderDetails();
setTimeout(() => toast('👋','这是改进后的原型','底部演示条可触发：流式回复 / 工具卡 / 审批卡 / 提问卡 / Bot 主动来消息 / 小组多轮。「标注模式」显示每块 UI 对应的平台 slot 与 RPC。'), 600);
</script>
