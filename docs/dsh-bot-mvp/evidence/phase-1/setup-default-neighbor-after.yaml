ui-onboarding:
  welcomeNoticeVersion: 2026-08-13.1
llm-deepseek:
  reasoningEffort: max
  retryPolicy:
    mode: normal
    maxRetries: 5
  baseURL: https://panpanpan.59188888.xyz/v1
web-search-deepseek:
  baseURL: https://panpanpan.59188888.xyz/v1
  model: deepseek-v4-flash
agent-default-model:
  provider: anthropic
  model: grok-4.6
  reasoningEffort: xhigh
agent-presets:
  default: dsh-bot
llm-pi-ai:
  providers:
    anthropic:
      displayName: Anthropic
      apiKeyEnv: ANTHROPIC_API_KEY
      api: anthropic-messages
      baseURL: https://panpanpan.59188888.xyz
      reasoning: xhigh
      models:
        - id: grok-4.6
          name: grok-4.6
          contextWindow: 2000000
          maxTokens: 128000
          input:
            - text
            - image
          reasoningEfforts:
            off: null
            low: low
            medium: medium
            high: high
            xhigh: xhigh
