<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>v1 leftover t18 — DeepSeek Harness（DSH Bot 叠加原型 · 基于真实壳）</title>
<style>
/* ======================================================================
   真实壳还原。依据：docs/prototypes/real-dsh-ui-survey.md + real/*.png + real/*.dom.json
   - 字体 16px system-ui / PingFang SC；暗色底 rgb(21,21,23)；浅色中栏白、左栏 #f9fafb
   - 三栏 .pI_x6G_frame：sidebarCol / centerCol / detailsCol；details 默认 0 宽
   - better-sidebar 在 overlay 层，右侧页签条 Files | DSH Bot | +
   hashed class 会变，这里只用 data-slot / data-phase 语义标记。
   ====================================================================== */
:root[data-theme="dark"] { color-scheme:dark; --bg:#151517; --side:#151517; --panel:#1c1c1f; --panel2:#232326; --border:#2a2a2e; --text:#ececef; --muted:#8b8b93; --accent:#5b7cfa; --accent-soft:rgba(91,124,250,.16); --danger:#e5484d; --ok:#46a758; --warn:#f5a524; --hover:#222225; --user:#26262b; --shadow:0 8px 30px rgba(0,0,0,.5); --plug:#f5a524; --plug-soft:rgba(245,165,36,.14); }
:root[data-theme="light"] { color-scheme:light; --bg:#ffffff; --side:#f9fafb; --panel:#ffffff; --panel2:#f3f4f6; --border:#e5e7eb; --text:#111318; --muted:#6b7280; --accent:#3b5bdb; --accent-soft:rgba(59,91,219,.12); --danger:#d64550; --ok:#2f9e5b; --warn:#b7791f; --hover:#f1f3f5; --user:#f3f4f6; --shadow:0 8px 30px rgba(16,24,40,.14); --plug:#b7791f; --plug-soft:rgba(183,121,31,.12); }
* { box-sizing:border-box; }
html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font:16px/1.5 -apple-system, system-ui, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Helvetica, Arial, sans-serif; }
button { font:inherit; color:inherit; background:none; border:0; cursor:pointer; }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
.hidden { display:none !important; } .sp { flex:1; } .muted { color:var(--muted); } .small { font-size:13px; } .xs { font-size:12px; }
kbd { font:12px ui-monospace, monospace; padding:1px 5px; border:1px solid var(--border); border-radius:4px; color:var(--muted); }

/* ---------- .pI_x6G_frame 三栏 ---------- */
.frame { display:grid; grid-template-columns:280px 1fr 0px; height:100%; position:relative; transition:grid-template-columns .18s; }
.frame[data-sidebar-collapsed="true"] { grid-template-columns:56px 1fr 0px; }
.frame[data-details-collapsed="false"] { grid-template-columns:280px 1fr 340px; }
.frame[data-sidebar-collapsed="true"][data-details-collapsed="false"] { grid-template-columns:56px 1fr 340px; }
.frame.betterOpen { padding-right:380px; }
.col { min-width:0; overflow:hidden; display:flex; flex-direction:column; }

/* ---------- 左栏 [data-slot=sidebar] ---------- */
.sidebarCol { background:var(--side); border-right:1px solid var(--border); }
.brand { display:flex; align-items:center; gap:8px; padding:14px 14px 10px; font-weight:700; letter-spacing:.02em; white-space:nowrap; }
.brand .fish { width:20px; height:20px; flex:none; }
.brand .name { font-size:15px; } .brand .name small { font-weight:600; font-size:11px; letter-spacing:.12em; margin-left:4px; color:var(--muted); }
.newSess { display:flex; align-items:center; gap:8px; margin:2px 10px 8px; padding:8px 10px; border-radius:8px; border:1px solid var(--border); background:var(--panel); font-size:14px; }
.newSess:hover { background:var(--hover); }
.wsHead { display:flex; align-items:center; gap:4px; padding:8px 12px 4px; color:var(--muted); font-size:13px; }
.wsHead .ic { width:26px; height:26px; border-radius:6px; display:grid; place-items:center; font-size:14px; } .wsHead .ic:hover { background:var(--hover); color:var(--text); }
.tree { flex:1; overflow:auto; padding:0 8px 8px; font-size:14px; }
.wsNode { display:flex; align-items:center; gap:6px; padding:6px 6px; border-radius:6px; cursor:pointer; font-weight:600; }
.wsNode:hover { background:var(--hover); }
.sessRow { display:grid; grid-template-columns:1fr auto; gap:8px; align-items:center; padding:5px 8px 5px 22px; border-radius:6px; cursor:pointer; }
.sessRow:hover { background:var(--hover); } .sessRow.active { background:var(--accent-soft); }
.sessRow .t { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:flex; align-items:center; gap:6px; }
.sessRow .m { color:var(--muted); font-size:12px; white-space:nowrap; }
.more { padding:5px 8px 5px 22px; color:var(--muted); font-size:13px; cursor:pointer; } .more:hover { color:var(--text); }
.groupHead { display:flex; align-items:center; gap:6px; padding:10px 6px 4px; color:var(--muted); font-size:13px; }
.sideFoot { border-top:1px solid var(--border); padding:6px 8px; display:flex; flex-direction:column; gap:2px; }
.footRow { display:flex; align-items:center; gap:8px; padding:7px 8px; border-radius:6px; cursor:pointer; color:var(--muted); font-size:14px; }
.footRow:hover { background:var(--hover); color:var(--text); }
.frame[data-sidebar-collapsed="true"] .brand .name, .frame[data-sidebar-collapsed="true"] .newSess span, .frame[data-sidebar-collapsed="true"] .wsHead span, .frame[data-sidebar-collapsed="true"] .tree, .frame[data-sidebar-collapsed="true"] .footRow span { display:none; }
.frame[data-sidebar-collapsed="true"] .newSess { justify-content:center; margin:4px 8px; padding:8px; }
.frame[data-sidebar-collapsed="true"] .footRow { justify-content:center; }
.badge { min-width:18px; height:18px; padding:0 5px; border-radius:9px; background:var(--accent); color:#fff; font-size:11px; font-weight:700; display:grid; place-items:center; }
.badge.mention { background:var(--danger); }
.dot { width:8px; height:8px; border-radius:50%; display:inline-block; flex:none; }
.dot.working { background:var(--warn); animation:pulse 1.2s infinite; }
@keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.4)} }
.tag { font-size:10px; padding:0 5px; border-radius:999px; background:var(--plug-soft); color:var(--plug); font-weight:600; white-space:nowrap; }

/* ---------- 中栏 [data-slot=conversation] ---------- */
.centerCol { background:var(--bg); position:relative; }
.convHead { display:flex; align-items:center; gap:10px; padding:10px 16px 0; min-height:46px; }
.convHead.headerHidden { display:none; }
.convHead .lineage { font-size:15px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }
.presetBadge { display:inline-flex; align-items:center; gap:6px; padding:3px 10px 3px 6px; border-radius:999px; border:1px solid var(--border); font-size:13px; color:var(--muted); }
.presetBadge .fish { width:14px; height:14px; }
.utilBtn { padding:4px 10px; border-radius:6px; font-size:13px; color:var(--muted); border:1px solid transparent; }
.utilBtn:hover { background:var(--hover); color:var(--text); }
.viewTabs { display:flex; gap:2px; padding:4px 16px 0; border-bottom:1px solid var(--border); }
.viewTabs .tab { padding:8px 12px; font-size:14px; color:var(--muted); border-bottom:2px solid transparent; }
.viewTabs .tab.tabActive { color:var(--text); border-bottom-color:var(--text); }

/* hero */
.hero { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:40px 20px 120px; }
.hero .fishBig { width:44px; height:44px; }
.hero h1 { margin:0; font-size:28px; font-weight:700; display:flex; align-items:center; gap:10px; }
.hero h1 .preview { font-size:11px; font-weight:600; padding:2px 8px; border-radius:999px; border:1px solid var(--border); color:var(--muted); letter-spacing:.04em; }
.hero .pills { display:flex; gap:8px; }
.pill { display:inline-flex; align-items:center; gap:6px; padding:5px 12px; border-radius:999px; border:1px solid var(--border); background:var(--panel); font-size:14px; cursor:pointer; white-space:nowrap; position:relative; }
.pill:hover { background:var(--hover); }
.pill .fish { width:14px; height:14px; }
.composerHero { width:min(760px, 100%); }

/* transcript */
.scroll { flex:1; overflow:auto; padding:18px 0 8px; }
.stream { max-width:820px; margin:0 auto; padding:0 24px; }
.userStack { display:flex; flex-direction:column; align-items:flex-end; margin:0 0 18px; gap:4px; }
.userStack .bubble { max-width:80%; padding:10px 14px; border-radius:14px; background:var(--user); border:1px solid var(--border); font-size:15px; }
.userStack .meta { font-size:12px; color:var(--muted); display:flex; gap:10px; }
.asst { margin:0 0 22px; font-size:15px; }
.asst p { margin:0 0 .6em; } .asst p:last-child { margin:0; }
.asst code { font:13px ui-monospace, monospace; background:var(--panel2); padding:0 4px; border-radius:4px; }
.asst pre { margin:.6em 0; padding:12px 14px; background:var(--panel2); border:1px solid var(--border); border-radius:8px; font:13px/1.5 ui-monospace, monospace; overflow:auto; }
.disclosure { display:flex; align-items:center; gap:8px; padding:6px 0; color:var(--muted); font-size:13px; cursor:pointer; }
.disclosure .car { display:inline-block; transition:transform .15s; } .disclosure.open .car { transform:rotate(90deg); }
.disclosure .ic { width:16px; text-align:center; }
.disclosure .lbl b { color:var(--text); font-weight:600; }
.disclosure .lbl .sum { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.discBody { display:none; margin:2px 0 8px 24px; padding:8px 10px; border-left:2px solid var(--border); color:var(--muted); font:13px/1.5 ui-monospace, monospace; white-space:pre-wrap; }
.disclosure.open + .discBody { display:block; }
.toolRow { display:flex; align-items:center; gap:8px; padding:6px 10px; margin:4px 0; border:1px solid var(--border); border-radius:8px; font-size:13px; cursor:pointer; background:var(--panel); }
.toolRow:hover { border-color:var(--accent); }
.toolRow .nm { font-family:ui-monospace, monospace; font-weight:600; } .toolRow .sub { color:var(--muted); flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.toolRow .st { font-size:11px; padding:1px 6px; border-radius:999px; border:1px solid var(--border); color:var(--muted); } .st.ok { color:var(--ok); border-color:var(--ok); } .st.run { color:var(--warn); border-color:var(--warn); }
.asstActions { display:flex; align-items:center; gap:2px; margin-top:8px; flex-wrap:wrap; font-size:12px; color:var(--muted); }
.asstActions button { padding:3px 8px; border-radius:6px; color:var(--muted); font-size:12px; display:inline-flex; gap:4px; align-items:center; }
.asstActions button:hover { background:var(--hover); color:var(--text); }
.asstActions .sep { width:1px; height:14px; background:var(--border); margin:0 6px; }
.asstActions .stat { padding:0 4px; }
.cursor { display:inline-block; width:7px; height:16px; background:var(--accent); vertical-align:-3px; margin-left:2px; animation:blink .9s steps(1) infinite; } @keyframes blink { 50%{opacity:0} }
.card { border:1px solid var(--border); border-radius:10px; background:var(--panel); margin:8px 0; max-width:640px; overflow:hidden; font-size:14px; }
.card.approval { border-color:var(--warn); } .card.question { border-color:var(--accent); } .card.peer { border-color:var(--plug); }
.cardHead { display:flex; align-items:center; gap:8px; padding:8px 12px; font-size:13px; } .cardHead .nm { font-weight:600; } .cardHead .sub { flex:1; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.cardBody { padding:0 12px 10px; } .cardBody pre { margin:6px 0; padding:8px 10px; background:var(--panel2); border-radius:6px; font:13px ui-monospace, monospace; }
.btnRow { display:flex; gap:6px; margin-top:8px; flex-wrap:wrap; }
.btn { padding:5px 12px; border-radius:7px; border:1px solid var(--border); background:var(--panel2); font-size:13px; white-space:nowrap; } .btn:hover { border-color:var(--accent); }
.btn.primary { background:var(--accent); border-color:var(--accent); color:#fff; } .btn.danger { color:var(--danger); } .btn.ghost { border-color:transparent; color:var(--muted); } .btn.chosen { background:var(--accent-soft); border-color:var(--accent); color:var(--accent); } .btn:disabled { opacity:.5; cursor:default; }
.card.resolved { opacity:.7; }
.typing { display:inline-flex; gap:3px; padding:6px 0; } .typing i { width:6px; height:6px; border-radius:50%; background:var(--muted); animation:bob 1s infinite; } .typing i:nth-child(2){animation-delay:.15s} .typing i:nth-child(3){animation-delay:.3s} @keyframes bob { 0%,100%{transform:translateY(0);opacity:.5} 50%{transform:translateY(-3px);opacity:1} }
.identityLine { display:flex; align-items:center; gap:6px; font-size:12px; color:var(--muted); margin-bottom:4px; }

/* composer */
.composerWrap { padding:8px 24px 6px; max-width:868px; margin:0 auto; width:100%; }
.composer { border:1px solid var(--border); border-radius:14px; background:var(--panel); transition:border-color .12s; }
.composer:focus-within { border-color:var(--accent); }
.composer textarea { width:100%; border:0; background:transparent; color:var(--text); padding:12px 14px 6px; resize:none; min-height:44px; max-height:220px; font:inherit; line-height:1.5; } .composer textarea:focus { outline:none; }
.attachRow { display:flex; gap:6px; padding:10px 12px 0; flex-wrap:wrap; }
.att { display:inline-flex; align-items:center; gap:6px; padding:3px 8px 3px 4px; border-radius:7px; border:1px solid var(--border); background:var(--panel2); font-size:13px; } .att .thumb { width:22px; height:22px; border-radius:4px; background:linear-gradient(135deg,#5b7cfa,#c792ea); }
.composerBar { display:flex; align-items:center; gap:6px; padding:6px 10px 10px; }
.cbtn { display:inline-flex; align-items:center; gap:6px; padding:5px 10px; border-radius:8px; font-size:13px; color:var(--muted); border:1px solid transparent; white-space:nowrap; }
.cbtn:hover { background:var(--hover); color:var(--text); }
.cbtn.plus { width:30px; height:30px; padding:0; justify-content:center; font-size:18px; }
.ring { width:16px; height:16px; border-radius:50%; background:conic-gradient(var(--accent) 4%, var(--border) 0); display:inline-block; }
.send { width:32px; height:32px; border-radius:50%; background:var(--accent); color:#fff; display:grid; place-items:center; font-size:15px; } .send:disabled { background:var(--panel2); color:var(--muted); cursor:default; } .send.stop { background:var(--danger); }
.dock { display:flex; gap:6px; align-items:center; flex-wrap:wrap; color:var(--muted); font-size:12px; padding:6px 8px 10px; }
.dock .s { display:inline-flex; gap:6px; } .dock .bar { width:1px; height:12px; background:var(--border); }
.queue { max-width:820px; margin:0 auto; padding:0 24px; display:flex; flex-direction:column; gap:4px; width:100%; }
.qItem { display:flex; align-items:center; gap:8px; padding:6px 10px; border:1px dashed var(--border); border-radius:8px; font-size:13px; color:var(--muted); background:var(--panel); } .qItem .txt { flex:1; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; } .qItem button { font-size:12px; color:var(--muted); }

/* ---------- 右栏 [data-slot=details] ---------- */
.detailsCol { background:var(--bg); border-left:1px solid var(--border); }
.detHead { padding:12px 14px; font-weight:600; font-size:14px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:8px; }
.detBody { flex:1; padding:14px; color:var(--muted); font-size:14px; overflow:auto; }
.detBody pre { font:12px/1.5 ui-monospace, monospace; background:var(--panel2); padding:10px; border-radius:8px; white-space:pre-wrap; color:var(--text); }

/* ---------- better-sidebar [data-dsh-better-sidebar]：overlay 层，右侧 IDE 页签 ---------- */
.better { position:absolute; top:0; right:0; bottom:0; width:380px; background:var(--side); border-left:1px solid var(--border); display:none; flex-direction:column; z-index:20; }
.frame.betterOpen .better { display:flex; }
.tabBar { display:flex; align-items:center; gap:2px; padding:6px 8px 0; border-bottom:1px solid var(--border); font-size:13px; }
.tabBar .tab { display:inline-flex; align-items:center; gap:6px; padding:6px 10px; border-radius:7px 7px 0 0; color:var(--muted); border-bottom:2px solid transparent; }
.tabBar .tab.tabActive { color:var(--text); border-bottom-color:var(--accent); }
.tabBar .tab .x { color:var(--muted); font-size:11px; margin-left:2px; } .tabBar .tab .x:hover { color:var(--text); }
.tabBar .plus { width:26px; height:26px; border-radius:6px; display:grid; place-items:center; color:var(--muted); } .tabBar .plus:hover { background:var(--hover); color:var(--text); }
.tabBody { flex:1; overflow:auto; min-height:0; display:flex; flex-direction:column; }
.filesPath { margin:8px; padding:6px 10px; border:1px solid var(--border); border-radius:6px; font-size:13px; color:var(--muted); }
.fileTree { padding:0 8px; font-size:13px; } .fileTree div { padding:4px 8px 4px 20px; color:var(--text); } .fileTree div.dir::before { content:"▸ "; color:var(--muted); }
.betterPlusMenu { position:absolute; right:8px; top:38px; z-index:30; }

/* DSH Bot 页签内容（插件产品面；今天是 iframe，原型直接内嵌以便标注） */
.botPane { display:flex; flex-direction:column; height:100%; font-size:14px; }
.botHead { display:flex; align-items:center; gap:6px; padding:8px 10px; border-bottom:1px solid var(--border); font-weight:600; }
.botHead .ic { width:26px; height:26px; border-radius:6px; display:grid; place-items:center; color:var(--muted); font-size:14px; } .botHead .ic:hover { background:var(--hover); color:var(--text); }
.botSub { display:flex; gap:2px; padding:6px 8px 0; border-bottom:1px solid var(--border); font-size:13px; }
.botSub button { padding:6px 10px; color:var(--muted); border-bottom:2px solid transparent; } .botSub button.on { color:var(--text); border-bottom-color:var(--accent); }
.roster { flex:1; overflow:auto; padding:6px; }
.secHead { display:flex; align-items:center; gap:6px; padding:8px 8px 3px; color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.06em; cursor:pointer; user-select:none; }
.secHead .caret { display:inline-block; transition:transform .15s; } .section.collapsed .caret { transform:rotate(-90deg); } .section.collapsed .rRow, .section.collapsed .subSess { display:none; }
.rRow { display:grid; grid-template-columns:32px 1fr auto; gap:8px; align-items:center; padding:6px 8px; border-radius:8px; cursor:pointer; position:relative; }
.rRow:hover { background:var(--hover); } .rRow.active { background:var(--accent-soft); }
.rRow.dragging { opacity:.4; } .rRow.dropTarget::before { content:""; position:absolute; left:8px; right:8px; top:-1px; height:2px; background:var(--accent); border-radius:2px; }
.rMain { min-width:0; } .rMain .n { font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:flex; gap:4px; align-items:center; } .rMain .p { color:var(--muted); font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.rMeta { display:flex; flex-direction:column; align-items:flex-end; gap:3px; font-size:11px; color:var(--muted); }
.rMenu { position:absolute; right:6px; top:50%; transform:translateY(-50%); display:none; width:26px; height:26px; border-radius:6px; place-items:center; color:var(--muted); } .rRow:hover .rMenu { display:grid; } .rRow:hover .rMeta { visibility:hidden; }
.subSess { padding:3px 8px 3px 48px; color:var(--muted); font-size:12px; cursor:pointer; border-radius:6px; display:flex; gap:6px; align-items:center; } .subSess:hover { background:var(--hover); color:var(--text); } .subSess.active { color:var(--accent); }
.newRow { display:flex; align-items:center; gap:6px; padding:6px 8px 6px 12px; color:var(--muted); cursor:pointer; border-radius:7px; font-size:13px; } .newRow:hover { background:var(--hover); color:var(--text); }
.av { width:32px; height:32px; border-radius:9px; display:grid; place-items:center; color:#fff; font-weight:700; font-size:13px; position:relative; flex:none; }
.av.sm { width:20px; height:20px; font-size:10px; border-radius:6px; } .av.xs { width:14px; height:14px; font-size:8px; border-radius:4px; } .av.lg { width:52px; height:52px; font-size:20px; border-radius:14px; }
.av.blob { border-radius:40% 60% 55% 45% / 55% 45% 55% 45%; } .av.hex { clip-path:polygon(25% 5%,75% 5%,100% 50%,75% 95%,25% 95%,0 50%); border-radius:0; } .av.pebble { border-radius:50% 50% 45% 55% / 60% 60% 40% 40%; }
.av .st { position:absolute; right:-2px; bottom:-2px; width:9px; height:9px; border-radius:50%; border:2px solid var(--side); background:var(--muted); } .av .st.working { background:var(--warn); animation:pulse 1.2s infinite; } .av .st.online { background:var(--ok); }
.mosaic { display:grid; grid-template-columns:1fr 1fr; gap:2px; padding:3px; background:var(--panel2); border-radius:9px; } .mosaic i { display:block; border-radius:3px; min-height:10px; } .mosaic.sm i { min-height:6px; } .mosaic.xs i { min-height:4px; }
.paneBody { flex:1; overflow:auto; padding:12px; font-size:14px; }
.paneBody h3 { font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:14px 0 6px; } .paneBody h3:first-child { margin-top:0; }
.fact { display:flex; gap:8px; align-items:flex-start; padding:5px 8px; border-radius:8px; font-size:13px; } .fact:hover { background:var(--hover); } .fact .t { flex:1; min-width:0; } .fact .src { font-size:10px; color:var(--muted); white-space:nowrap; margin-top:3px; } .fact .del { visibility:hidden; color:var(--muted); font-size:11px; } .fact:hover .del { visibility:visible; } .fact.faded { opacity:.55; } .fact.click { cursor:pointer; }

function renderSug() { let p = $('#sugPop'); if (!p) { p = document.createElement('div'); p.id = 'sugPop'; p.className = 'pop'; document.body.appendChild(p); } const rc = composer.getBoundingClientRect(); p.style.left = rc.left + 8 + 'px'; p.style.top = 'auto'; p.style.bottom = (innerHeight - rc.top + 6) + 'px'; p.innerHTML = sugItems.map((x, i) => `<button class="${i === sugSel ? 'sel' : ''}" onmousedown="event.preventDefault(); pickSug(${i})">${x.av ? av(x.av,'sm') : `<span style="width:20px;text-align:center">${x.label}</span>`}<span>${x.av ? esc(x.label) : ''}</span><span class="k">${esc(x.sub)}</span></button>`).join(''); }

function sugKey(e) { e.preventDefault(); if (e.key === 'ArrowDown') { sugSel = (sugSel+1) % sugItems.length; renderSug(); } else if (e.key === 'ArrowUp') { sugSel = (sugSel-1+sugItems.length) % sugItems.length; renderSug(); } else if (e.key === 'Enter' || e.key === 'Tab') pickSug(sugSel); else closeSug(); }
$('#emojiBtn').onclick = e => { e.stopPropagation(); if ($('#emojiPop')) { $('#emojiPop').remove(); return; } const p = document.createElement('div'); p.id = 'emojiPop'; p.className = 'pop emoji'; const rc = e.currentTarget.getBoundingClientRect(); p.style.left = rc.left + 'px'; p.style.bottom = (innerHeight - rc.top + 6) + 'px'; p.innerHTML = EMOJI.map(x => `<button onclick="insertText('${x}'); document.getElementById('emojiPop').remove()">${x}</button>`).join(''); document.body.appendChild(p); };

function demoNudge() { openSession('s-proof'); if (working) return; setWorking(true); const el = shell(); setTimeout(() => stream(el, '顺便：你这几天早上都让我校当天的稿子，要不我每个工作日 9 点自己跑一遍，有需要你决定的再叫你？', () => { el.querySelector('.split').insertAdjacentHTML('beforeend', `<div class="card question" data-plug="主动提议（Initiative）→ 一键成例程"><div class="cardBody" style="padding-top:10px"><div class="btnRow"><button class="btn primary" onclick="this.closest('.card').classList.add('resolved'); this.parentNode.innerHTML='<span style=color:var(--ok);font-size:12px>✓ 已启用「稿件晨检」</span>'; routines.proof[0].on=true; routines.proof[0].last='刚刚启用'; toast('⏰','例程已启用','0 9 * * 1-5 · 被拒一次后不再提')">好，设成例程</button><button class="btn ghost" onclick="this.closest('.card').classList.add('resolved'); this.parentNode.innerHTML='<span class=muted style=font-size:12px>已拒绝，不再提此建议</span>'">不用</button></div></div></div>`); setWorking(false); }), 500); }
function demoGroup() { openRoom('g-edit'); const g = groupById('g-edit'); const order = ['poet','proof','dsh-bot']; const lines = { poet:'留"她"可以，但放句尾："十字以内，她。"', proof:null, 'dsh-bot':'定了：开头三句砍短，第二句事实改"一周后"，第三句留"她"。我去改稿。' }; const state = {}; order.forEach(x => state[x] = 'pending'); g.round = 3; g.status = 'working'; let i = 0; const step = () => { if (i >= order.length) { g.status = 'idle'; g.preview = '第 3 轮结束 · 已定方案'; renderRoomMembers(g, state); return; } const id = order[i]; state[id] = 'speaking'; renderRoomMembers(g, state); if (!lines[id]) { rooms['g-edit'].push({ who:id, round:3, pass:true }); state[id] = 'pass'; renderRoomLog('g-edit'); i++; setTimeout(step, 800); return; } setTimeout(() => { rooms['g-edit'].push({ who:id, round:3, md:lines[id] }); renderRoomLog('g-edit'); state[id] = 'spoke'; i++; setTimeout(step, 600); }, 900); }; setTimeout(step, 300); }

/* ===================== 开关 / 快捷键 / toast / 启动 ===================== */
function toggleNative() { const on = document.body.classList.toggle('native'); $('#nativeBtn').textContent = on ? '恢复插件' : '只看官方'; if (on) { betterTab = 'files'; $$('#tabBar .tab').forEach(t => t.classList.toggle('tabActive', t.dataset.tab === 'files')); renderBetter(); } else openBetter('bot'); toast(on ? '🧩' : '🤖', on ? '现在是没装插件的 DSH' : '插件已恢复', on ? '对话/轨迹/审批/工具详情/Files 都还在，它们是官方的' : '虚线框里的是插件贡献'); }
function toggleHl() { const on = document.body.classList.toggle('hl'); $('#hlBtn').textContent = on ? '隐藏高亮' : '显示高亮'; }
function toggleTheme() { const h = document.documentElement; h.dataset.theme = h.dataset.theme === 'dark' ? 'light' : 'dark'; }
function toast(ic, title, body, onClick) { const el = document.createElement('div'); el.className = 'toast'; el.innerHTML = `<span class="av" style="background:var(--panel2);color:var(--text);font-size:15px;width:30px;height:30px">${ic}</span><div class="t"><b>${esc(title)}</b><span>${esc(body)}</span></div><button class="muted">✕</button>`; el.onclick = e => { if (e.target.tagName !== 'BUTTON' && onClick) onClick(); el.remove(); }; $('#toasts').appendChild(el); setTimeout(() => el.remove(), 6500); }
document.addEventListener('keydown', e => { const mod = e.metaKey || e.ctrlKey; if (mod && e.key.toLowerCase() === 'b') { e.preventDefault(); toggleSidebar(); return; } if (mod && e.key.toLowerCase() === 'j') { e.preventDefault(); toggleBetter(); return; } if (e.key === 'Escape') { if ($('#modal').classList.contains('show')) closeAll(); else if ($('.pop')) closePops(); else if (working) stop(); } });
renderTree(); openSession('s-t18'); openBetter('bot');
setTimeout(() => toast('👋','这版壳按 real/ 一手截图与 DOM 还原','官方：deepseek HARNESS 左栏 / 对话·轨迹 / 「探索未至之境」hero / +命令·Workspace Write·模型·统计 dock / Files 页签。插件只在虚线框里：footer.action 入口、身份 chip、预设标、input.left @🙂、chat.node 身份行、📌记住、DSH Bot 页签内的名册/记忆/例程/房间。点「只看官方」对比。'), 600);
