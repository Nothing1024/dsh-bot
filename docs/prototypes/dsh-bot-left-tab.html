<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DSH Bot · 左栏选项卡完整原型</title>
<!--
  锁定 A：会话 | Bot 占 sidebar.workspaces。
  会话 tab = 官方工作区树 + 官方对话/轨迹。
  Bot tab = grok-bot 人设名册 + 人设对话台。
  1:1 绑定官方 session；小组是插件房间。
-->
<style>
:root[data-theme="dark"] { color-scheme:dark; --bg:#151517; --side:#151517; --panel:#1c1c1f; --panel2:#232326; --border:#2a2a2e; --text:#ececef; --muted:#8b8b93; --accent:#5b7cfa; --accent-soft:rgba(91,124,250,.16); --danger:#e5484d; --ok:#3dd68c; --warn:#f5a524; --hover:#222225; --user:#2c4a7c; --asst:#222830; --shadow:0 8px 30px rgba(0,0,0,.5); --plug:#f5a524; --card:#1a1f28; }
:root[data-theme="light"] { color-scheme:light; --bg:#fff; --side:#f9fafb; --panel:#fff; --panel2:#f3f4f6; --border:#e5e7eb; --text:#111318; --muted:#6b7280; --accent:#3b5bdb; --accent-soft:rgba(59,91,219,.12); --danger:#d64550; --ok:#2f9e5b; --warn:#b7791f; --hover:#f1f3f5; --user:#2c4a7c; --asst:#eef1f5; --shadow:0 8px 30px rgba(16,24,40,.14); --plug:#b7791f; --card:#f6f7f9; }
* { box-sizing:border-box; }
html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font:16px/1.5 -apple-system, system-ui, "PingFang SC", "Hiragino Sans GB", sans-serif; }
body { padding-bottom:0; }
button { font:inherit; color:inherit; background:none; border:0; cursor:pointer; }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
input, textarea { font:inherit; color:inherit; }
.hidden { display:none !important; } .sp { flex:1; } .muted { color:var(--muted); }
kbd { font:11px ui-monospace, monospace; padding:1px 5px; border:1px solid var(--border); border-bottom-width:2px; border-radius:4px; color:var(--muted); }

.frame { display:grid; grid-template-columns:280px 1fr 0; height:calc(100% - 78px); }
.frame.det { grid-template-columns:280px 1fr 300px; }
.col { min-width:0; overflow:hidden; display:flex; flex-direction:column; }
.sidebarCol { background:var(--side); border-right:1px solid var(--border); }
.brand { display:flex; align-items:center; gap:8px; padding:14px 14px 10px; font-weight:700; }
.brand .fish { width:20px; height:20px; } .brand .name small { font-weight:600; font-size:11px; letter-spacing:.12em; margin-left:4px; color:var(--muted); }
.newSess { display:flex; align-items:center; gap:8px; margin:2px 10px 8px; padding:8px 10px; border-radius:8px; border:1px solid var(--border); background:var(--panel); font-size:14px; }
.newSess:hover { background:var(--hover); }
#sideBody { flex:1; min-height:0; display:flex; flex-direction:column; }
.seg { display:flex; margin:0 10px 8px; padding:3px; border:1px solid var(--border); border-radius:9px; background:var(--panel2); }
.seg button { flex:1; padding:6px 0; border-radius:6px; font-size:13px; color:var(--muted); }
.seg button.on { background:var(--panel); color:var(--text); font-weight:600; }
.wsHead { display:flex; align-items:center; gap:4px; padding:8px 12px 4px; color:var(--muted); font-size:13px; }
.search { margin:0 10px 6px; }
.search input { width:100%; padding:6px 9px; border:1px solid var(--border); border-radius:8px; background:var(--panel2); color:var(--text); font-size:13px; }
.tree { flex:1; overflow:auto; padding:0 8px 8px; font-size:14px; }
.wsNode { display:flex; align-items:center; gap:6px; padding:6px; border-radius:6px; font-weight:600; }
.sessRow { display:grid; grid-template-columns:1fr auto; gap:8px; align-items:center; padding:5px 8px 5px 22px; border-radius:6px; cursor:pointer; }
.sessRow:hover { background:var(--hover); } .sessRow.active { background:var(--accent-soft); }
.sessRow .t { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.sessRow .m { color:var(--muted); font-size:12px; }
.more { padding:5px 8px 5px 22px; color:var(--muted); font-size:13px; }
.groupHead { display:flex; align-items:center; justify-content:space-between; padding:10px 6px 4px; color:var(--muted); font-size:12px; letter-spacing:.04em; }
.sideFoot { border-top:1px solid var(--border); padding:6px 8px; }
.footRow { display:flex; align-items:center; gap:8px; padding:7px 8px; border-radius:6px; color:var(--muted); font-size:14px; }
.footRow:hover { background:var(--hover); color:var(--text); }

.roster { flex:1; min-height:0; display:flex; flex-direction:column; }
.rosterHead { display:flex; align-items:center; justify-content:space-between; gap:8px; padding:4px 10px 8px; font-size:13px; font-weight:600; }
.rosterHeadActions { display:flex; flex-wrap:wrap; gap:6px; justify-content:flex-end; }
.newBot { padding:0 10px; line-height:24px; border:1px solid var(--border); border-radius:999px; font-size:12px; }
.newBot:hover { background:var(--hover); }
.rosterBody { flex:1; min-height:0; overflow:auto; padding:0 8px 8px; }
.rosterSection { margin-bottom:10px; }
.rosterSectionHead { display:block; width:100%; text-align:left; padding:4px 6px; color:var(--muted); font-size:12px; }
.rosterList { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:2px; }
.rosterRow { display:grid; grid-template-columns:36px minmax(0,1fr) auto; gap:8px; align-items:center; padding:8px; border-radius:8px; cursor:pointer; position:relative; }
.rosterRow:hover { background:var(--hover); } .rosterRow.isSelected { background:rgba(91,124,250,.16); }
.rosterRow.isMuted { opacity:.72; }
.rosterMain { min-width:0; display:flex; flex-direction:column; gap:2px; }
.rosterName { font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-size:14px; }
.rosterPreview { color:var(--muted); font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.rosterMeta { display:flex; flex-direction:column; align-items:flex-end; gap:4px; font-size:11px; color:var(--muted); }
.unreadBadge { min-width:18px; height:18px; padding:0 5px; border-radius:9px; background:var(--accent); color:#fff; font-size:11px; font-weight:700; display:grid; place-items:center; }
.unreadBadge.mention { background:var(--danger); }
.sessionCount { min-width:16px; height:16px; padding:0 5px; border-radius:999px; background:#2a3340; color:var(--muted); font-size:10px; line-height:16px; text-align:center; }
.rowMenuBtn { width:24px; height:24px; border-radius:6px; color:var(--muted); display:none; }
.rosterRow:hover .rowMenuBtn { display:grid; place-items:center; }
.rosterRow:hover .rosterMetaNums { display:none; }
.rowMenu { position:absolute; right:8px; top:calc(100% - 4px); z-index:6; min-width:140px; background:var(--panel); border:1px solid var(--border); border-radius:10px; box-shadow:var(--shadow); padding:6px; }
.rowMenu button { display:block; width:100%; text-align:left; padding:7px 10px; border-radius:6px; font-size:13px; }
.rowMenu button:hover { background:var(--hover); }
.rowMenu button.danger { color:var(--danger); }
.rosterPreviewCard { position:absolute; left:calc(100% + 8px); top:0; z-index:8; width:220px; padding:8px 10px; background:var(--panel); border:1px solid var(--border); border-radius:8px; box-shadow:var(--shadow); font-size:12px; color:var(--muted); pointer-events:none; }
.rosterPreviewCard div { margin:2px 0; }
.rosterSessions { margin:0 8px 8px 36px; padding:4px 0 0; border-left:1px solid var(--border); }
.rosterSession { display:flex; align-items:center; justify-content:space-between; gap:8px; width:100%; padding:6px 8px; border-radius:6px; font-size:13px; color:var(--muted); }
.rosterSession:hover { background:var(--hover); color:var(--text); }
.rosterSession.isSelected { color:var(--accent); }
.rosterSessionNew { width:100%; text-align:left; padding:6px 8px; border-radius:6px; font-size:13px; color:var(--muted); }
.rosterSessionNew:hover { background:var(--hover); color:var(--text); }
.rosterHidden { margin-top:12px; border-top:1px solid var(--border); padding-top:8px; }
.rosterHiddenHead { color:var(--muted); font-size:13px; padding:4px 6px; }
.face { width:32px; height:32px; border-radius:50%; background:var(--c,#4f7cf0); position:relative; flex:none; box-shadow:0 1px 1px rgba(0,0,0,.22); }
.face.sm { width:22px; height:22px; }
.face .e { position:absolute; top:38%; width:22%; height:28%; background:#151517; border-radius:40%; }
.face .e.l { left:22%; } .face .e.r { right:22%; }
.face .dot { position:absolute; right:-1px; bottom:-1px; width:8px; height:8px; border-radius:50%; border:2px solid var(--side); background:var(--muted); }
.face .dot.working { background:var(--warn); } .face .dot.online { background:var(--ok); }
.mosaic { width:32px; height:32px; display:grid; gap:1px; border-radius:10px; overflow:hidden; background:var(--border); flex:none; }
.mosaic.n2 { grid-template-columns:1fr 1fr; }
.mosaic.n3, .mosaic.n4 { grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr; }
.mosaic .tile { display:grid; place-items:center; font-size:9px; font-weight:700; color:#fff; background:var(--c); }

.chips { display:flex; gap:6px; padding:0 8px 8px; overflow:auto; }
.chip { opacity:.5; border-radius:10px; } .chip.on { opacity:1; outline:2px solid var(--accent); }
.back { display:flex; align-items:center; gap:8px; padding:4px 8px 8px; font-size:14px; }
.back:hover { color:var(--accent); }
.homeCard { margin:0 8px 8px; padding:10px; border:1px solid var(--border); border-radius:10px; background:var(--panel); display:flex; gap:10px; align-items:center; }
.homeActs { display:flex; gap:4px; padding:0 8px 8px; }
.homeActs button { flex:1; padding:6px 0; border:1px solid var(--border); border-radius:8px; font-size:12px; color:var(--muted); }
.homeActs button.on { border-color:var(--accent); color:var(--text); background:var(--accent-soft); }

.centerCol { background:var(--bg); position:relative; }
.convHead { display:flex; align-items:center; gap:10px; padding:10px 16px 0; min-height:46px; }
.convHead .lineage { font-size:15px; font-weight:600; }
.identity { display:inline-flex; align-items:center; gap:8px; padding:2px 8px 2px 2px; border-radius:999px; }
.identity.btn:hover { background:var(--hover); }
.workingBadge { font-size:11px; color:var(--ok); border:1px solid rgba(61,214,140,.33); border-radius:999px; padding:1px 8px; }
.headActions { margin-left:auto; display:flex; align-items:center; gap:6px; position:relative; flex-wrap:wrap; justify-content:flex-end; }
.memoryPill, .sessionSwitchBtn, .retry { padding:4px 10px; border:1px solid var(--border); border-radius:999px; font-size:12px; color:var(--muted); }
.memoryPill:hover, .sessionSwitchBtn:hover, .retry:hover { background:var(--hover); color:var(--text); }
.sessionSwitch { position:relative; }
.sessionSwitchBtn { display:inline-flex; align-items:center; gap:6px; max-width:220px; }
.sessionSwitchLabel { color:var(--muted); }
.sessionSwitchTitle { color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:140px; }
.sessionSwitchMenu, .floatPanel { position:absolute; top:calc(100% + 6px); right:0; min-width:260px; max-width:320px; max-height:70vh; overflow:auto; background:var(--panel); border:1px solid var(--border); border-radius:10px; box-shadow:var(--shadow); padding:10px; z-index:7; }
.sessionOption { display:flex; justify-content:space-between; gap:8px; width:100%; padding:8px; border-radius:8px; font-size:13px; }
.sessionOption:hover, .sessionOption.isSelected { background:var(--accent-soft); }
.viewTabs { display:flex; gap:2px; padding:4px 16px 0; border-bottom:1px solid var(--border); }
.viewTabs .tab { padding:8px 12px; font-size:14px; color:var(--muted); border-bottom:2px solid transparent; }
.viewTabs .tab.tabActive { color:var(--text); border-bottom-color:var(--text); }
.scroll { flex:1; overflow:auto; padding:18px 0 8px; }
.stream { max-width:820px; margin:0 auto; padding:0 24px; }
.userStack { display:flex; flex-direction:column; align-items:flex-end; margin:0 0 18px; }
.userStack .bubble { max-width:80%; padding:10px 14px; border-radius:14px 14px 4px 14px; background:var(--user); color:#fff; font-size:15px; }
.asst { margin:0 0 22px; font-size:15px; }
.asst .bubble { display:inline-block; max-width:92%; padding:10px 14px; border-radius:14px 14px 14px 4px; background:var(--asst); }
.asst .bubble p { margin:0 0 8px; } .asst .bubble p:last-child { margin:0; }
.disc { margin:0 0 12px; padding:8px 10px; border:1px solid var(--border); border-radius:8px; color:var(--muted); font-size:13px; }
.authorName { font-size:11px; color:var(--muted); margin:0 0 4px; }
.members { display:flex; gap:6px; padding:8px 24px 0; flex-wrap:wrap; }
.memberChip { display:inline-flex; align-items:center; gap:6px; padding:2px 8px 2px 2px; border:1px solid var(--border); border-radius:999px; font-size:12px; }
.card { margin:8px 0; padding:8px 10px; border:1px solid var(--border); border-radius:10px; background:var(--card); font-size:13px; }
.card .cardHead { color:var(--muted); font-size:12px; margin-bottom:6px; }
.card.think { color:var(--muted); }
.card.tool pre, .card pre { margin:0; white-space:pre-wrap; font:12px/1.45 ui-monospace, monospace; color:var(--text); }
.card.approval { border-color:rgba(245,165,36,.45); }
.card.question { border-color:rgba(91,124,250,.4); }
.card.peer { border-style:dashed; border-color:var(--plug); }
.card .btnRow { display:flex; gap:8px; margin-top:8px; }
.card .btnRow button { padding:4px 10px; border:1px solid var(--border); border-radius:8px; font-size:12px; }
.card .btnRow .ok { background:var(--accent); color:#fff; border-color:transparent; }
.card.resolved { opacity:.75; }
.quote { margin:0 0 8px; padding:6px 10px; border-left:2px solid var(--accent); color:var(--muted); font-size:13px; }
.wakeTag { display:inline-block; margin-bottom:6px; padding:1px 8px; border-radius:999px; border:1px solid rgba(245,165,36,.4); color:var(--warn); font-size:11px; }
code { font:12.5px/1.4 ui-monospace, monospace; background:var(--panel2); padding:1px 5px; border-radius:4px; }
pre.code { margin:8px 0 0; padding:10px; background:#111318; color:#d7dde7; border-radius:8px; overflow:auto; font:12px/1.45 ui-monospace, monospace; }
:root[data-theme="light"] pre.code { background:#1c2128; }
.composerWrap { padding:8px 24px 8px; max-width:868px; margin:0 auto; width:100%; }
.composer { border:1px solid var(--border); border-radius:14px; background:var(--panel); padding:10px 14px; }
.composer textarea { width:100%; min-height:44px; resize:none; border:0; background:transparent; color:var(--text); }
.composerBar { display:flex; align-items:center; gap:8px; margin-top:8px; color:var(--muted); font-size:13px; }
.send { margin-left:auto; padding:4px 12px; border-radius:8px; background:var(--accent); color:#fff; }
.dock { max-width:868px; margin:0 auto 12px; padding:0 24px; color:var(--muted); font-size:12px; }
.hero, .emptyChat { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; }
.hero h1 { margin:0; font-size:28px; font-weight:650; }
.hero .preview { font-size:12px; color:var(--muted); border:1px solid var(--border); border-radius:999px; padding:2px 8px; }
.pills { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; }
.pill { padding:6px 12px; border:1px solid var(--border); border-radius:999px; font-size:13px; color:var(--muted); }
.emptyChat { color:var(--muted); text-align:center; }
.formPane { flex:1; overflow:auto; padding:24px; max-width:560px; }
.formPane h2 { margin:0 0 16px; font-size:18px; }
.formPane label { display:block; margin:0 0 12px; font-size:13px; color:var(--muted); }
.formPane input, .formPane textarea, .formPane select { width:100%; margin-top:4px; padding:8px 10px; border:1px solid var(--border); border-radius:8px; background:var(--panel2); color:var(--text); font:inherit; }
.formPane textarea { min-height:88px; resize:vertical; }
.formActions { display:flex; gap:8px; margin-top:16px; }
.formActions button { padding:6px 12px; border:1px solid var(--border); border-radius:8px; }
.formActions .primary { background:var(--accent); color:#fff; border-color:transparent; }
.checks { display:flex; flex-wrap:wrap; gap:8px; margin-top:6px; }
.checks label { margin:0; display:inline-flex; align-items:center; gap:6px; }
.graphCard { position:absolute; inset:24px; margin:auto; width:min(520px, calc(100% - 48px)); height:min(420px, calc(100% - 48px)); background:var(--panel); border:1px solid var(--border); border-radius:12px; box-shadow:var(--shadow); padding:12px; z-index:8; }
.graphCard h3 { margin:0 0 8px; font-size:14px; display:flex; align-items:center; }
.detailsCol { background:var(--panel); border-left:1px solid var(--border); }
.detHead { display:flex; align-items:center; gap:8px; padding:12px 14px; border-bottom:1px solid var(--border); font-weight:600; }
.detTabs { display:flex; gap:4px; padding:8px 12px; }
.detTabs button { padding:4px 10px; border-radius:999px; font-size:13px; color:var(--muted); }
.detTabs button.on { background:var(--accent-soft); color:var(--text); }
.detBody { padding:12px 16px; font-size:14px; color:var(--muted); }
.detBody h4 { margin:0 0 8px; color:var(--text); font-size:14px; }
.mem { padding:8px 0; border-bottom:1px solid var(--border); }
.mem .src { font-size:11px; }
.roomNote { margin:8px 24px 0; max-width:820px; padding:7px 10px; border:1px dashed var(--plug); border-radius:8px; font-size:12px; color:var(--muted); }
.toast { position:fixed; left:50%; bottom:78px; transform:translateX(-50%); z-index:95; padding:8px 12px; border-radius:8px; background:var(--panel); border:1px solid var(--border); font-size:13px; box-shadow:var(--shadow); }
.confirmMask { position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:100; display:grid; place-items:center; }
.confirmBox { width:min(360px, calc(100% - 32px)); background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:16px; box-shadow:var(--shadow); }
.confirmBox p { margin:0 0 8px; }
.scrim { position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:110; }
.palette { position:fixed; left:50%; top:16vh; transform:translateX(-50%); z-index:111; width:min(560px, calc(100% - 32px)); background:var(--panel); border:1px solid var(--border); border-radius:12px; box-shadow:var(--shadow); overflow:hidden; }
.palette input { width:100%; padding:12px 14px; border:0; border-bottom:1px solid var(--border); background:transparent; color:var(--text); }
.palList { max-height:46vh; overflow:auto; padding:6px; }
.palItem { display:flex; justify-content:space-between; gap:10px; width:100%; padding:8px 10px; border-radius:8px; font-size:14px; text-align:left; }
.palItem.sel, .palItem:hover { background:var(--accent-soft); }
.palFoot { display:flex; gap:10px; padding:8px 12px; border-top:1px solid var(--border); color:var(--muted); font-size:12px; }
.dockWrap { position:fixed; left:0; right:0; bottom:0; z-index:90; background:#111; color:#fff; }
.caption { display:flex; align-items:center; gap:10px; padding:6px 12px 2px; font-size:12px; color:#9aa3ad; border:0; border-radius:0; background:transparent; }
.caption b { color:var(--text); font-weight:600; }
.demoBar { display:flex; align-items:center; gap:6px; padding:6px 10px 8px; background:transparent; color:#fff; font-size:12px; overflow:auto; }
.demoBar .lbl { color:#9aa3ad; margin:0 4px; }
.demoBar button { padding:4px 8px; border-radius:999px; background:#2a2a2e; white-space:nowrap; }
.demoBar button.on { background:var(--accent); color:#fff; }
:root[data-theme="light"] .demoBar { background:#1c2128; }
</style>
</head>
<body>
<svg style="display:none"><symbol id="fish" viewBox="0 0 24 24"><path d="M2 12c3.5-5 8-7 13-6l3-3v6l-3 3 3 3v6l-3-3c-5 1-9.5-1-13-6z" fill="currentColor"/><circle cx="8.5" cy="12" r="1.2" fill="#151517"/></symbol></svg>
<div class="frame" id="frame">
  <aside class="col sidebarCol" data-slot="sidebar">
    <div class="brand"><svg class="fish"><use href="#fish"/></svg><span class="name">deepseek<small>HARNESS</small></span></div>
    <button class="newSess" id="newSess" type="button">+ <span id="newSessLabel">新会话</span></button>
    <div id="sideBody"></div>
    <div class="sideFoot">
      <button class="footRow" type="button" data-act="theme">◐ 主题</button>
      <button class="footRow" type="button" data-act="palette">⌘K 跳转</button>
      <div class="footRow">设置</div>
    </div>
  </aside>
  <main class="col centerCol" id="center" data-slot="conversation"></main>
  <aside class="col detailsCol hidden" id="details" data-slot="details"></aside>
</div>
<div class="dockWrap">
<div class="caption" id="caption"></div>
<div class="demoBar" id="demoBar"></div>
</div>
<div id="overlay"></div>
<script>

const COLORS = { blue:"#4f7cf0", red:"#d95a63", purple:"#9b6ee8", teal:"#2fa3a8", gray:"#6b7280", orange:"#e0894a" };
const NAMES = { A:"人设名册", B:"钻入人设", C:"双层常驻" };
const SECTIONS = [
  { id:"pinned", name:"置顶" },
  { id:"work", name:"工作" },
  { id:"life", name:"生活" }

  if (variant === "A") details = null;
  render();
}

function openForm(next) {

function openDetails(kind) {

function officialTree() {
  const all = botSessions.filter(function (s) { return !s.hidden; }).concat(official);
  const q = query.trim().toLowerCase();
  const match = function (s) { return !q || s.title.toLowerCase().indexOf(q) >= 0; };
  const plugin = all.filter(function (s) { return s.bot && match(s); });
  const rest = all.filter(function (s) { return !s.bot && match(s); });
  const shown = treeMore ? plugin : plugin.slice(0, 3);
  return '<div class="wsHead"><span>工作区</span><span class="sp"></span><span>搜索</span></div>' +
    '<div class="search"><input id="sideSearch" placeholder="搜索会话…" value="' + esc(query) + '"></div><div class="tree"><div class="wsNode">plugin</div>' +
    shown.map(sessRow).join("") +
    (plugin.length > 3 ? '<button type="button" class="more" data-act="tree-more">' + (treeMore ? "收起" : ("展开其余 " + (plugin.length - 3) + " 个会话")) + "</button>" : "") +
    '<div class="groupHead">未分组</div>' + rest.map(sessRow).join("") + "</div>";
}

function sessRow(s) {
  return '<div class="sessRow ' + (s.id===current?"active":"") + '" data-sess="' + s.id + '"><span class="t">' +

}

function rosterItems() {
  const q = query.trim().toLowerCase();
  const items = bots.filter(function (b) { return !b.hidden; }).map(function (b) {
    return { kind:"bot", id:b.id, section: b.pinned ? "pinned" : b.section, updatedAt:b.updatedAt, name:b.name, preview:b.preview };
  }).concat(groups.map(function (g) {
    return { kind:"group", id:g.id, section:g.section, updatedAt:g.updatedAt, name:g.name, preview:g.preview };
  }));
  return items.filter(function (it) {
    if (!q) return true;
    return (it.name + " " + (it.preview || "")).toLowerCase().indexOf(q) >= 0;
  }).sort(function (a, b) { return b.updatedAt - a.updatedAt; });
}

function graphHtml() {
  const vis = bots.filter(function (b) { return !b.hidden; });
  const nodes = vis.map(function (b, i) {
    const a = (i / vis.length) * Math.PI * 2 - Math.PI / 2;
    return { id:b.id, name:b.name, color:COLORS[b.color], x:210 + Math.cos(a) * 140, y:160 + Math.sin(a) * 110 };
  });
  const byId = {};
  nodes.forEach(function (n) { byId[n.id] = n; });
  const lines = [];
  groups.forEach(function (g) {
    for (let i = 0; i < g.members.length; i += 1) {
      for (let j = i + 1; j < g.members.length; j += 1) {
        const a = byId[g.members[i]];
        const b = byId[g.members[j]];
        if (a && b) lines.push('<line x1="' + a.x + '" y1="' + a.y + '" x2="' + b.x + '" y2="' + b.y + '" stroke="#6b8cff66" stroke-dasharray="4 3"/>');
      }
    }
  });
  const dots = nodes.map(function (n) {
    return '<g data-bot="' + n.id + '" style="cursor:pointer"><circle cx="' + n.x + '" cy="' + n.y + '" r="16" fill="' + n.color +
      '"/><text x="' + n.x + '" y="' + (n.y + 30) + '" text-anchor="middle" fill="currentColor" font-size="12">' + esc(n.name) + "</text></g>";
  }).join("");
  const legend = groups.map(function (g) {
    return esc(g.name) + "：" + g.members.map(function (id) { return botOf(id).name; }).join(" · ");
  }).join("；");
  return '<div class="graphCard"><h3>关系图<span class="sp"></span><button type="button" data-act="close-graph">关闭</button></h3>' +
    '<svg viewBox="0 0 420 340" width="100%" height="320">' + lines.join("") + dots + "</svg>" +
    '<p class="muted">虚线 = 同组。' + legend + "。点节点回到该人设。</p></div>";
}

    '<button type="button" class="memoryPill" data-det="routine">例程 ' + (routines[b.id] || []).length + "</button>" +
    '<button type="button" class="memoryPill" data-det="peers">同事 ' + (peers[b.id] || []).length + "</button>" +

    (empty

}
function officialCenter() {
  const s = sessOf(current);
  const b = s && s.bot ? botOf(s.bot) : null;
  if (current == null) {
    return '<div class="hero"><svg class="fish" width="36" height="36"><use href="#fish"/></svg>' +
      '<h1>探索未至之境 <span class="preview">预览版</span></h1>' +
      '<div class="pills"><span class="pill">plugin</span><span class="pill">DSH Bot</span><span class="pill">grok-4.6</span></div>' +

          if (p.k === "think") return "THINK";

        }).join(" · ");

    : (b ? '<div class="disc">上下文注入 · @deepseek-ai/dsh-system-prompt · preset dsh-bot--' + b.id + "</div>" : "") +
      turnsHtml(s.id);

    '<div class="viewTabs"><button type="button" class="tab ' + (viewTab==="chat"?"tabActive":"") + '" data-view="chat">对话</button>' +

    '<section class="scroll"><div class="stream">' + stream + "</div></section>" +

}
function renderCenter() {
  const active = document.activeElement;

  $("#center").innerHTML = sideMode === "bot" ? grokCenter() : officialCenter();

}
function renderDetails() {

  } else if (details === "routine") {
    body = "<h4>例程</h4><p>" + (b.routine ? esc(b.routine) : "这个人设还没有例程。") + "</p>";

    '</span><span class="sp"></span><button type="button" data-act="close-det">x</button></div>' +
    '<div class="detTabs">' +
    '<button type="button" class="' + (details==="persona"?"on":"") + '" data-det="persona">人设</button>' +
    '<button type="button" class="' + (details==="memory"?"on":"") + '" data-det="memory">记忆</button>' +
    '<button type="button" class="' + (details==="routine"?"on":"") + '" data-det="routine">例程</button></div>' +
    '<div class="detBody">' + body + '<p class="muted" style="margin-top:16px">B：人设首页三个按钮打开右栏设置，对话仍在中栏人设台。</p></div>';
}
function renderChrome() {
  let label = "新会话";
  if (sideMode === "bot") {
    if (!selectedId) label = "新建人设";
    else if (selectedKind === "group") label = "新开房间";
    else label = "新开对话";
  }
  $("#newSessLabel").textContent = label;
  const cur = SCENES.find(function (s) { return s.id === scene; }) || SCENES[3];
  $("#caption").innerHTML = "<b>" + esc(cur.label) + "</b><span>" + esc(cur.caption) + "</span><span class=\"sp\"></span><span>A · " + NAMES[variant] + (debug ? " · debug" : "") + "</span>";
  $("#demoBar").innerHTML = '<span class="lbl">演示</span>' + SCENES.map(function (s) {
    return '<button type="button" class="' + (scene===s.id?"on":"") + '" data-scene="' + s.id + '">' + s.key + " " + s.label + "</button>";
  }).join("") +
    '<span class="lbl">|</span>' +
    '<button type="button" data-act="theme">◐</button>' +
    '<button type="button" data-act="palette">⌘K</button>' +
    '<button type="button" data-act="peer-demo">传话</button>' +
    '<span class="lbl">备选</span>' +
    '<button type="button" class="' + (variant==="B"?"on":"") + '" data-var="B">B</button>' +
    '<button type="button" class="' + (variant==="C"?"on":"") + '" data-var="C">C</button>' +
    '<button type="button" class="' + (variant==="A"?"on":"") + '" data-var="A">A</button>';
}
function renderToast() {
  let el = document.getElementById("toast");
  if (!toast) { if (el) el.remove(); return; }
  if (!el) { el = document.createElement("div"); el.id = "toast"; el.className = "toast"; document.body.appendChild(el); }
  el.textContent = toast;
}
function renderConfirm() {
  let el = document.getElementById("confirm");
  if (!confirmDel) { if (el) el.remove(); return; }
  if (!el) { el = document.createElement("div"); el.id = "confirm"; el.className = "confirmMask"; document.body.appendChild(el); }
  const group = confirmDel.kind === "group";
  const name = group ? groupOf(confirmDel.id).name : botOf(confirmDel.id).name;
  el.innerHTML = '<div class="confirmBox"><p>删除「' + esc(name) + '」？</p><p class="muted">' +
    (group ? "会删掉小组和房间记录，成员人设和他们的私聊都会保留。" : "会删掉这个人设和它绑定的对话。") +
    '</p><div class="formActions"><button type="button" class="primary" data-act="confirm-del">删除</button>' +
    '<button type="button" data-act="cancel-del">取消</button></div></div>';
}
function paletteItems() {
  const q = palQuery.trim().toLowerCase();
  const items = [];
  bots.filter(function (b) { return !b.hidden; }).forEach(function (b) {
    items.push({ kind:"bot", id:b.id, title:b.name, sub:"人设" });
  });
  groups.forEach(function (g) { items.push({ kind:"group", id:g.id, title:g.name, sub:"小组" }); });
  official.concat(botSessions.filter(function (s) { return !s.hidden; })).forEach(function (s) {
    items.push({ kind:"sess", id:s.id, title:s.title, sub:s.bot ? "绑定会话" : "官方会话" });
  });
  SCENES.forEach(function (s) { items.push({ kind:"scene", id:s.id, title:s.label, sub:"分镜 " + s.key }); });
  return items.filter(function (it) { return !q || (it.title + it.sub).toLowerCase().indexOf(q) >= 0; });
}
function renderPalette() {
  const host = $("#overlay");
  if (!paletteOpen) { host.innerHTML = ""; return; }
  const items = paletteItems();
  if (palSel >= items.length) palSel = items.length ? items.length - 1 : 0;
  host.innerHTML = '<div class="scrim" data-act="close-pal"></div><div class="palette"><input id="palInput" placeholder="跳转到人设 / 会话 / 分镜" value="' + esc(palQuery) + '">' +
    '<div class="palList">' + items.map(function (it, i) {
      return '<button type="button" class="palItem ' + (i===palSel?"sel":"") + '" data-pal="' + i + '"><span>' + esc(it.title) + '</span><span class="muted">' + esc(it.sub) + "</span></button>";
    }).join("") + '</div><div class="palFoot"><span><kbd>↑↓</kbd> 选择</span><span><kbd>↵</kbd> 打开</span><span><kbd>Esc</kbd> 关闭</span></div></div>';
  restoreFocus("palInput", palQuery.length);
}
function pickPalette(i) {
  const it = paletteItems()[i];
  paletteOpen = false;
  if (!it) { render(); return; }
  if (it.kind === "bot") { sideMode = "bot"; openBot(it.id); return; }
  if (it.kind === "group") { sideMode = "bot"; openGroup(it.id); return; }
  if (it.kind === "sess") { sideMode = it.id.indexOf("s-") === 0 && !sessOf(it.id).bot ? "ws" : sideMode; openSession(it.id); return; }
  if (it.kind === "scene") applyScene(it.id);
}
function send() {
  const input = $("#composerInput");
  const text = input && input.value.trim();
  if (!text) return;
  if (sideMode === "ws" && current == null) {
    showToast("官方新会话会走探索未至之境；原型里请先点一个会话，或切到 Bot 名册");
    return;
  }
  if (sideMode === "bot" && selectedKind === "bot" && !current) newBoundSession(selectedId);
  const id = selectedKind === "group" ? selectedId : current;
  if (!id) return;
  const turns = turnsOf(id);
  turns.push({ role:"user", text:text });
  const reply = selectedKind === "group"
    ? { role:"asst", who: botOf(groupOf(id).members[0]).name, round:(groupOf(id).round || 1), parts:[{ k:"text", md:"记下了：「" + text.slice(0, 24) + "」。" }] }
    : { role:"asst", parts:[{ k:"text", md:"收到。「" + text.slice(0, 32) + "」我按这个人设回。" }] };
  turns.push(reply);
  transcripts[id] = turns;
  if (selectedKind === "bot") {
    const b = botOf(selectedId);
    if (b) b.preview = text.slice(0, 18);
    const s = sessOf(id);
    if (s) { s.time = "刚刚"; s.title = s.title === "新对话" ? text.slice(0, 16) : s.title; }
  } else {
    const g = groupOf(id);
    if (g) g.preview = text.slice(0, 18);
  }
  render();
}
function render() {
  renderChrome();
  renderSide();
  renderCenter();
  renderDetails();
  renderToast();
  renderConfirm();
  renderPalette();
}
function applyLayout(kind, id) {
  const b = botOf(id);
  if (!b) return;
  if (kind === "pin") { b.pinned = !b.pinned; b.section = b.pinned ? "pinned" : "work"; }
  if (kind === "move") { b.pinned = false; b.section = b.section === "life" ? "work" : "life"; }
  if (kind === "read") { b.unread = 0; b.mention = false; }
  if (kind === "hide") { b.hidden = true; if (selectedId === id) { selectedId = bots.find(function (x) { return !x.hidden; }).id; current = latestOf(selectedId) && latestOf(selectedId).id; } }
  if (kind === "unhide") { b.hidden = false; }
  if (kind === "mute") b.muted = !b.muted;
  menuId = null;
  render();
}
function saveBot() {
  const name = ($("#fName") && $("#fName").value.trim()) || "";
  const persona = ($("#fPersona") && $("#fPersona").value.trim()) || "";
  if (!name || !persona) { showToast("名字和人设都要填"); return; }
  if (form.kind === "create") {
    const id = "bot-" + Date.now();
    bots.push({
      id:id, name:name, color:"blue", text:name.slice(0,1), status:"idle", unread:0, preview:"还没聊过",
      memories:0, routine:null, persona:persona, section:"work", pinned:false, hidden:false, muted:false,
      modelLabel:"默认模型", routineCount:0, protected:false, updatedAt:Date.now()
    });
    selectedId = id;
    selectedKind = "bot";
    current = null;
  } else {
    const b = botOf(form.id);
    b.name = name;
    b.persona = persona;
  }
  form = null;
  render();
}
function saveGroup() {
  const name = ($("#fName") && $("#fName").value.trim()) || "";
  const memberIds = Array.prototype.map.call(document.querySelectorAll("[data-member]:checked"), function (el) { return el.getAttribute("data-member"); });
  if (!name || memberIds.length < 2) { showToast("小组至少两名成员"); return; }
  if (form.kind === "create-group") {
    const id = "g-" + Date.now();
    groups.push({ id:id, name:name, members:memberIds, preview:"还没聊过", unread:0, section:"work", updatedAt:Date.now(), round:1 });
    transcripts[id] = [];
    selectedId = id;
    selectedKind = "group";
    current = id;
  } else {
    const g = groupOf(form.id);
    g.name = name;
    g.members = memberIds;
  }
  form = null;
  render();
}
function demoPeer() {
  sideMode = "bot";
  selectedId = "reviewer";
  selectedKind = "bot";
  current = "s-142";
  panel = null;
  form = null;
  const turns = turnsOf("s-142");
  turns.push({ role:"asst", parts:[{ k:"peer", from:"运维夜班", to:"代码审查官", text:"磁盘到 86% 了，要不要写进审查备注？" }, { k:"text", md:"夜班刚传过来。磁盘告警我先记在 PR 备注里，你拍板要不要拦合并。" }] });
  transcripts["s-142"] = turns;
  showToast("同事传话到当前人设");
}
function onClick(e) {
  const t = e.target.closest("[data-act],[data-bot],[data-sess],[data-group],[data-det],[data-menu],[data-view],[data-layout],[data-fold],[data-hover],[data-scene],[data-var],[data-pal]");
  if (t == null) {
    if (!e.target.closest(".rowMenu,.sessionSwitch,.floatPanel,.palette,.confirmBox")) {
      if (menuId || switcherOpen || paletteOpen) { menuId = null; switcherOpen = false; paletteOpen = false; render(); }
    }
    return;
  }
  if (t.dataset.scene) { applyScene(t.dataset.scene); return; }
  if (t.dataset.var) { setVariant(t.dataset.var); return; }
  if (t.dataset.pal != null) { pickPalette(+t.dataset.pal); return; }
  if (t.dataset.act === "ws") { sideMode = "ws"; popover = false; panel = null; form = null; menuId = null; scene = current ? "ws" : "hero"; render(); return; }
  if (t.dataset.act === "bot") {
    sideMode = "bot";
    ensureBotSelection();
    if (variant === "B" && selectedId) drill = true;
    scene = selectedKind === "group" ? "group" : "roster";
    render();
    return;
  }
  if (t.dataset.act === "back") { drill = false; render(); return; }
  if (t.dataset.act === "new" || t.dataset.act === "new-thread") { newBoundSession(selectedKind === "bot" ? selectedId : "dsh-bot"); return; }
  if (t.dataset.act === "new-room") { newBoundRoom(); return; }
  if (t.dataset.act === "close-det") { details = null; render(); return; }
  if (t.dataset.act === "close-panel") { panel = null; details = null; render(); return; }
  if (t.dataset.act === "close-graph") { panel = null; render(); return; }
  if (t.dataset.act === "graph") { panel = "graph"; form = null; scene = "graph"; render(); return; }
  if (t.dataset.act === "create-bot") { scene = "create"; openForm({ kind:"create" }); return; }
  if (t.dataset.act === "create-group") { openForm({ kind:"create-group" }); return; }
  if (t.dataset.act === "edit-bot") { openForm({ kind:"edit", id: t.dataset.id || selectedId }); return; }
  if (t.dataset.act === "edit-group") { openForm({ kind:"edit-group", id: t.dataset.id || selectedId }); return; }
  if (t.dataset.act === "save-bot") { saveBot(); return; }
  if (t.dataset.act === "save-group") { saveGroup(); return; }
  if (t.dataset.act === "cancel-form") { form = null; render(); return; }
  if (t.dataset.act === "switcher") { switcherOpen = !switcherOpen; panel = null; render(); return; }
  if (t.dataset.act === "hidden") { hiddenOpen = !hiddenOpen; render(); return; }
  if (t.dataset.act === "tree-more") { treeMore = !treeMore; render(); return; }
  if (t.dataset.act === "theme") {
    document.documentElement.dataset.theme = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
    return;
  }
  if (t.dataset.act === "palette") { paletteOpen = true; palQuery = ""; palSel = 0; render(); return; }
  if (t.dataset.act === "close-pal") { paletteOpen = false; render(); return; }
  if (t.dataset.act === "send") { send(); return; }
  if (t.dataset.act === "peer-demo") { demoPeer(); return; }
  if (t.dataset.act === "approve-ok") { approval = { done:true, ok:true }; showToast("已批准，继续走官方 session"); return; }
  if (t.dataset.act === "approve-no") { approval = { done:true, ok:false, note:"先不动" }; showToast("已拒绝"); return; }
  if (t.dataset.act === "answer-q") { showToast("已选择：" + (e.target.textContent || "")); return; }
  if (t.dataset.act === "ask-del") { confirmDel = { kind:"bot", id:t.dataset.id }; menuId = null; render(); return; }
  if (t.dataset.act === "ask-del-group") { confirmDel = { kind:"group", id:t.dataset.id }; menuId = null; render(); return; }
  if (t.dataset.act === "cancel-del") { confirmDel = null; render(); return; }
  if (t.dataset.act === "confirm-del") {
    if (confirmDel.kind === "group") {
      const idx = groups.findIndex(function (g) { return g.id === confirmDel.id; });
      if (idx >= 0) groups.splice(idx, 1);
      if (selectedId === confirmDel.id) { selectedKind = "bot"; selectedId = "dsh-bot"; current = "s-intro"; }
    } else {
      const idx = bots.findIndex(function (b) { return b.id === confirmDel.id; });
      if (idx >= 0) bots.splice(idx, 1);
      if (selectedId === confirmDel.id) { selectedId = "dsh-bot"; current = "s-intro"; }
    }
    confirmDel = null;
    render();
    return;
  }
  if (t.dataset.fold) { folded[t.dataset.fold] = !folded[t.dataset.fold]; render(); return; }
  if (t.dataset.layout) { applyLayout(t.dataset.layout, t.dataset.id); return; }
  if (t.dataset.menu) { e.stopPropagation(); menuId = menuId === t.dataset.menu ? null : t.dataset.menu; render(); return; }
  if (t.dataset.det) { openDetails(t.dataset.det); return; }
  if (t.dataset.view) { viewTab = t.dataset.view; render(); return; }
  if (t.dataset.sess) { openSession(t.dataset.sess); return; }
  if (t.dataset.group) { openGroup(t.dataset.group); return; }
  if (t.dataset.bot) { if (panel === "graph") panel = null; openBot(t.dataset.bot); return; }
}
document.addEventListener("click", onClick);
$("#newSess").onclick = onNew;
document.addEventListener("input", function (e) {
  if (e.target.id === "sideSearch") { query = e.target.value; render(); }
  if (e.target.id === "palInput") { palQuery = e.target.value; palSel = 0; renderPalette(); }
});
document.addEventListener("keydown", function (e) {
  if (paletteOpen) {
    const items = paletteItems();
    if (e.key === "Escape") { paletteOpen = false; render(); return; }
    if (e.key === "ArrowDown") { e.preventDefault(); palSel = (palSel + 1) % Math.max(items.length, 1); renderPalette(); return; }
    if (e.key === "ArrowUp") { e.preventDefault(); palSel = (palSel - 1 + items.length) % Math.max(items.length, 1); renderPalette(); return; }
    if (e.key === "Enter") { e.preventDefault(); pickPalette(palSel); return; }
    return;
  }
  if (e.target.matches("input,textarea,[contenteditable]")) {
    if (e.target.id === "composerInput" && e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
    return;
  }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); paletteOpen = true; palQuery = ""; palSel = 0; render(); return; }
  if (e.key === "Escape") {
    menuId = null;
    switcherOpen = false;
    paletteOpen = false;
    if (panel) panel = null;
    popover = false;
    confirmDel = null;
    render();
    return;
  }
  const hit = SCENES.find(function (s) { return s.key === e.key; });
  if (hit) applyScene(hit.id);
  if (e.key === "ArrowLeft" || e.key === "ArrowRight") {
    const i = SCENES.findIndex(function (s) { return s.id === scene; });
    applyScene(SCENES[(i + (e.key === "ArrowRight" ? 1 : -1) + SCENES.length) % SCENES.length].id);
  }
});
document.addEventListener("mouseover", function (e) {
  const row = e.target.closest("[data-hover]");
  if (!row) return;
  const id = row.getAttribute("data-hover");
  clearTimeout(hoverTimer);
  hoverTimer = setTimeout(function () {
    if (hoverId === id) return;
    hoverId = id;
    render();
  }, 400);
});
document.addEventListener("mouseout", function (e) {
  const row = e.target.closest("[data-hover]");
  if (!row) return;
  const next = e.relatedTarget && e.relatedTarget.closest ? e.relatedTarget.closest("[data-hover]") : null;
  if (next && next.getAttribute("data-hover") === row.getAttribute("data-hover")) return;
  clearTimeout(hoverTimer);
  hoverTimer = setTimeout(function () { hoverId = null; render(); }, 120);
});
applyScene("ws");
</script>
