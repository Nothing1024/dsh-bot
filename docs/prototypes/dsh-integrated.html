<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DSH Bot · 长在 DSH 官方壳上（结合方案原型）</title>
<style>
:root[data-theme="dark"] { color-scheme: dark; --bg:#12151a; --panel:#181c22; --panel2:#1e232b; --border:#2c333c; --text:#e8eaed; --muted:#9aa3ad; --accent:#6b8cff; --accent-soft:rgba(107,140,255,.16); --danger:#f07178; --ok:#7fd18a; --warn:#f0c674; --hover:#222830; --user:#2a3446; --shadow:0 8px 30px rgba(0,0,0,.45); --plug:#f0c674; --plug-soft:rgba(240,198,116,.14); }
:root[data-theme="light"] { color-scheme: light; --bg:#f6f7f9; --panel:#fff; --panel2:#f0f2f5; --border:#dfe3e8; --text:#1c2128; --muted:#667085; --accent:#3b63f3; --accent-soft:rgba(59,99,243,.12); --danger:#d64550; --ok:#2f9e5b; --warn:#b7791f; --hover:#eef1f5; --user:#e3e9f7; --shadow:0 8px 30px rgba(16,24,40,.14); --plug:#b7791f; --plug-soft:rgba(183,121,31,.12); }
* { box-sizing: border-box; }
html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font:13px/1.5 ui-sans-serif, system-ui, -apple-system, "PingFang SC", sans-serif; }
button { font:inherit; color:inherit; background:none; border:0; cursor:pointer; }
kbd { font:11px ui-monospace, monospace; padding:1px 5px; border:1px solid var(--border); border-bottom-width:2px; border-radius:4px; color:var(--muted); }
.hidden { display:none !important; }

/* ===== DSH 官方三栏壳：sidebar | conversation | details(better-sidebar) ===== */
.shell { display:grid; grid-template-columns: 260px 1fr 320px; height:100%; }
.shell.noRight { grid-template-columns: 260px 1fr 0; }
.col { min-width:0; overflow:hidden; display:flex; flex-direction:column; }
.sidebar { background:var(--panel); border-right:1px solid var(--border); }
.right { background:var(--panel); border-left:1px solid var(--border); }

/* 官方侧栏 */
.brand { display:flex; align-items:center; gap:8px; padding:12px 14px; font-weight:700; border-bottom:1px solid var(--border); }
.brand .mark { width:22px; height:22px; border-radius:6px; background:linear-gradient(135deg,#4f7cf0,#9b6ee8); }
.brand .sp { flex:1; }
.wsHead { display:flex; align-items:center; gap:6px; padding:10px 12px 4px; color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.06em; }
.wsHead .sp { flex:1; }
.seg { display:inline-flex; border:1px solid var(--border); border-radius:7px; overflow:hidden; font-size:11px; }
.seg button { padding:2px 8px; color:var(--muted); } .seg button.on { background:var(--accent-soft); color:var(--accent); }
.wsList { flex:1; overflow:auto; padding:0 6px 8px; }
.ws { padding:6px 8px; font-weight:600; display:flex; align-items:center; gap:6px; }
.ws small { color:var(--muted); font-weight:400; }
.sess { display:flex; align-items:center; gap:8px; padding:5px 8px 5px 14px; border-radius:7px; cursor:pointer; color:var(--text); }
.sess:hover { background:var(--hover); } .sess.active { background:var(--accent-soft); }
.sess .t { flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.sess .m { color:var(--muted); font-size:11px; }
.sess .run { width:7px; height:7px; border-radius:50%; background:var(--warn); animation:pulse 1.2s infinite; }
@keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.4)} }
.sideFoot { border-top:1px solid var(--border); padding:6px; display:flex; flex-direction:column; gap:2px; }
.footRow { display:flex; align-items:center; gap:8px; padding:6px 8px; border-radius:7px; cursor:pointer; color:var(--muted); }
.footRow:hover { background:var(--hover); color:var(--text); }
.footRow .badge { margin-left:auto; }
.badge { min-width:18px; height:18px; padding:0 5px; border-radius:9px; background:var(--accent); color:#fff; font-size:11px; font-weight:700; display:grid; place-items:center; }
.badge.mention { background:var(--danger); }

/* 名册模式下的侧栏（插件贡献） */
.rosterRow { display:grid; grid-template-columns:30px 1fr auto; gap:8px; align-items:center; padding:6px 8px; border-radius:8px; cursor:pointer; }
.rosterRow:hover { background:var(--hover); } .rosterRow.active { background:var(--accent-soft); }
.rosterRow .n { font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.rosterRow .p { color:var(--muted); font-size:11.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.rosterRow .meta { display:flex; flex-direction:column; align-items:flex-end; gap:3px; font-size:11px; color:var(--muted); }
.subSess { padding:3px 8px 3px 46px; color:var(--muted); font-size:11.5px; cursor:pointer; border-radius:6px; display:flex; gap:6px; }
.subSess:hover { background:var(--hover); color:var(--text); } .subSess.active { color:var(--accent); }
.av { width:30px; height:30px; border-radius:9px; display:grid; place-items:center; color:#fff; font-weight:700; font-size:13px; position:relative; flex:none; }
.av.sm { width:20px; height:20px; font-size:10px; border-radius:6px; } .av.xs { width:16px; height:16px; font-size:9px; border-radius:5px; }
.av.blob { border-radius:40% 60% 55% 45% / 55% 45% 55% 45%; } .av.hex { clip-path:polygon(25% 5%,75% 5%,100% 50%,75% 95%,25% 95%,0 50%); border-radius:0; } .av.pebble { border-radius:50% 50% 45% 55% / 60% 60% 40% 40%; }
.av .st { position:absolute; right:-2px; bottom:-2px; width:9px; height:9px; border-radius:50%; border:2px solid var(--panel); background:var(--muted); }
.av .st.working { background:var(--warn); animation:pulse 1.2s infinite; } .av .st.online { background:var(--ok); }
.mosaic { display:grid; grid-template-columns:1fr 1fr; gap:2px; padding:3px; background:var(--panel2); border-radius:9px; } .mosaic i { display:block; border-radius:3px; min-height:10px; }

/* 官方对话面 */
.conv { background:var(--bg); }
.convHead { display:flex; align-items:center; gap:8px; padding:8px 14px; border-bottom:1px solid var(--border); background:var(--panel); }
.convHead .title { font-weight:600; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.convHead .lineage { color:var(--muted); font-size:12px; }
.convHead .sp { flex:1; }
.pill { padding:3px 9px; border-radius:999px; border:1px solid var(--border); background:var(--panel2); color:var(--muted); font-size:12px; display:inline-flex; align-items:center; gap:5px; cursor:pointer; white-space:nowrap; }
.pill:hover { color:var(--text); border-color:var(--accent); } .pill.on { color:var(--accent); border-color:var(--accent); background:var(--accent-soft); }
.viewTabs { display:flex; gap:2px; padding:0 14px; border-bottom:1px solid var(--border); background:var(--panel); }
.viewTabs button { padding:7px 12px; color:var(--muted); font-size:12.5px; border-bottom:2px solid transparent; }
.viewTabs button.on { color:var(--text); border-bottom-color:var(--accent); }
.transcript { flex:1; overflow:auto; padding:16px 18px 8px; }
.turn { max-width:860px; margin:0 0 14px; }
.turn.user { display:flex; justify-content:flex-end; }
.turn.user .bubble { background:var(--user); border-color:transparent; }
.bubble { display:inline-block; max-width:100%; padding:8px 12px; border-radius:12px; background:var(--panel2); border:1px solid var(--border); }
.bubble p { margin:0 0 .5em; } .bubble p:last-child { margin:0; }
.bubble code { font:12px ui-monospace, monospace; background:var(--bg); padding:0 4px; border-radius:4px; }
.bubble pre { margin:.5em 0; padding:10px 12px; background:var(--bg); border:1px solid var(--border); border-radius:8px; font:12px/1.5 ui-monospace, monospace; overflow:auto; }
.cursor { display:inline-block; width:7px; height:14px; background:var(--accent); vertical-align:-2px; margin-left:2px; animation:blink .9s steps(1) infinite; } @keyframes blink { 50%{opacity:0} }
.card { border:1px solid var(--border); border-radius:10px; background:var(--panel); margin:6px 0; max-width:640px; overflow:hidden; }
.cardHead { display:flex; align-items:center; gap:8px; padding:7px 10px; font-size:12px; cursor:pointer; }
.cardHead .name { font-weight:600; font-family:ui-monospace, monospace; } .cardHead .sub { flex:1; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.cardHead .st { font-size:11px; padding:1px 6px; border-radius:999px; border:1px solid var(--border); color:var(--muted); } .st.ok { color:var(--ok); border-color:var(--ok); } .st.run { color:var(--warn); border-color:var(--warn); }
.cardBody { display:none; border-top:1px solid var(--border); padding:8px 10px; font:12px/1.5 ui-monospace, monospace; color:var(--muted); white-space:pre-wrap; background:var(--bg); } .card.open .cardBody { display:block; }
.card.approval { border-color:var(--warn); } .card.approval .cardBody { display:block; font-family:inherit; color:var(--text); background:var(--panel); }
.btnRow { display:flex; gap:6px; margin-top:8px; flex-wrap:wrap; }
.btn { padding:5px 11px; border-radius:7px; border:1px solid var(--border); background:var(--panel2); font-size:12px; } .btn:hover { border-color:var(--accent); }
.btn.primary { background:var(--accent); border-color:var(--accent); color:#fff; } .btn.danger { color:var(--danger); } .btn.ghost { border-color:transparent; color:var(--muted); }
.turnTail { display:flex; align-items:center; gap:8px; margin-top:6px; font-size:11.5px; color:var(--muted); }
.turnTail .acts { display:flex; gap:2px; opacity:0; transition:opacity .12s; } .turn:hover .turnTail .acts { opacity:1; }
.turnTail .acts button { padding:1px 6px; border-radius:5px; } .turnTail .acts button:hover { background:var(--hover); color:var(--text); }
.reactions { display:inline-flex; gap:4px; } .reactions span { padding:0 7px; border-radius:999px; border:1px solid var(--border); background:var(--panel2); font-size:11.5px; cursor:pointer; } .reactions span.mine { border-color:var(--accent); background:var(--accent-soft); }
.typing { display:inline-flex; gap:3px; padding:8px 12px; } .typing i { width:6px; height:6px; border-radius:50%; background:var(--muted); animation:bob 1s infinite; } .typing i:nth-child(2){animation-delay:.15s} .typing i:nth-child(3){animation-delay:.3s} @keyframes bob { 0%,100%{transform:translateY(0);opacity:.5} 50%{transform:translateY(-3px);opacity:1} }
.queue { padding:0 14px; display:flex; flex-direction:column; gap:4px; }
.qItem { display:flex; align-items:center; gap:8px; padding:5px 10px; border:1px dashed var(--border); border-radius:8px; font-size:12px; color:var(--muted); background:var(--panel); } .qItem .txt { flex:1; color:var(--text); } .qItem button { font-size:11px; color:var(--muted); }
.composerWrap { padding:8px 14px 12px; }
.attachRow { display:flex; gap:6px; padding:8px 10px 0; flex-wrap:wrap; } .att { display:inline-flex; align-items:center; gap:6px; padding:3px 8px 3px 4px; border-radius:7px; border:1px solid var(--border); background:var(--panel2); font-size:12px; } .att .thumb { width:22px; height:22px; border-radius:4px; background:linear-gradient(135deg,#6b8cff,#c792ea); }
.composer { border:1px solid var(--border); border-radius:12px; background:var(--panel); } .composer:focus-within { border-color:var(--accent); }
.composer textarea { width:100%; border:0; background:transparent; color:var(--text); padding:10px 12px 4px; resize:none; min-height:40px; max-height:200px; font:inherit; line-height:1.5; } .composer textarea:focus { outline:none; }
.composerBar { display:flex; align-items:center; gap:4px; padding:4px 8px 8px; } .composerBar .sp { flex:1; }
.iconBtn { width:28px; height:28px; border-radius:7px; display:grid; place-items:center; color:var(--muted); } .iconBtn:hover { background:var(--hover); color:var(--text); }
.send { padding:5px 12px; border-radius:8px; background:var(--accent); color:#fff; font-weight:600; } .send.stop { background:var(--danger); }
.modeSel { display:inline-flex; border:1px solid var(--border); border-radius:7px; overflow:hidden; font-size:11px; } .modeSel button { padding:3px 8px; color:var(--muted); } .modeSel button.on { background:var(--accent-soft); color:var(--accent); }

/* 右栏：better-sidebar 页签（插件原生渲染，无 iframe） */
.tabs { display:flex; gap:2px; padding:8px 8px 0; border-bottom:1px solid var(--border); }
.tabs button { padding:6px 10px; color:var(--muted); font-size:12px; border-bottom:2px solid transparent; border-radius:7px 7px 0 0; } .tabs button.on { color:var(--text); border-bottom-color:var(--accent); }
.tabBody { flex:1; overflow:auto; padding:12px; }
.tabBody h3 { font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:14px 0 6px; } .tabBody h3:first-child { margin-top:0; }
.fact { display:flex; gap:8px; align-items:flex-start; padding:5px 8px; border-radius:8px; font-size:12.5px; } .fact:hover { background:var(--hover); } .fact .t { flex:1; } .fact .src { font-size:10px; color:var(--muted); white-space:nowrap; margin-top:3px; } .fact .del { visibility:hidden; color:var(--muted); font-size:11px; } .fact:hover .del { visibility:visible; } .fact.faded { opacity:.55; }
.routine { padding:8px 10px; border:1px solid var(--border); border-radius:9px; margin-bottom:8px; font-size:12.5px; } .routine .top { display:flex; align-items:center; gap:8px; } .routine .top b { flex:1; } .routine .cron { font:11px ui-monospace, monospace; color:var(--muted); }
.sw { width:30px; height:17px; border-radius:999px; background:var(--border); position:relative; cursor:pointer; } .sw::after { content:""; position:absolute; top:2px; left:2px; width:13px; height:13px; border-radius:50%; background:#fff; transition:left .15s; } .sw.on { background:var(--ok); } .sw.on::after { left:15px; }
.inp { width:100%; padding:5px 8px; border-radius:7px; border:1px solid var(--border); background:var(--panel2); color:var(--text); font:inherit; }
.chip { display:inline-flex; align-items:center; gap:6px; padding:3px 8px 3px 3px; border-radius:999px; border:1px solid var(--border); font-size:12px; white-space:nowrap; } .chip.speaking { border-color:var(--warn); box-shadow:0 0 0 2px rgba(240,198,116,.25); } .chip.spoke { opacity:.6; } .chip.pass { opacity:.45; text-decoration:line-through; }

/* 弹层 / toast */
.pop { position:absolute; z-index:30; background:var(--panel); border:1px solid var(--border); border-radius:10px; box-shadow:var(--shadow); min-width:220px; padding:4px; }
.pop button { display:flex; width:100%; align-items:center; gap:8px; padding:6px 10px; border-radius:7px; text-align:left; font-size:12.5px; } .pop button:hover { background:var(--hover); } .pop hr { border:0; border-top:1px solid var(--border); margin:4px 0; }
.toasts { position:fixed; right:16px; bottom:60px; z-index:120; display:flex; flex-direction:column; gap:8px; }
.toast { display:grid; grid-template-columns:30px 1fr auto; gap:10px; align-items:center; width:340px; padding:10px 12px; background:var(--panel); border:1px solid var(--border); border-radius:12px; box-shadow:var(--shadow); cursor:pointer; animation:slidein .2s ease-out; } .toast .t b { display:block; } .toast .t span { color:var(--muted); font-size:12px; } @keyframes slidein { from{transform:translateY(12px);opacity:0} }

/* ===== 插件贡献高亮 / 只看原生 ===== */
[data-plug] { position:relative; }
body.hl [data-plug] { outline:1.5px dashed var(--plug); outline-offset:-1px; }
body.hl [data-plug]::after { content:attr(data-plug); position:absolute; z-index:60; right:4px; top:-9px; font:10px/1.3 ui-monospace, monospace; background:var(--plug); color:#1c2128; padding:1px 6px; border-radius:4px; pointer-events:none; white-space:nowrap; }
body.native [data-plug] { display:none !important; }
body.native [data-plug="sidebar.workspaces（名册模式）"] { display:none !important; }
.demoBar { position:fixed; left:50%; bottom:12px; transform:translateX(-50%); z-index:80; display:flex; gap:6px; padding:6px 8px; background:var(--panel); border:1px solid var(--border); border-radius:12px; box-shadow:var(--shadow); align-items:center; flex-wrap:wrap; justify-content:center; max-width:96vw; }
.demoBar .lbl { color:var(--muted); font-size:11px; padding:0 4px; } .demoBar .btn { font-size:11.5px; padding:4px 9px; }
.legend { position:fixed; left:12px; bottom:12px; z-index:80; font-size:11px; color:var(--muted); background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:5px 9px; display:flex; gap:10px; align-items:center; }
.legend i { display:inline-block; width:10px; height:10px; border:1.5px dashed var(--plug); vertical-align:-1px; margin-right:4px; }
</style>
</head>
<body class="hl">
<div class="shell" id="shell">
  <!-- ================= 官方左栏（ui-sidebar 占据，插件只往内部座位加东西） ================= -->
  <aside class="col sidebar">
    <div class="brand"><span class="mark"></span>DSH<span class="sp"></span><button class="iconBtn" id="themeBtn" title="主题（宿主）">◐</button></div>
    <div class="wsHead">
      <span id="wsLabel">工作区</span><span class="sp"></span>
      <span class="seg" data-plug="sidebar.workspaces 顶部 · 视图切换"><button class="on" data-view="ws" onclick="setSideView('ws')">会话</button><button data-view="roster" onclick="setSideView('roster')">Bot</button></span>
    </div>
    <div class="wsList" id="wsList"></div>
    <div class="sideFoot">
      <div class="footRow" data-plug="sidebar.footer.action" onclick="setSideView('roster'); toast('🤖','DSH Bot','切到名册视图；有未读时这里亮徽标')">🤖 DSH Bot <span class="badge" id="footBadge">3</span></div>
      <div class="footRow">⚙ 设置</div>
    </div>
  </aside>

  <!-- ================= 官方中栏（ui-conversation 占据，流式/停止/排队/附件/审批都是它自带的） ================= -->
  <main class="col conv">
    <header class="convHead">
      <span id="identity" data-plug="session.header.actions（order<0 身份区）"></span>
      <span class="title" id="convTitle">PR #142 审查</span>
      <span class="lineage" id="lineage">· ~/workspace/dsh-bot</span>
      <span class="sp"></span>
      <button class="pill" id="memPill" data-plug="session.header.actions" onclick="openRight('memory')" title="这个 Bot 记住的事">🧠 记忆 <small>6</small></button>
      <button class="pill" data-plug="session.header.actions" onclick="openRight('routines')" title="例程">⏰ 2</button>
      <button class="pill" onclick="toast('🧠','模型','官方 input.model 选择器，bot 的 override 只是给它一个初值')">deepseek-r1</button>
      <button class="pill" onclick="toast('⑂','分叉','官方 sessions.fork')">⑂</button>
      <button class="pill" onclick="toggleRight()" title="右栏">▥</button>
    </header>
    <div class="viewTabs">
      <button class="on" onclick="setView(this,'chat')">Chat</button>
      <button onclick="setView(this,'traj')">Trajectory</button>
      <button data-plug="conversation.view（小组房间视图，仅小组会话出现）" id="roomTab" class="hidden" onclick="setView(this,'room')">房间</button>
    </div>
    <div id="membersBar" class="hidden" data-plug="conversation.session.header.utilities（小组成员三态）" style="display:flex;gap:6px;padding:6px 14px;border-bottom:1px solid var(--border);background:var(--panel);align-items:center;overflow:auto"></div>
    <section class="transcript" id="transcript"></section>
    <div class="queue" id="queue"></div>
    <div class="composerWrap">
      <div class="composer" id="composer">
        <div class="attachRow hidden" id="attachRow"></div>
        <textarea id="input" rows="1" placeholder="给 Bot 发消息…（官方 composer：粘贴/拖入图片、⇧↵ 换行）"></textarea>
        <div class="composerBar">
          <button class="iconBtn" title="附件（官方 input.attachments）" onclick="addAttachment()">📎</button>
          <button class="iconBtn" data-plug="input.left（@ 其他 Bot）" title="@ 其他 Bot：异步发给同事，回复稍后到达" onclick="insertText('@')">@</button>
          <span class="sp"></span>
          <span class="modeSel" id="modeSel" title="官方 prompt mode"><button data-mode="queue" class="on">排队</button><button data-mode="steer">打断</button></span>
          <button class="send" id="sendBtn">发送 ↵</button>
        </div>
      </div>
    </div>
  </main>

  <!-- ================= 官方右栏：details / better-sidebar，插件页签直接渲染 React，不再 iframe ================= -->
  <aside class="col right" id="right" data-plug="better-sidebar 页签 · 原生渲染（无 iframe）">
    <div class="tabs">
      <button class="on" data-tab="bot" onclick="openRight('bot')">人设</button>
      <button data-tab="memory" onclick="openRight('memory')">记忆</button>
      <button data-tab="routines" onclick="openRight('routines')">例程</button>
      <button data-tab="peers" onclick="openRight('peers')">同事</button>
    </div>
    <div class="tabBody" id="tabBody"></div>
  </aside>
</div>

<div class="toasts" id="toasts"></div>
<div class="legend"><span><i></i>虚线框 = 插件贡献；其余全是 DSH 官方自带</span></div>
<div class="demoBar">
  <span class="lbl">演示</span>
  <button class="btn primary" id="nativeBtn" onclick="toggleNative()">只看 DSH 原生</button>
  <button class="btn" onclick="toggleHl()" id="hlBtn">隐藏高亮</button>
  <button class="btn" onclick="demoStream()">流式（官方）</button>
  <button class="btn" onclick="demoApproval()">审批卡（官方）</button>
  <button class="btn" onclick="demoWake()">Bot 主动来消息</button>
  <button class="btn" onclick="demoPeer()">Bot 间传话</button>
  <button class="btn" onclick="openSession('g-design')">进小组房间</button>
</div>
<script>

    body.innerHTML = (rs.map(r => `<div class="routine"><div class="top"><b>${esc(r.name)}</b><span class="sw ${r.on ? 'on' : ''}" onclick="this.classList.toggle('on')"></span></div><div class="cron">${esc(r.cron)}</div><div style="color:var(--muted);font-size:12px;margin-top:4px">${esc(r.last)}</div></div>`).join('') || `<div style="color:var(--muted)">没有例程。</div>`) + `<div class="btnRow"><button class="btn" onclick="toast('⏰','新建例程','到期 → host 用 sessions.prompt 给该 Bot 的例程会话发 [routine] 唤醒词 → 有话就说，没话静默')">＋ 新建例程</button></div><div style="color:var(--muted);font-size:11px;margin-top:10px">例程结果落在该 Bot 的一个官方会话里（标 wake），名册亮未读，系统通知只在窗口失焦时发。</div>`;
  } else {
    body.innerHTML = `<div style="color:var(--muted);font-size:12px;margin-bottom:8px">这个 Bot 能异步给同事发消息（像发短信），回复以 [agent] 唤醒到达。</div>` + bots.filter(b => b.id !== idn.id).map(b => `<div class="fact">${av(b.avatar,'sm')}<span class="t"><b>${esc(b.name)}</b><br><small style="color:var(--muted)">${b.id === 'dsh-bot' ? '今天互发 3 条' : '暂无往来'}</small></span></div>`).join('') + `<h3>所在小组</h3>` + groups.filter(g => g.members.includes(idn.id)).map(g => `<div class="fact" style="cursor:pointer" onclick="openSession('${g.id}')">${mosaic(g,'sm')}<span class="t">${esc(g.name)}</span></div>`).join('');
  }
}
</script>
<script>
/* ===== Composer：这些全是官方 ui-conversation 自带的行为，原型只是模拟 ===== */
let mode = 'queue', working = false, timer = null; const queue = [];
const input = $('#input');
document.querySelectorAll('#modeSel button').forEach(b => b.onclick = () => { mode = b.dataset.mode; document.querySelectorAll('#modeSel button').forEach(x => x.classList.toggle('on', x === b)); });
input.addEventListener('input', () => { input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 200) + 'px'; });
input.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } if (e.key === 'Escape' && working) stop(); });
input.addEventListener('paste', e => { for (const it of e.clipboardData.items) if (it.type.startsWith('image/')) { e.preventDefault(); addAttachment('pasted.png'); } });
$('#composer').addEventListener('dragover', e => e.preventDefault()); $('#composer').addEventListener('drop', e => { e.preventDefault(); addAttachment(e.dataTransfer.files?.[0]?.name || 'dropped.png'); });
$('#sendBtn').onclick = () => working ? stop() : send();
function setWorking(v) { working = v; const b = $('#sendBtn'); b.textContent = v ? '停止 ⎋' : '发送 ↵'; b.classList.toggle('stop', v); const idn = identityOf(sessOf(currentSession)); if (idn && !idn.members) { idn.status = v ? 'working' : 'online'; renderSide(); openSession(currentSession); } if (!v) flush(); }
function renderQueue() { $('#queue').innerHTML = queue.map((q, i) => `<div class="qItem">⏳ 排队 ${i+1}<span class="txt">${esc(q)}</span><button onclick="queue.splice(${i},1);renderQueue()">✕</button></div>`).join(''); }
function flush() { if (queue.length && !working) { appendUser(queue.shift()); renderQueue(); demoStream(); } }
function send() {
  const t = input.value.trim(); const atts = document.querySelectorAll('#attachRow .att').length; if (!t && !atts) return;
  input.value = ''; input.style.height = 'auto'; $('#attachRow').innerHTML = ''; $('#attachRow').classList.add('hidden');
  const shown = t + (atts ? `\n\n📎 ${atts} 张图片` : '');
  if (working) { if (mode === 'queue') { queue.push(shown); renderQueue(); toast('⏳','已排队','官方 sessions.prompt{mode:"queue"}'); } else { appendUser(shown); toast('⚡','已打断','官方 sessions.prompt{mode:"steer"}'); restart(); } return; }
  appendUser(shown); sessOf(currentSession).group ? demoGroup() : demoStream();
}
function appendUser(t) { $('#transcript').insertAdjacentHTML('beforeend', `<div class="turn user"><div class="bubble">${md(t)}</div></div>`); $('#transcript').scrollTop = 1e9; }
function stop() { clearInterval(timer); timer = null; $('#transcript .cursor')?.remove(); setWorking(false); toast('⏹','已停止','官方 sessions.cancel，队列保留'); }
function addAttachment(name = 'screenshot.png') { const r = $('#attachRow'); r.classList.remove('hidden'); r.insertAdjacentHTML('beforeend', `<span class="att"><span class="thumb"></span>${esc(name)}<button onclick="this.parentNode.remove()" style="color:var(--muted)">✕</button></span>`); toast('🖼','图片已暂存','官方 input.attachments → PromptContentPart image'); }
function insertText(t) { input.value += t; input.focus(); }

/* ===== 演示 ===== */
function shell(whoId) {
  const s = sessOf(currentSession); const who = whoId ? botById(whoId) : identityOf(s);
  const el = document.createElement('div'); el.className = 'turn';
  el.innerHTML = `${who ? `<div data-plug="chat.node 前缀（身份行）" style="display:flex;gap:6px;align-items:center;margin-bottom:4px;font-size:12px;color:var(--muted)">${av(who.avatar,'xs')} <b style="color:var(--text)">${esc(who.name)}</b></div>` : ''}<div class="split" style="display:flex;flex-direction:column;gap:6px;align-items:flex-start"><div class="typing"><i></i><i></i><i></i></div></div>${tail()}`;
  $('#transcript').appendChild(el); $('#transcript').scrollTop = 1e9; return el.querySelector('.split');
}
function stream(split, text, done) {
  split.querySelector('.typing')?.remove(); const b = document.createElement('div'); b.className = 'bubble'; split.appendChild(b); let i = 0; clearInterval(timer);
  timer = setInterval(() => { i += 1 + Math.floor(Math.random()*3); b.innerHTML = md(text.slice(0,i)) + '<span class="cursor"></span>'; $('#transcript').scrollTop = 1e9; if (i >= text.length) { clearInterval(timer); timer = null; b.innerHTML = md(text); done && done(); } }, 30);
}
function demoStream() { if (working) return; setWorking(true); const sp = shell(); setTimeout(() => stream(sp, '第二处在 `toRoomSpeech` 的签名：第二个参数从 `turnPrompt` 变成了 `written`。\n\n有一个测试还按旧语义传参，仍然过是因为剥离逻辑是子串匹配。改测试或加断言，你选。', () => setWorking(false)), 600); }
function restart() { clearInterval(timer); $('#transcript .cursor')?.remove(); const sp = shell(); setTimeout(() => stream(sp, '好，先回你插进来的这句：改测试更干净。\n\n回到刚才——', () => setWorking(false)), 500); }
function demoApproval() {
  if (working) return; setWorking(true); const sp = shell();
  setTimeout(() => { sp.querySelector('.typing')?.remove(); sp.insertAdjacentHTML('beforeend', `<div class="bubble">${md('这一步要动 git，我先问你。')}</div><div class="card approval" id="apv"><div class="cardHead" style="cursor:default">🛡 <span class="name">需要你批准</span><span class="sub">官方 approval/requested · dsh-user-approval</span></div><div class="cardBody">执行：<pre>git commit -am "test: assert toRoomSpeech(written)"</pre><div class="btnRow"><button class="btn primary" onclick="resolve(true)">允许</button><button class="btn" onclick="resolve(true)">本会话都允许</button><button class="btn danger" onclick="resolve(false)">拒绝</button></div></div></div>`); $('#transcript').scrollTop = 1e9; }, 500);
  toast('🛡','代码审查官 需要你批准','git commit … 点击查看');
}
function resolve(ok) { const c = $('#apv'); c.style.opacity = .7; c.querySelector('.btnRow').innerHTML = `<span style="color:${ok ? 'var(--ok)' : 'var(--danger)'};font-size:12px">${ok ? '✓ 已允许' : '✕ 已拒绝'}</span>`; setTimeout(() => stream(c.closest('.split'), ok ? '提交了，`a3f19c2`。' : '好，不提交。补丁在 `/tmp/x.patch`。', () => setWorking(false)), 400); }
function demoWake() {
  const b = botById('ops'); b.unread += 1; b.preview = '磁盘涨到 86% 了';
  const s = sessOf('s-ops'); s.time = '刚刚'; s.running = false;
  transcripts['s-ops'].push({ t:'asst', wake:'routine', parts:[{ k:'text', md:'磁盘涨到 **86%** 了，超过你设的 85%。`env/sessions/` 占大头，要我清 30 天前的隐藏轮次会话吗？' }] });
  sessions.splice(sessions.indexOf(s), 1); sessions.unshift(s);
  renderSide(); if (currentSession === 's-ops') renderTranscript();
  toast('🌙','运维夜班','磁盘涨到 86% 了，要我清一下吗？（窗口失焦时才发系统通知）', () => openSession('s-ops'));
}
function demoPeer() {
  openSession('s-142'); if (working) return; setWorking(true); const sp = shell();
  setTimeout(() => { sp.querySelector('.typing')?.remove(); sp.insertAdjacentHTML('beforeend', `<div class="bubble">${md('这个断言写法我不确定，问一下 DSH Bot。')}</div><div class="card" data-plug="Bot 间消息 · dsh_bot_send 工具（异步）" style="border-color:var(--plug)"><div class="cardHead" style="cursor:default">✉ <span class="name">发给 DSH Bot</span><span class="sub">toRoomSpeech(written) 应该断言还是改测试？</span><span class="st run">等回复</span></div></div>`); $('#transcript').scrollTop = 1e9; }, 500);
  setTimeout(() => { const st = $('#transcript .card .st.run'); if (st) { st.className = 'st ok'; st.textContent = '已回复'; } stream(sp, 'DSH Bot 说改测试，理由是断言会把实现细节钉死。那就改测试。', () => { setWorking(false); const d = botById('dsh-bot'); d.preview = '[agent] 回了审查官：改测试'; renderSide(); }); }, 3200);
}
function demoGroup() {
  if (working) return; setWorking(true); const g = groupById('g-design'); const order = ['poet','reviewer','dsh-bot']; const lines = { poet:'字段名就叫 `replyTo`，别叫 `quote`，会和 markdown 引用混。', reviewer:null, 'dsh-bot':'定了：`replyTo:{seq,speaker}` 可选，旧行兼容。我去开 spec 包。' };
  const state = {}; g.round = 3; let i = 0;
  const step = () => { if (i >= order.length) { renderMembers(g, state); setWorking(false); return; } const id = order[i]; state[id] = 'speaking'; renderMembers(g, state);
    if (!lines[id]) { state[id] = 'pass'; $('#transcript').insertAdjacentHTML('beforeend', `<div class="turn" style="color:var(--muted);font-size:12px;font-style:italic">${av(botById(id).avatar,'xs')} ${esc(botById(id).name)} 本轮没有补充</div>`); i++; setTimeout(step, 800); return; }
    const sp = shell(id); setTimeout(() => stream(sp, lines[id], () => { state[id] = 'spoke'; i++; setTimeout(step, 500); }), 600); };
  setTimeout(step, 400);
}

/* ===== 开关 ===== */
function toggleNative() { const on = document.body.classList.toggle('native'); $('#nativeBtn').textContent = on ? '恢复插件' : '只看 DSH 原生'; if (on && sideView === 'roster') setSideView('ws'); toast(on ? '🧩' : '🤖', on ? '现在是没装插件的 DSH' : '插件已恢复', on ? '注意：流式 / 停止 / 排队 / 附件 / 审批卡都还在，它们本来就是官方的' : '虚线框里的才是插件要写的东西'); }
function toggleHl() { const on = document.body.classList.toggle('hl'); $('#hlBtn').textContent = on ? '隐藏高亮' : '显示高亮'; }
$('#themeBtn').onclick = () => { const h = document.documentElement; h.dataset.theme = h.dataset.theme === 'dark' ? 'light' : 'dark'; };
function toast(ic, title, body, onClick) { const el = document.createElement('div'); el.className = 'toast'; el.innerHTML = `<span class="av" style="background:var(--panel2);color:var(--text);font-size:15px">${ic}</span><div class="t"><b>${esc(title)}</b><span>${esc(body)}</span></div><button style="color:var(--muted)">✕</button>`; el.onclick = e => { if (e.target.tagName !== 'BUTTON' && onClick) onClick(); el.remove(); }; $('#toasts').appendChild(el); setTimeout(() => el.remove(), 6000); }
document.addEventListener('keydown', e => { const mod = e.metaKey || e.ctrlKey; if (mod && e.key.toLowerCase() === 'b') { e.preventDefault(); setSideView(sideView === 'ws' ? 'roster' : 'ws'); } });

renderSide(); openSession('s-142');
setTimeout(() => toast('👋','这版原型长在 DSH 官方壳上','点「只看 DSH 原生」对比：中间的流式/停止/排队/附件/审批全是官方自带；插件只补虚线框里的身份、名册、记忆、例程、小组、Bot 间传话。'), 600);
</script>
