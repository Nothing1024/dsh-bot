<div id="dsh-bot-integrated-prototype" aria-label="DSH 中的原版 Bot 工作台"></div>
<style>
@scope (#dsh-bot-integrated-prototype) {
:scope {
  color-scheme: inherit;
  --wb-bg: light-dark(#ffffff, #12151a);
  --wb-panel: light-dark(#f6f7f9, #181c22);
  --wb-border: light-dark(#dde1e7, #2c333c);
  --wb-text: light-dark(#202733, #e8eaed);
  --wb-muted: light-dark(#66707c, #9aa3ad);
  --wb-accent: light-dark(#4467d7, #6b8cff);
  --wb-danger: light-dark(#b83546, #f07178);
  --wb-hover: light-dark(#edf0f4, #222830);
}

* {
  box-sizing: border-box;
}

:scope {
  margin: 0;
  height: 100%;
  background: var(--wb-bg);
  color: var(--wb-text);
  font: 13px/1.45 ui-sans-serif, system-ui, sans-serif;
}

.shell {
  display: flex;
  height: 100%;
  min-height: 100%;
}

.roster {

  flex: none;
  display: flex;
  flex-direction: column;
  background: var(--wb-panel);
  border-right: 1px solid var(--wb-border);
  min-height: 0;
}

.rosterHead {
  padding: 10px 12px;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.01em;
  border-bottom: 1px solid var(--wb-border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.rosterHeadActions {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  justify-content: flex-end;
}

.newBot {
  appearance: none;
  border: 1px solid var(--wb-border);
  background: transparent;
  color: var(--wb-text);
  font-size: 12px;
  line-height: 24px;
  padding: 0 10px;
  border-radius: 999px;
  cursor: pointer;
  white-space: nowrap;
}

.newBot:hover {
  background: var(--wb-hover);
}

.rosterBody {
  flex: 1;
  min-height: 0;
  overflow: auto;
  padding: 8px;
}

.rosterList {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.rosterRow {
  display: grid;
  grid-template-columns: 36px minmax(0, 1fr) auto;
  gap: 8px;
  align-items: center;
  padding: 8px;
  border-radius: 8px;
  cursor: pointer;
  position: relative;
}

.rosterRow:hover {
  background: var(--wb-hover);
}

.rosterRow.isSelected {

}

.rosterRow.isMuted {

}

.roster.isCollapsed {

.rosterSection {

.rosterSectionHead {

  width: 100%;
  text-align: left;
  background: transparent;
  border: 0;
  color: var(--wb-muted);
  padding: 4px 6px;
  cursor: pointer;
  font: inherit;
}

.rosterPreviewCard {
  position: absolute;
  left: calc(100% + 8px);
  top: 0;
  z-index: 8;
  width: 220px;
  padding: 8px 10px;
  background: light-dark(#ffffff, #1d232c);
  border: 1px solid var(--wb-border);
  border-radius: 8px;
  box-shadow: 0 8px 24px rgb(0 0 0 / 35%);
  color: var(--wb-text);
  pointer-events: none;
}

.rosterHidden {
  margin-top: 12px;
  border-top: 1px solid var(--wb-border);
  padding-top: 8px;
}

.rosterHiddenHead {
  background: transparent;
  border: 0;
  color: var(--wb-muted);
  cursor: pointer;
  font: inherit;
}

.avatarWrap {
  position: relative;
  width: 32px;
  height: 32px;
  overflow: visible;
}

.avatar {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 32px;
  height: 32px;
  border-radius: 10px;
  font-size: 14px;
  font-weight: 600;
  color: #fff;
  overflow: hidden;
}

.avatar.sm {
  width: 24px;
  height: 24px;
  font-size: 12px;
  border-radius: 8px;
}

.avatar.lg {
  width: 40px;
  height: 40px;
  font-size: 18px;
}

.persona {
  position: relative;
  display: inline-flex;
  flex: none;
  overflow: visible;
  filter: drop-shadow(0 1px 1px rgb(0 0 0 / 22%));
}

.persona.sm { width: 24px; height: 24px; }
.persona.md { width: 32px; height: 32px; }
.persona.lg { width: 40px; height: 40px; }

.personaBody {
  display: block;
  width: 100%;
  height: 100%;
  overflow: visible;
  contain: layout style;
}

.mosaic {
  width: 32px;
  height: 32px;
  display: grid;
  gap: 1px;
  border-radius: 10px;
  overflow: hidden;
  background: var(--wb-border);
}

.mosaic.n2 {
  grid-template-columns: 1fr 1fr;
  grid-template-rows: 1fr;
}

.mosaic.n4 {
  grid-template-columns: 1fr 1fr;
  grid-template-rows: 1fr 1fr;
}

.mosaic .tile {
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 9px;
  font-weight: 600;
  color: #fff;
  min-width: 0;
  min-height: 0;
}

.memberChips {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  padding: 8px 16px 0;
}

.memberChip {
  appearance: none;
  border: 1px solid var(--wb-border);
  background: var(--wb-panel);
  color: var(--wb-text);
  border-radius: 999px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 2px 8px 2px 2px;
  font-size: 12px;

}

.memberChip.isSpeaking {

}

.memberPick {

  gap: 8px;
  margin: 6px 0;
  cursor: pointer;
}

.bubbleWrap.hasAuthor {
  align-items: flex-start;
  gap: 8px;
}

.bubbleCol {
  display: flex;
  flex-direction: column;
  gap: 4px;
  max-width: min(72%, 560px);
}

.authorName {
  font-size: 11px;
  color: var(--wb-muted);
}

.memberError {
  border: 1px solid var(--wb-danger);
  color: var(--wb-danger);
  border-radius: 8px;
  padding: 6px 10px;
  font-size: 12px;
}

.composerField {
  position: relative;
  flex: 1;
  min-width: 0;
}

.mentionMenu {
  position: absolute;
  left: 0;
  bottom: 100%;
  margin: 0 0 4px;
  padding: 4px;
  list-style: none;
  background: var(--wb-panel);
  border: 1px solid var(--wb-border);

}

.mentionMenu button {

  width: 100%;
  text-align: left;
  border: 0;
  background: transparent;
  color: var(--wb-text);
  padding: 6px 8px;
  border-radius: 6px;
  cursor: pointer;
}

.mentionMenu button:hover,
.mentionMenu button.isActive {
  background: var(--wb-hover);
}

.workingDot {
  position: absolute;
  right: -1px;
  bottom: -1px;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #3dd68c;
  box-shadow: 0 0 0 2px var(--wb-panel);
  animation: wb-dot-pulse 1.4s ease-in-out infinite;
}

.avatarWrap.isWorking .avatar,
.avatarWrap.isWorking .mosaic {
  box-shadow: 0 0 0 2px #3dd68c66;
}

.rosterMain {
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.rosterName {
  font-weight: 600;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.rosterPreview {
  color: var(--wb-muted);
  font-size: 12px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.rosterMeta {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 4px;
}

.sessionCount {
  min-width: 16px;
  height: 16px;
  padding: 0 5px;
  border-radius: 999px;
  background: light-dark(#e5eaf0, #2a3340);
  color: var(--wb-muted);
  font-size: 10px;
  line-height: 16px;
  text-align: center;
}

.rosterSessions {
  margin: 0 8px 8px 36px;
  padding: 4px 0 0;
  border-left: 1px solid var(--wb-border);
}

.rosterSessionList {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 1px;
}

.rosterSessionRow {
  display: flex;
  align-items: stretch;
  gap: 2px;
}

.rosterSessionRow .rosterSession {
  flex: 1;
  width: auto;
  min-width: 0;
}

.rosterSession,
.rosterSessionNew {
  appearance: none;
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  border: 0;
  background: transparent;
  color: var(--wb-text);
  font: inherit;
  text-align: left;
  padding: 6px 8px;
  border-radius: 6px;
  cursor: pointer;
}

.rosterSession:hover,
.rosterSessionNew:hover {

}

.rosterSession.isSelected {
  background: light-dark(#dce6fa, #2a3a52);
}

.rosterSessionTitle {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 12px;
}

.rosterSessionMeta {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  flex: none;
}

.rosterSessionsEmpty,
.rosterSessionsMore {
  margin: 0;
  padding: 4px 8px;
  font-size: 12px;
}

.rosterSessionNew {
  color: var(--wb-muted);
  font-size: 12px;
}

.rosterTime {
  color: var(--wb-muted);
  font-size: 11px;
}

.rowMenuBtn {
  appearance: none;
  border: 0;
  background: transparent;
  color: var(--wb-muted);
  cursor: pointer;
  padding: 0 4px;
  font-size: 16px;
  line-height: 1;
}

.rowMenu {
  margin: 0 8px 8px;
  display: flex;
  flex-direction: column;
  border: 1px solid var(--wb-border);
  border-radius: 8px;
  overflow: hidden;
  background: var(--wb-bg);
}

.rowMenu button {
  appearance: none;
  border: 0;
  background: transparent;
  color: var(--wb-text);
  text-align: left;
  padding: 8px 12px;
  cursor: pointer;
  font-size: 12px;
}

.rowMenu button:hover:not(:disabled) {
  background: var(--wb-hover);
}

.rowMenu button:disabled {

  cursor: not-allowed;
}

.renameInput {
  width: 100%;
  border: 1px solid var(--wb-accent);
  background: var(--wb-bg);
  color: var(--wb-text);
  border-radius: 4px;
  font: inherit;
  padding: 2px 6px;
}

.identity {
  display: inline-flex;
  align-items: center;
  gap: 8px;
}

.identityBtn {
  appearance: none;
  border: 0;
  background: transparent;
  color: inherit;
  font: inherit;
  font-weight: inherit;
  padding: 0;
  cursor: pointer;
  border-radius: 8px;
}

.identityBtn:hover {
  opacity: 0.9;
}

.conversation {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  min-height: 0;
}

.conversationHead {
  height: 52px;
  flex: none;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 0 20px;
  border-bottom: 1px solid var(--wb-border);
  font-weight: 600;
}

.conversationBody {
  flex: 1;
  min-height: 0;
  padding: 24px 20px;
  color: var(--wb-muted);
}

.conversationPane {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
}

.headActions {
  display: flex;
  align-items: center;
  gap: 8px;
}

.sessionSwitch {
  position: relative;
  display: inline-flex;
  align-items: center;
  gap: 2px;
}

.sessionSwitchBtn {
  appearance: none;
  max-width: 220px;
  display: inline-flex;
  align-items: baseline;
  gap: 6px;
  border: 1px solid var(--wb-border);
  background: var(--wb-bg);
  color: var(--wb-text);
  border-radius: 8px;
  font: inherit;
  padding: 4px 10px;
  cursor: pointer;
}

.sessionSwitchBtn:hover {
  background: var(--wb-hover);
}

.sessionSwitchLabel {
  color: var(--wb-muted);
  font-size: 11px;
  font-weight: 500;
}

.sessionSwitchTitle {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-weight: 600;
}

.sessionSwitchMenu {
  position: absolute;
  top: calc(100% + 6px);
  right: 0;
  z-index: 5;
  width: min(280px, 70vw);
  border: 1px solid var(--wb-border);
  border-radius: 10px;
  background: var(--wb-panel);
  box-shadow: 0 12px 32px rgb(0 0 0 / 35%);
  padding: 6px;
}

.sessionListItems {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 2px;
  max-height: 240px;
  overflow: auto;
}

.sessionRow {
  display: flex;
  align-items: stretch;
  gap: 2px;
}

.sessionRow .sessionOption {
  flex: 1;
  width: auto;
  min-width: 0;
}

.sessionRowMenuBtn {
  flex: none;
  align-self: center;
}

.sessionRowMenu {
  margin: 0 0 4px;
}

.sessionCurrentMenuBtn {
  flex: none;
}

.sessionCurrentMenuPanel {
  position: absolute;
  top: calc(100% + 6px);
  right: 0;
  z-index: 6;
  min-width: 160px;
  margin: 0;
}

.sessionListEmpty {
  margin: 0;
  padding: 8px;
}

.sessionOption {
  appearance: none;
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  border: 0;
  background: transparent;
  color: var(--wb-text);
  font: inherit;
  text-align: left;
  padding: 8px;
  border-radius: 8px;
  cursor: pointer;
}

.sessionOption:hover {
  background: var(--wb-hover);
}

.sessionOption.isSelected {
  background: light-dark(#e5ecfa, #243044);
}

.sessionOptionMain {
  min-width: 0;
  display: flex;
  align-items: center;
  gap: 6px;
}

.sessionOptionTitle {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.sessionOptionWorking {
  flex: none;
  font-size: 10px;
  color: #3dd68c;
}

.sessionOptionTime {
  flex: none;
  color: var(--wb-muted);
  font-size: 11px;
}

.sessionListNew {
  appearance: none;
  width: 100%;
  margin-top: 4px;
  border: 0;
  background: transparent;
  color: var(--wb-muted);
  font: inherit;
  text-align: left;
  padding: 8px;
  border-radius: 8px;
  cursor: pointer;
}

.sessionListNew:hover {
  background: var(--wb-hover);
  color: var(--wb-text);
}

.sessionListHidden {
  margin: 4px 8px 2px;
}

.hiddenToggle {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 11px;
  font-weight: 500;
  color: var(--wb-muted);
  white-space: nowrap;
  cursor: pointer;
}

.workingBadge {
  font-size: 11px;
  font-weight: 500;
  color: #3dd68c;
  border: 1px solid #3dd68c55;
  border-radius: 999px;
  padding: 1px 8px;
  animation: wb-badge-pulse 1.6s ease-in-out infinite;
}

.avatar.isLive {
  animation: wb-avatar-breathe 1.6s ease-in-out infinite;
}

.visuallyHidden {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
}

.emptyChat {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
  color: var(--wb-muted);
  text-align: center;
  padding: 24px;
}

.emptyChat p {
  margin: 0;
}

.transcript {
  flex: 1;
  min-height: 0;
  overflow: auto;
  padding: 16px 20px 8px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.bubbleWrap {
  display: flex;
  animation: wb-enter 0.22s cubic-bezier(0.16, 1, 0.3, 1);
}

.bubbleWrap.user,
.bubbleWrap.user {
  justify-content: flex-end;
}

.bubbleWrap.assistant {
  justify-content: flex-start;
}

.bubble {
  max-width: min(72%, 560px);
  padding: 8px 12px;
  border-radius: 14px;
  white-space: pre-wrap;
  word-break: break-word;
}

.bubble.user {
  background: #2c4a7c;
  color: #fff;
  border-bottom-right-radius: 4px;
}

.bubble.assistant {
  background: light-dark(#edf0f4, #222830);
  color: var(--wb-text);
  border-bottom-left-radius: 4px;
  white-space: normal;
}

.md {
  display: flex;
  flex-direction: column;
  gap: 0.55em;
}

.md p,
.md ul,
.md ol,
.md blockquote,
.md pre,
.md h1,
.md h2,
.md h3,
.md table {
  margin: 0;
}

.md h1,
.md h2,
.md h3 {
  font-size: 13px;
  font-weight: 650;
}

.md ul,
.md ol {
  padding-left: 1.25em;
}

.md blockquote {
  border-left: 3px solid var(--wb-border);
  padding-left: 8px;
  color: var(--wb-muted);
}

.md a {
  color: var(--wb-accent);
}

.md code {
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 0.92em;
  background: light-dark(#ffffff, #12151a);
  border-radius: 4px;
  padding: 0.05em 0.35em;
}

.md pre {
  background: light-dark(#ffffff, #12151a);
  border: 1px solid var(--wb-border);
  border-radius: 8px;
  padding: 8px 10px;
  overflow: auto;
  white-space: pre-wrap;
}

.md pre code {
  background: transparent;
  padding: 0;
}

.md img {
  max-width: 100%;
  border-radius: 8px;
}

.mdTableWrap {
  overflow-x: auto;
  max-width: 100%;
}

.md table {
  border-collapse: collapse;
  width: max-content;
  min-width: 100%;
  font-size: 12px;
}

.md th,
.md td {
  border: 1px solid var(--wb-border);
  padding: 5px 8px;
  vertical-align: top;
}

.md th {
  background: light-dark(#f3f5f8, #1b2027);
  font-weight: 600;
}

.md tbody tr:nth-child(even) td {
  background: light-dark(#f6f7f9, #1a1e24);
}

.bubbleWrap.isPending .bubble {
  opacity: 0.7;
}

.bubbleWrap.isFailed .bubble {
  outline: 1px solid var(--wb-danger);
}

.foldRow,
.toolRow,
.workingRow {
  align-self: flex-start;
  max-width: min(72%, 560px);
  color: var(--wb-muted);
  font-size: 12px;
}

.foldRow {
  background: light-dark(#f3f5f8, #1b2027);
  border-radius: 8px;
  padding: 4px 8px;
}

.foldRow summary {
  cursor: pointer;
}

.foldBody {
  margin: 6px 0 0;
  white-space: pre-wrap;
  font: inherit;
}

.toolRow {
  border: 1px solid var(--wb-border);
  border-radius: 8px;
  padding: 4px 8px;
}

.workingRow {
  display: inline-flex;
  align-items: center;
  gap: 8px;
}

.typingRow {
  align-items: flex-start;
}

.typingBubble {
  width: max-content;
  min-width: 44px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 10px 12px;
}

.dots {
  display: inline-flex;
  gap: 4px;
  align-items: flex-end;
  height: 10px;
}

.dots i {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--wb-muted);
  display: block;
  animation: wb-dot 1s infinite ease-in-out;
}

.dots i:nth-child(2) { animation-delay: 0.15s; }
.dots i:nth-child(3) { animation-delay: 0.3s; }

@keyframes wb-dot {
  0%, 80%, 100% { opacity: 0.35; transform: translateY(0); }
  40% { opacity: 1; transform: translateY(-3px); }
}

@keyframes wb-enter {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes wb-dot-pulse {
  0%, 100% { transform: scale(1); opacity: 1; }
  50% { transform: scale(1.25); opacity: 0.65; }
}

@keyframes wb-badge-pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.55; }
}

@keyframes wb-avatar-breathe {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.06); }
}

@media (prefers-reduced-motion: reduce) {
  .bubbleWrap,
  .dots i,
  .workingDot,
  .workingBadge,
  .avatar.isLive {
    animation: none;
  }
}

.composer {
  flex: none;
  border-top: 1px solid var(--wb-border);
  padding: 10px 16px 14px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.composerRow {
