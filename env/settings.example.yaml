# Template only. Live routing is applied from
# ~/workspace/dsh/plugin/.shared/settings.yaml (not this file).
# Never put literal API keys or machine-local baseURL here.

ui-onboarding:
  welcomeNoticeVersion: 2026-08-13.1
agent-default-model:
  provider: anthropic
  model: grok-4.6
  reasoningEffort: xhigh
llm-pi-ai:
  providers:
    anthropic:
      displayName: Anthropic
      apiKeyEnv: ANTHROPIC_API_KEY
      api: openai-completions
      # baseURL: https://<openai-compatible-endpoint>/v1
      reasoning: xhigh
      compat:
        thinkingFormat: openai
        supportsReasoningEffort: true
      models:
        - id: grok-4.6
          name: grok-4.6
          contextWindow: 2000000
          maxTokens: 128000
          input:
            - text
            - image
          reasoningEfforts:
            off: null
            low: low
            medium: medium
            high: high
            xhigh: xhigh
