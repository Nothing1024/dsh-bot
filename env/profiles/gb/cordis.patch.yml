# User overlay for profile `gb`.
# tool-session already ships session-tool-local / tool-session
# via its own bundle patch. Do not re-insert those rows here (double mount).
#
# Port is 3084 (not the bundle default 3080). Id-targeted patch replaces
# the named entry's whole config — restate unchanged fields. Keep webUrl
# in sync with env/boot.sh GW_PORT and env/cli.patch.yml.
- id: session-tool-local
  config:
    allowAllScope: 'top-level'
    cliAllowAll: true
    readMaxBlocks: 500
    listMaxRows: 100
    webUrl: 'http://127.0.0.1:3084'
    allowOthersToWrite: 'workspace'
    showDelegated: true
    # Plugin-side list hide (session-tool-local Config). Official web rail
    # does NOT honor this (calibrated on 0.1.1-rc.2; still true on 0.1.7-rc.1).
    hiddenPrefixes:
      - '~'

# Settings.yaml is the live source. Pin composition fallback so a missing
# settings document does not start agents on deepseek-flash.
- id: agent-default-model
  config:
    provider: anthropic
    model: deepseek-flash
    reasoningEffort: max

# Official DeepSeek chat + search are disabled so they cannot bypass deepseek-flash.
- id: llm-deepseek
  disabled: true
- id: web-search-deepseek
  disabled: true
- id: ui-settings-general
  name: "@deepseek-ai/dsh-client-ui-settings-general"
  config:
    welcomeNoticeVersion: 2026-09-28.1
- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      anthropic:
        displayName: panpanpan new-api
        apiKeyEnv: ANTHROPIC_API_KEY
        api: openai-completions
        baseURL: https://panpanpan.59188888.xyz/v1
        compat:
          thinkingFormat: openai
          supportsReasoningEffort: true
          supportsDeveloperRole: false
        models:
          - id: claude-opus-5-5
            name: claude-opus-5-5
            contextWindow: 1048576
            input:
              - text
              - image
          - id: grok-4.7
            name: grok-4.7
            contextWindow: 500000
            maxTokens: 64000
            input:
              - text
              - image
            reasoningEfforts:
              off: null
              low: low
              medium: medium
              high: high
              xhigh: xhigh
          - id: deepseek-flash
            name: deepseek-flash
            contextWindow: 1048576
            maxTokens: 384000
            input:
              - text
              - image
            reasoningEfforts:
              off: null
              low: low
              medium: medium
              high: high
              max: max
          - id: claude-opus-4-6
            name: claude-opus-4-6
            contextWindow: 1048576
            input:
              - text
              - image
          - id: swe-2
            name: swe-2
            contextWindow: 1048576
            input:
              - text
              - image
        defaultContextWindow: 200000
        defaultMaxTokens: 32768
